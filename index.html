<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<script async src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
*{background:transparent}
::-webkit-scrollbar{display:none;width:0;height:0}

:root{
  --accent-rgb:139,92,246;
  --accent-light:196,160,255;
  --color-main:rgba(var(--accent-rgb),0.35);
  --color-border:rgba(var(--accent-rgb),0.35);
  --color-shadow:rgba(var(--accent-rgb),0.35);
  --color-notify-main:rgb(var(--accent-rgb));
  --color-notify-shadow:rgba(var(--accent-rgb),0.35);
  --color-mainSolid:rgb(var(--accent-rgb));
  --color-tab:rgba(var(--accent-rgb),0.35);
  --bg-deep:#0b0a10;
  --bg-mid:#111018;
  --bg-panel:rgba(14,12,20,0.97);
  --text-primary:rgba(255,255,255,0.95);
  --text-secondary:rgba(255,255,255,0.55);
  --item-height:3.1vh;
  --tabs-height:3.6vh;
  --banner-height:10vh;
  --font:'Rubik','Geist','Poppins',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

/* ---------- conteneur ---------- */
.menu-root{font-family:var(--font);color:var(--text-primary);position:fixed;width:34vh;z-index:1000;border-radius:0.5vh;box-shadow:0 0.8vh 2.6vh rgba(0,0,0,0.55)}
.menu-banner{border-radius:0.5vh 0.5vh 0 0;overflow:hidden;padding:0}
.menu-banner img{width:100%;height:var(--banner-height);object-fit:cover;display:block}
.menu-body{background:var(--bg-panel);overflow:hidden}

/* ---------- onglets ---------- */
.menu-tabs{display:flex;background:var(--bg-deep);padding:0;gap:0;height:var(--tabs-height);overflow:hidden;border-bottom:0.05vh solid rgba(255,255,255,0.06)}
.tab-item{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.2vh;font-weight:600;letter-spacing:0.01em;white-space:nowrap;color:rgba(255,255,255,0.88);user-select:none;position:relative;transition:color 0.2s ease}
.tab-item.active{color:#fff;background:linear-gradient(100deg,rgba(var(--accent-rgb),0.95) 0%,rgba(var(--accent-rgb),0.45) 55%,rgba(var(--accent-rgb),0.10) 100%);box-shadow:inset 0 -0.2vh 0 rgb(var(--accent-rgb))}

/* ---------- barre de défilement ---------- */
.menu-scrollbar{position:absolute;left:-1.2vh;top:calc(var(--banner-height) + var(--tabs-height) + 0.4vh);width:0.6vh;height:39vh;transition:opacity 0.3s cubic-bezier(0.4,0,0.2,1)}
.scrollbar-track{width:100%;height:100%;background-color:rgba(0,0,0,0.8);border-radius:0.4vh;position:relative;transition:0.5s}
.scrollbar-thumb{position:absolute;top:0;left:0;width:100%;background-color:var(--color-mainSolid);border-radius:0.2vh;transition:top 0.25s ease-out,height 0.25s ease-out;min-height:2vh}

/* ---------- liste ---------- */
.menu-items{position:relative;max-height:calc(var(--item-height) * 12);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0.4vh 0}
.menu-items::-webkit-scrollbar{display:none}

/* barre de sélection : dégradé de l'accent vers le fond */
.selection-highlight{position:absolute;left:0;right:0;height:var(--item-height);border-radius:0;
  background:linear-gradient(90deg,rgba(var(--accent-rgb),0.95) 0%,rgba(var(--accent-rgb),0.55) 40%,rgba(var(--accent-rgb),0.08) 100%);
  box-shadow:inset 0.12vh 0 0 rgba(255,255,255,0.22);
  z-index:0;pointer-events:none;will-change:top;transform:translateZ(0)}

.menu-item{display:flex;justify-content:space-between;align-items:center;padding:0 1.5vh;height:var(--item-height);box-sizing:border-box;position:relative;z-index:1}
.item-label{display:flex;align-items:center;gap:0.5vh;min-width:0;flex:1}
.menu-item .name{font-size:1.25vh;color:var(--text-primary);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-item.is-selected .name{font-weight:600;color:#fff}
.slider-val{color:rgba(255,255,255,0.75);font-size:1.1vh;font-weight:500}
.components-container{display:flex;align-items:center;gap:0.8vh;flex-shrink:0}
.component{display:flex;align-items:center}
.caret-icon{font-size:1.2vh;color:var(--text-secondary)}
.menu-item.is-selected .caret-icon{color:#fff}

/* ---------- interrupteur ---------- */
.toggle-switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.toggle-switch input{position:absolute;opacity:0;width:0;height:0}
.toggle-track{display:block;width:3.9vh;height:1.95vh;background:#26242e;border-radius:1vh;position:relative;transition:background 0.22s ease,border-color 0.22s ease;border:0.1vh solid rgba(255,255,255,0.10);box-sizing:border-box}
.toggle-thumb{position:absolute;top:50%;left:0.25vh;transform:translateY(-50%);width:1.35vh;height:1.35vh;border-radius:50%;background:#8a8794;transition:left 0.22s ease,background 0.22s ease}
.toggle-switch input:checked ~ .toggle-track{background:rgba(var(--accent-rgb),0.45);border-color:rgb(var(--accent-rgb))}
.toggle-switch input:checked ~ .toggle-track .toggle-thumb{left:calc(100% - 1.35vh - 0.25vh);background:rgb(var(--accent-light))}

/* ---------- slider ---------- */
.range-component{position:relative;width:9vh;height:1.6vh;display:flex;align-items:center}
.range-track{position:absolute;left:0;width:100%;height:0.35vh;background:rgba(255,255,255,0.15);border-radius:0.2vh;z-index:1}
.range-fill{position:absolute;left:0;height:0.35vh;background:rgb(var(--accent-light));border-radius:0.2vh;z-index:2;pointer-events:none}
.range-component input[type="range"]{-webkit-appearance:none;appearance:none;position:relative;width:100%;height:0.35vh;background:transparent;outline:none;margin:0;padding:0;cursor:pointer;z-index:3}
.range-component input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:1.25vh;height:1.25vh;border-radius:50%;background:#fff;box-shadow:0 0 0.1vh rgba(0,0,0,0.4);margin-top:-0.125vh;cursor:pointer}
.range-component input[type="range"]::-moz-range-thumb{width:1.25vh;height:1.25vh;border-radius:50%;background:#fff;border:none;cursor:pointer}

/* ---------- sélecteur < valeur > ---------- */
.scroll-value{display:flex;align-items:center;gap:0.7vh;font-size:1.2vh;font-weight:600;color:rgba(255,255,255,0.72);max-width:17vh}
.scroll-value .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll-value .arrow{opacity:0;font-weight:600}
.menu-item.is-selected .scroll-value{color:#fff}
.menu-item.is-selected .scroll-value .arrow{opacity:1}

/* ---------- séparateur ---------- */
.separator-container{display:flex;align-items:center;height:var(--item-height);padding:0 1.5vh;gap:1vh;box-sizing:border-box}
.separator-bar{flex:1;height:0.1vh;background:rgba(255,255,255,0.6)}
.separator-text{color:#fff;font-size:1.1vh;font-weight:500;white-space:nowrap;letter-spacing:0.04em}

/* ---------- pied ---------- */
.menu-footer{background-color:var(--bg-deep);display:flex;justify-content:space-between;align-items:center;padding:0 1.5vh;height:2.4vh;box-sizing:border-box;font-size:1.05vh;border-top:0.05vh solid rgba(255,255,255,0.06);border-radius:0 0 0.5vh 0.5vh;overflow:hidden}
.footer-brand{font-size:1.0vh;color:var(--text-secondary);font-weight:500}
.footer-counter{font-size:1.0vh;color:rgb(var(--accent-light));font-weight:600}

/* ---------- saisie ---------- */
.input-overlay{position:fixed;top:0;left:0;transform:none;width:100%;height:100%;background:rgb(0,0,0,0.5);z-index:999999;color:white;font-weight:500;font-family:var(--font);font-size:1.2vh}
.input-box{background-color:rgba(14,12,20,0.92);border-radius:0.25vh;display:flex;flex-direction:column;position:fixed;bottom:17.5vh;left:50%;transform:translateX(-50%);height:auto;width:55vh;overflow:hidden}
.input-box > .input-header{padding:0.8vh 1vh;border-bottom:0.1vh solid var(--color-mainSolid);width:100%;font-size:1.2vh;background:linear-gradient(90deg,rgba(var(--accent-rgb),0.35) 0%,rgba(var(--accent-rgb),0) 100%)}
.input-header-inner{display:flex;align-items:center;gap:0.5vh}
.input-header-text{color:white}
.input-box input{padding:1.25vh 1vh;border:none;outline:none;background:transparent;color:white;font-size:1.2vh;display:block;margin:0}
body,main{all:unset;display:block}

/* ---------- notifications ---------- */
.notify-stack{position:fixed;bottom:2vh;right:2vh;display:flex;flex-direction:column;gap:0.8vh;z-index:9999;pointer-events:none}
.notify-card{background:rgba(14,12,20,0.78);border-left:0.25vh solid var(--accent);color:#fff;font-family:var(--font);width:32vh;max-width:85vw;overflow:hidden;outline:none;border-top:none;border-right:none;border-bottom:none}
.notify-body{display:flex;flex-direction:row;align-items:center;padding:1vh 1.2vh 0.9vh;gap:1vh}
.notify-icon-wrap{width:2.2vh;height:2.2vh;min-width:2.2vh;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notify-icon{font-size:1.1vh;color:#fff;line-height:1;display:block;text-align:center;width:1.1vh;height:1.1vh}
.notify-text{display:flex;flex-direction:column;gap:0.2vh;min-width:0}
.notify-header{font-size:1.35vh;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.02em}
.notify-message{font-size:1.05vh;font-weight:400;color:rgba(200,200,200,0.85);line-height:1.4}
.notify-bar{height:0.25vh;width:100%;background:rgba(255,255,255,0.06)}
.notify-bar-fill{height:100%;background:var(--accent);transition:width 0.1s linear;will-change:width}

/* ---------- freecam ---------- */
.hovering-text-wrap{position:fixed;bottom:7.5vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;outline:none;min-width:18.52vh;font-family:var(--font)}
.hovering-text-list{list-style:none;margin:0;padding:0;text-align:center;pointer-events:none;user-select:none;max-height:calc(9 * (1.3vh * 1.3 + 0.37vh));overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;display:flex;flex-direction:column;align-items:center;scroll-behavior:smooth}
.hovering-text-item{padding:0.185vh 0;font-size:1.3vh;line-height:1.3;transition:transform 0.22s cubic-bezier(.2,.9,.2,1),color 0.22s cubic-bezier(.2,.9,.2,1),letter-spacing 0.22s;transform-origin:center;white-space:nowrap;min-width:27.78vh;font-weight:600;color:#fff}
.hovering-text-inactive{color:#fff;transform:scale(0.98);letter-spacing:0}
.hovering-text-selected{transform:scale(1.03);font-weight:600;letter-spacing:0.015vh;color:var(--color-mainSolid)}
li{display:list-item;text-align:-webkit-match-parent}
ul{list-style-type:disc}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
const app=document.getElementById('app');
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const E_OUT='cubic-bezier(.33,1,.68,1)',E_IN='cubic-bezier(.32,0,.67,0)';

/* ---------- transitions (équivalent de svelte/transition) ---------- */
function tr(el,{kind,dur,start=.94,x=0,y=0,base=''},out){
  const hid={opacity:0},shown={opacity:1};
  if(kind==='scale'){hid.transform=`${base} scale(${start})`;shown.transform=`${base} scale(1)`}
  if(kind==='fly'){hid.transform=`${base} translate(${x}px,${y}px)`;shown.transform=`${base} translate(0px,0px)`}
  return el.animate(out?[shown,hid]:[hid,shown],{duration:dur,easing:kind==='fade'?'linear':out?E_IN:E_OUT,fill:out?'forwards':'none'});
}
function present(s,show,build,plan){
  if(show){
    if(s.els){if(s.out){(s.anims||[]).forEach(a=>a&&a.reverse());s.out=false;s.g++}return}
    s.els=(typeof build==='function')?build():s.els;
    s.out=false;s.anims=(typeof plan==='function')?plan(s.els,false):[];
  }else if(s.els&&!s.out){
    const els=s.els,g=++s.g;s.out=true;
    /* plan peut manquer (appel a 2 arguments) : on ne doit JAMAIS lever,
       sinon s.out reste bloque true et le panneau n'est jamais retire. */
    s.anims=(typeof plan==='function')?plan(els,true):[];
    const done=()=>{if(s.g===g){els.forEach(e=>e.remove());s.els=null;s.out=false}};
    /* .then(done,done) : nettoyage aussi si une animation est annulee
       (avant : .catch(()=>{}) laissait l'etat bloque "out" a jamais). */
    Promise.all(s.anims.map(a=>a&&a.finished)).then(done,done);
  }
}

/* ================= MENU PRINCIPAL (Base) ================= */
const B={cur:0,menu:[],tabs:['Main Menu'],tab:0,top:'23vh',left:'6.25vh',
  banner:'https://raw.githubusercontent.com/tony48121/Dragon-Ball-jul/refs/heads/main/jul_menu_v2.png',
  trackH:0,thumbTop:0,thumbH:24,over:false,hlTop:0,lock:null,rows:[],slot:{g:0}};
const live=()=>B.root&&B.root.isConnected;
const types=o=>Array.isArray(o.type)?o.type:[o.type];
const sig=o=>o.type=='divider'?'d':types(o).join(',');

function buildMenu(){
  const r=$('div','menu-root');r.style.cssText=`top:${B.top};left:${B.left};transform-origin:top left`;
  const ban=$('div','menu-banner'),img=$('img');img.alt='';img.src=B.banner;ban.append(img);
  const tabs=$('div','menu-tabs');
  const sb=$('div','menu-scrollbar'),trk=$('div','scrollbar-track'),thumb=$('div','scrollbar-thumb');trk.append(thumb);sb.append(trk);
  const body=$('div','menu-body'),list=$('div','menu-items');list.onscroll=onScroll;
  const hl=$('div','selection-highlight');hl.style.top=B.hlTop+'px';list.append(hl);body.append(list);
  const foot=$('div','menu-footer'),cnt=$('span','footer-counter');foot.append($('span','footer-brand','JuL - Menu'),cnt);
  r.append(ban,tabs,sb,body,foot);app.append(r);
  Object.assign(B,{root:r,img,tabsEl:tabs,trackEl:trk,thumb,list,hl,cnt,rows:[]});
  renderTabs();applyBar();
  return [r];
}
const planMenu=(e,out)=>[];

function renderTabs(){
  if(!live())return;
  B.tabsEl.replaceChildren(...B.tabs.map((t,i)=>{
    const d=$('div','tab-item'+(i===B.tab?' active':''),t);
    if(B.tabs.length===1)d.style.cssText='min-width:8vh;flex-grow:0;flex-basis:auto';
    return d;
  }));
}
const comp=h=>{const d=$('div','component');d.innerHTML=h;return d};
function mkRow(o){
  if(o.type=='divider'){const d=$('div','separator-container');d.append($('div','separator-bar'),$('div','separator-text'),$('div','separator-bar'));return d}
  const r=$('div','menu-item'),lab=$('div','item-label'),cc=$('div','components-container');
  lab.append($('span','name'));
  types(o).forEach(t=>{
    if(t==='submenu')cc.append(comp('<i class="ph ph-caret-right caret-icon"></i>'));
    else if(t==='checkbox'){const c=comp('<label class="toggle-switch"><input type="checkbox"><span class="toggle-track"><span class="toggle-thumb"></span></span></label>');
      c.querySelector('input').onchange=e=>{r._o.checked=e.target.checked};cc.append(c)}
    else if(t==='slider'){const c=comp('<div class="range-component"><div class="range-track"></div><div class="range-fill"></div><input type="range"></div>');
      c.querySelector('input').oninput=e=>{r._o.value=+e.target.value;patchRow(r,r._o,r._i)};cc.append(c)}
    else if(t==='scroll')cc.append(comp('<div class="scroll-value"><span class="arrow">&lt;</span><span class="val"></span><span class="arrow">&gt;</span></div>'));
  });
  r.append(lab,cc);return r;
}
function patchRow(r,o,i){
  r._o=o;r._i=i;
  if(o.type=='divider'){r.children[1].textContent=o.label??'';return}
  r.classList.toggle('is-selected',B.cur===i);
  const nm=r.querySelector('.name');nm.textContent=o.label??'';
  if(types(o).includes('slider')&&B.cur===i)nm.append(' ',$('span','slider-val',': '+o.value));
  const cb=r.querySelector('input[type=checkbox]');if(cb)cb.checked=!!o.checked;
  const rg=r.querySelector('input[type=range]');
  if(rg){
    [['min',o.min],['max',o.max],['step',o.step]].forEach(([k,v])=>v==null?rg.removeAttribute(k):rg.setAttribute(k,v));
    rg.value=o.value??'';
    r.querySelector('.range-fill').style.width=o.max>o.min?((o.value-o.min)/(o.max-o.min))*100+'%':'0%';
  }
  const sc=r.querySelector('.scroll-value .val');
  if(sc)sc.textContent=o.options?.[o.selected-1]?.label||o.options?.[0]?.label||(!o.options||o.options.length===0?'Loading...':'None');
}
function renderItems(){
  B.menu.forEach((o,i)=>{
    let row=B.rows[i];
    if(!row||row._s!==sig(o)){const n=mkRow(o);n._s=sig(o);row?row.replaceWith(n):B.list.append(n);row=B.rows[i]=n}
    patchRow(row,o,i);
  });
  while(B.rows.length>B.menu.length)B.rows.pop().remove();
}
function updCounter(){
  const s=B.menu.reduce((a,o,i)=>(o?.type!=='divider'&&a.push(i),a),[]);
  let n=0;
  if(s.length){const p=s.indexOf(B.cur);n=p!==-1?p+1:s.reduce((b,x,k)=>Math.abs(x-B.cur)<Math.abs(s[b]-B.cur)?k:b,0)+1}
  B.cnt.textContent=`${n}/${s.length}`;
}
function applyBar(){
  if(!B.thumb)return;
  B.trackEl.style.height=B.trackH+'px';B.thumb.style.top=B.thumbTop+'px';B.thumb.style.height=B.thumbH+'px';
}
function bar(){
  if(!live()||B.lock)return;
  B.lock=requestAnimationFrame(()=>{
    B.lock=null;const L=B.list;if(!live())return;
    const cH=L.clientHeight,sH=L.scrollHeight,n=B.menu.length;
    B.trackH=Math.round(cH);B.over=sH>cH+1;
    if(B.over){
      B.thumbH=Math.min(Math.max(100,Math.round(cH/sH*B.trackH)),B.trackH);
      const mx=Math.max(0,sH-cH),ra=mx?clamp(L.scrollTop/mx,0,1):0,sc=Math.max(0,B.trackH-B.thumbH);
      B.thumbTop=clamp(Math.round(sc*ra),0,sc);
    }else{
      B.thumbH=Math.min(n<=7?B.trackH:Math.max(100,Math.round(B.trackH*(7/n))),B.trackH);
      const c=Math.max(1,n),ra=c>1?clamp(B.cur,0,c-1)/(c-1):0,sc=Math.max(0,B.trackH-B.thumbH);
      B.thumbTop=clamp(Math.round(sc*ra),0,sc);
    }
    applyBar();
  });
}
function onScroll(){
  const L=B.list;if(!L||!B.over||B.lock)return;
  B.lock=requestAnimationFrame(()=>{
    B.lock=null;
    const mx=Math.max(0,L.scrollHeight-L.clientHeight),ra=mx?clamp(L.scrollTop/mx,0,1):0,sc=Math.max(0,B.trackH-B.thumbH);
    B.thumbTop=clamp(Math.round(sc*ra),0,sc);applyBar();
  });
}
function moveHl(t){
  const h=B.hl;if(!h){B.hlTop=t;return}
  const from=parseFloat(getComputedStyle(h).top)||B.hlTop;
  h.getAnimations().forEach(a=>a.cancel());
  B.hlTop=t;h.style.top=t+'px';
  h.animate([{top:from+'px'},{top:t+'px'}],{duration:220,easing:'ease-out',fill:'forwards'});
}
const curRow=()=>B.menu[B.cur]&&B.menu[B.cur].type!='divider'?B.rows[B.cur]:null;
function refresh(){
  if(!live())return;
  renderItems();updCounter();
  const el=curRow();if(el){moveHl(el.offsetTop);el.scrollIntoView({behavior:'smooth',block:'nearest'})}
  bar();
}
const showMenu=()=>{present(B.slot,true,buildMenu,planMenu);refresh()};
/* Fermeture DETERMINISTE : le panneau est retire immediatement, sans animation
   ni etat "out" pouvant rester bloque. C'est ce qui garantit que le menu peut
   se fermer pendant qu'une notification s'affiche a cote (la fenetre NUI
   reste visible dans ce cas, donc la page doit masquer le panneau elle-meme). */
function hideMenuNow(){
  const s=B.slot;
  s.g++;                 /* invalide la suppression en attente d'un hide precedent */
  s.out=false;
  s.anims=[];
  if(s.els){s.els.forEach(e=>e.remove());s.els=null}
}

/* ================= SAISIE (Input) ================= */
const I={title:'Vehicle Model',value:'',blocking:false,slot:{g:0}};
function buildInput(){
  const ov=$('div','input-overlay'),box=$('div','input-box'),head=$('div','input-header'),inner=$('div','input-header-inner');
  const inp=$('input');inp.type='text';inp.oninput=()=>{I.value=inp.value};
  inner.append($('div','input-header-text'));head.append(inner);box.append(head,inp);ov.append(box);app.append(ov);
  return [ov,box];
}
const planInput=(e,out)=>[tr(e[0],{kind:'fade',dur:400},out),tr(e[1],{kind:'scale',start:.94,dur:480,base:'translateX(-50%)'},out)];
function inputUI(show){
  present(I.slot,show,buildInput,planInput);
  const e=I.slot.els;if(!e)return;
  e[1].querySelector('.input-header-text').textContent='JuL Menu - '+(I.title??'');
  e[1].querySelector('input').value=I.value??'';
}
const unblock=()=>setTimeout(()=>{I.blocking=false},350);

/* ================= FREECAM ================= */
const F={h:0,w:0,v:0,wl:['WEAPON_TRANQUILIZER'],vl:['Dump'],opts:[],slot:{g:0}};
function buildFreecam(){
  const wrap=$('div','hovering-text-wrap'),ul=$('ul','hovering-text-list');
  ul.style.webkitMaskImage='linear-gradient(transparent 0%, black 0%, black 95%, transparent 100%)';wrap.append(ul);
  const cr=$('div');cr.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:0.9259vh;height:0.9259vh;pointer-events:none;z-index:10000;display:block';
  const h=$('div'),v=$('div');
  h.style.cssText='position:absolute;top:50%;left:0;width:100%;height:0.185vh;background-color:white;transform:translateY(-50%)';
  v.style.cssText='position:absolute;left:50%;top:0;width:0.185vh;height:100%;background-color:white;transform:translateX(-50%)';
  cr.append(h,v);app.append(wrap,cr);return [wrap,cr];
}
const planFreecam=(e,out)=>[tr(e[0],{kind:'fly',y:8,dur:350,base:'translateX(-50%)'},out),tr(e[1],{kind:'fade',dur:350},out)];
function renderFreecam(){
  const e=F.slot.els;if(!e)return;
  const ul=e[0].firstChild,W='#fff',R='var(--color-mainSolid)';
  const sp=(t,c)=>{const s=$('span','',t);s.style.color=c;return s};
  F.opts.forEach((o,i)=>{
    let li=ul.children[i];if(!li){li=$('li');ul.append(li)}
    const sel=i===F.h,lb=String(o.label??'');
    li.className='hovering-text-item '+(sel?'hovering-text-selected':'hovering-text-inactive');
    li.style.color='white';li.id='hovering-text-opt-'+i;
    li.dataset.id=lb.toLowerCase().replace(/\s+/g,'_');li.dataset.data=lb;li.setAttribute('aria-current',sel?'true':'false');
    const car=lb==='Spawn Car',gun=lb==='Shoot Weapon';
    li.replaceChildren(...(!sel?[sp(lb,W)]:(car||gun)
      ?[sp('-',W),` ${lb} (`,sp(car?F.vl[F.v]:F.wl[F.w],R),') ',sp('-',W)]
      :[sp('-',W),' ',sp(lb,R),' ',sp('-',W)]));
  });
  while(ul.children.length>F.opts.length)ul.lastChild.remove();
  const el=ul.children[F.h];if(!el)return;
  if(ul.scrollHeight>ul.clientHeight){
    const t=el.offsetTop,b=t+el.offsetHeight,vt=ul.scrollTop,vb=vt+ul.clientHeight;
    if(t<vt)ul.scrollTo({top:t,behavior:'smooth'});
    else if(b>vb)ul.scrollTo({top:b-ul.clientHeight,behavior:'smooth'});
  }else el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ================= NOTIFICATIONS ================= */
const NC={info:{icon:'fa-info',color:'#3d9bff'},error:{icon:'fa-times',color:'#ff3d3d'},success:{icon:'fa-check',color:'#3ddc68'}};
const stack=$('div','notify-stack');app.append(stack);
function flip(mutate){
  const f=new Map([...stack.children].map(c=>[c,c.getBoundingClientRect()]));
  mutate();
  [...stack.children].forEach(c=>{
    const o=f.get(c);if(!o)return;
    const n=c.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;
    if(dx||dy)c.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:300,easing:E_OUT});
  });
}
function dismiss(card){
  flip(()=>{
    const {offsetWidth:w,offsetHeight:h,offsetLeft:l,offsetTop:t}=card;
    Object.assign(card.style,{position:'absolute',boxSizing:'border-box',left:l+'px',top:t+'px',width:w+'px',height:h+'px'});
  });
  tr(card,{kind:'fly',x:80,dur:250},true).finished.then(()=>card.remove()).catch(()=>{});
}
function notify(header,message,duration,type){
  const cfg=NC[type]||NC.info,card=$('div','notify-card');
  card.style.setProperty('--accent',cfg.color);
  card.innerHTML=`<div class="notify-body"><div class="notify-icon-wrap"><i class="fa ${cfg.icon} notify-icon"></i></div><div class="notify-text"><span class="notify-header"></span><span class="notify-message"></span></div></div><div class="notify-bar"><div class="notify-bar-fill" style="width:100%"></div></div>`;
  card.querySelector('.notify-header').textContent=header;
  card.querySelector('.notify-message').textContent=message??'';
  flip(()=>stack.prepend(card));
  tr(card,{kind:'fly',x:80,dur:350},false);
  const fill=card.querySelector('.notify-bar-fill'),step=100/(duration/100);let p=100;
  const iv=setInterval(()=>{
    if(p>0){p=Math.max(p-step,0);fill.style.width=p+'%'}
    else{clearInterval(iv);setTimeout(()=>dismiss(card),100)}
  },100);
}

/* ================= MESSAGES DU JEU ================= */
addEventListener('message',e=>{
  const d=e.data||{};
  switch(d.action){
    case 'setCurrent':B.cur=d.current-1;B.menu=d.menu||[];showMenu();break;
    case 'showMenu':d.visible?showMenu():hideMenuNow();break;
    case 'setTabs':B.tabs=d.tabs||[];B.tab=d.index;renderTabs();break;
    case 'setTabIndex':B.tab=d.index||0;renderTabs();break;
    case 'resetTabs':B.tabs=['Main Menu'];B.tab=0;renderTabs();break;
    case 'setMenuPos':
      if(d.x!==undefined)B.left=d.x+'vh';
      if(d.y!==undefined)B.top=d.y+'vh';
      if(live()){B.root.style.left=B.left;B.root.style.top=B.top}break;
    case 'setBanner':if(d.url){B.banner=d.url;if(live())B.img.src=d.url}break;
    case 'setMenuColor':{
      const r=d.r??139,g=d.g??92,b=d.b??246,s=document.documentElement.style;
      const lt=v=>Math.round(v+(255-v)*0.55);
      s.setProperty('--accent-rgb',`${r},${g},${b}`);
      s.setProperty('--accent-light',`${lt(r)},${lt(g)},${lt(b)}`);break}
    case 'showInputPrompt':
      I.title=d.title;I.value=d.showInput?d.value:'';inputUI(!!d.showInput);
      if(d.showInput)I.blocking=true;else unblock();break;
    case 'hideInputPrompt':inputUI(false);unblock();break;
    case 'updateInputPrompt':I.title=d.title;I.value=d.value;inputUI(!!I.slot.els&&!I.slot.out);break;
    case 'displayFreecam':
      F.opts=d.options||[];F.wl=d.weaponOptions||F.wl;F.vl=d.vehicleOptions||F.vl;
      if(d.weaponIndex!==undefined)F.w=d.weaponIndex-1;
      if(d.vehicleIndex!==undefined)F.v=d.vehicleIndex-1;
      present(F.slot,!!d.visible,buildFreecam,planFreecam);renderFreecam();break;
    case 'updateWeapon':F.w=d.index-1;renderFreecam();break;
    case 'updateVehicle':F.v=d.index-1;renderFreecam();break;
    case 'scroll':
      if(F.opts.length){F.h=(F.h+(d.direction==='up'?-1:1)+F.opts.length)%F.opts.length;renderFreecam()}break;
    case 'notify':notify(d.header||'Info',d.message,d.duration||4000,d.type||'info');break;
  }
});
})();
</script>
