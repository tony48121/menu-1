    }

    function setKeybinds(d) {
        var rows = list(d.rows);
        var el = ensureKeybinds();
        var ul = el.querySelector('.kbl-rows');
        if (!rows.length) { clearEl(ul); el.hidden = true; return; }
        clearEl(ul);
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i] || {};
            var st = (r.state === 'on' || r.state === 'off') ? r.state : 'none';
            var li = document.createElement('li');
            li.className = 'kbl-bind';
            li.setAttribute('data-state', st);
            var a = document.createElement('span');
            a.className = 'kbl-act';
            a.textContent = String(r.label == null ? '' : r.label);
            var s = document.createElement('span');
            s.className = 'kbl-status';
            s.textContent = st === 'none' ? '' : st;
            var k = document.createElement('b');
            k.className = 'kbl-key';
            k.textContent = String(r.key == null ? '' : r.key);
            li.appendChild(a); li.appendChild(s); li.appendChild(k);
            ul.appendChild(li);
        }
        el.hidden = false;
        applyZoom();
    }

    /* ---------------- ecran de chargement ---------------- */
    function ensureLoading() {
        var el = $('jul-loading');
        if (el) return el;
        el = document.createElement('div');
        el.id = 'jul-loading';
        el.innerHTML =
            '<div class="jl-panel">' +
              '<div class="jl-head"><span class="jl-brand-a">JuL</span><span class="jl-brand-b">MENU</span></div>' +
              '<div class="jl-content">' +
                '<h1 class="jl-welcome">Welcome!</h1>' +
                '<div class="jl-status-row"><span class="jl-status"></span><span class="jl-percent">0%</span></div>' +
                '<div class="jl-bar"><div class="jl-track"><div class="jl-fill"></div></div><span class="jl-marker"></span></div>' +
              '</div>' +
            '</div>';
        el.querySelector('.jl-panel').style.zoom = String(S.scale);
        document.body.appendChild(el);
        return el;
    }

    function showLoading(d) {
        var el = ensureLoading();
        var welcome = (typeof d.welcome === 'string' && d.welcome !== '') ? d.welcome : null;
        el.querySelector('.jl-welcome').textContent = welcome ? ('Welcome, ' + welcome + '!') : 'Welcome!';
        el.querySelector('.jl-status').textContent = '';
        el.querySelector('.jl-percent').textContent = '0%';
        el.querySelector('.jl-bar').style.setProperty('--p', '0');
        if (typeof d.banner === 'string' && d.banner !== '') {
            try { var im = new Image(); im.src = d.banner; } catch (e) {}
        }
        el.classList.add('on');
    }

    function loadingProgress(d) {
        var el = $('jul-loading');
        if (!el) return;
        var p = Number(d.percent);
        if (isFinite(p)) p = clamp(p, 0, 100); else p = 0;
        if (typeof d.status === 'string') el.querySelector('.jl-status').textContent = d.status;
        el.querySelector('.jl-percent').textContent = Math.round(p) + '%';
        el.querySelector('.jl-bar').style.setProperty('--p', String(p / 100));
    }

    function hideLoading() {
        var el = $('jul-loading');
        if (el) el.classList.remove('on');
    }

    /* ---------------- saisie ---------------- */
    function inputHeader(title) {
        var h = document.querySelector('.input-box .input-header-text');
        if (h) h.textContent = title || 'Enter Value';
    }

    function showInputPrompt(d) {
        var isKey = (d.mode === 'keybind' || d.mode === 'itemkeybind');
        var value = (d.showInput === false) ? '' : (d.value == null ? '' : String(d.value));
        var cur = (d.cursor == null) ? value.length : clamp(int(d.cursor, 0), 0, value.length);
        S.inputValue = value;
        if (window.showInput) {
            window.showInput({
                header: d.title || 'Enter Value',
                value: value,
                placeholder: (isKey && value === '') ? 'Appuie sur une touche' : '',
                selectionStart: cur,
                selectionEnd: cur
            });
        }
    }

    function updateInputPrompt(d) {
        var value = (d.value == null) ? '' : String(d.value);
        var cur = (d.cursor == null) ? value.length : clamp(int(d.cursor, 0), 0, value.length);
        S.inputValue = value;
        if (window.updateInput) window.updateInput({ value: value, selectionStart: cur, selectionEnd: cur });
        if (d.title != null) inputHeader(String(d.title));
    }

    function hideInputPrompt() {
        if (window.hideInput) window.hideInput();
    }

    /* ---------------- banniere / couleur ---------------- */
    /* Palette de la banniere JUL_Menu_simpson : bleu ciel + jaune.
       La couleur envoyee par le Lua est remplacee pour que l'interface
       reprenne toujours les couleurs de la banniere. */
    /* #51bdf5 : percentile 75 des bleus satures de JUL_Menu_simpson.jpg —
       plus clair que le precedent #48a8f0 et reellement la couleur du ciel
       de la banniere. --ui-back repasse en gris neutre (#333333) : le menu
       ne doit plus etre teinte en bleu, seul l'accent porte le bleu. */
    var JUL_SKY = { r: 81, g: 189, b: 245 };   /* #51bdf5 - ciel clair */
    var JUL_SKY_DK = { r: 50, g: 153, b: 232 }; /* #3299e8 - ciel ombre (p25) */

    function setBanner(d) {
        if (d.url && window.updateMenuBanner) window.updateMenuBanner({ banner: String(d.url) });
    }

    /* Reglage "Banner Offset" (Settings > Misc) : monte ou descend la
       banniere seule. Le deplacement est pur -- padding haut et bas de
       #menu-banner sont compenses -- donc la hauteur du wrapper ne bouge
       pas et rien d'autre ne bouge. Le Lua envoie des dixiemes de vh
       (0 = position par defaut). Bornes imposees ici : le padding haut ne
       peut pas passer sous 0 (0.55vh de base) ni le bas sous 0 (2vh). */
    function setBannerOffset(d) {
        d = d || {};
        var v = parseFloat(d.v);
        if (isNaN(v)) return;
        v = Math.max(-0.55, Math.min(2, v));
        document.documentElement.style.setProperty('--banner-off', v + 'vh');
    }

    function setMenuColor(d) {
        d = d || {};
        /* gris 160 = valeur par defaut du Lua, si un canal manque */
        var r = (d.r === undefined) ? 160 : ch(d.r);
        var g = (d.g === undefined) ? 160 : ch(d.g);
        var b = (d.b === undefined) ? 160 : ch(d.b);
        /* Le Lua choisit la teinte selon la banniere active : 160,160,160
           (gris) pour Dragon Ball Z et au demarrage, 45,175,235 pour les
           Simpsons. Ce dernier est remappe sur JUL_SKY (#51bdf5) : c'est
           le bleu retenu sur la banniere, celui demande a l'ecran. */
        if (r === 45 && g === 175 && b === 235) {
            r = JUL_SKY.r; g = JUL_SKY.g; b = JUL_SKY.b;
        }
        document.documentElement.style.setProperty('--jul-acc', 'rgb(' + r + ',' + g + ',' + b + ')');
        /* meme couleur sous forme de triplet brut : necessaire pour les
           rgba(var(--jul-acc-rgb), a) des notifications */
        document.documentElement.style.setProperty('--jul-acc-rgb', r + ',' + g + ',' + b);
        /* hex et non rgb() : le parseur Nexus ne lit que du #rrggbb */
        if (window.updateMenuColors) window.updateMenuColors({ mainColor: hexOf(r, g, b) });
    }

    /* ---------------- notifications (nouveau design) ----------------------
       Le bundle construit des .notification en DOM. On intercepte "notify"
       (Lua : { action="notify", header, message, duration, type }) pour
       emettre le nouveau gabarit .toast a la place : colonne d'icone sombre,
       filet lumineux, touche en relief et barre de duree. Comme l'action est
       dans ACTIONS, elle n'est JAMAIS forward:ee au bundle, donc l'ancien
       style ne peut plus s'afficher en jeu. */
    var JUL_TOAST_MAX = 5;   /* au-delà, la plus ancienne disparaît */
    var JUL_TOAST_GAP = 1.1; /* vh -- doit rester egal au gap du conteneur */

    var JUL_TOAST_TYPE = {
        success: 'success', error: 'error',
        warn: 'warning', warning: 'warning',
        info: 'info'
    };
    var JUL_TOAST_ICONS = {
        success: '<svg width="2.05vh" height="2.05vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
        info:    '<svg width="2.05vh" height="2.05vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
        warning: '<svg width="2.05vh" height="2.05vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5l9 15.5H3L12 4.5Z"/><path d="M12 10v4M12 17h.01"/></svg>',
        error:   '<svg width="2.05vh" height="2.05vh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'
    };

    function julToastDismiss(el) {
        if (!el || el._gone) return;
        el._gone = true;
        if (el._stop) el._stop();
        /* hauteur figee avant l'animation : sinon le collapse est instantane */
        el.style.height = el.offsetHeight + 'px';
        el.getBoundingClientRect();
        el.classList.add('leaving');
        el.style.height = '0px';
        el.style.marginBottom = (-JUL_TOAST_GAP) + 'vh';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 420);
    }

    function julNotify(d) {
        var box = $('notification-container');
        if (!box) {
            /* le bundle n'a pas encore tourne : on fabrique le conteneur */
            box = document.createElement('div');
            box.id = 'notification-container';
            document.body.appendChild(box);
        }
        var type = JUL_TOAST_TYPE[String(d.type == null ? 'info' : d.type).toLowerCase()] || 'info';
        var duration = int(d.duration, 4500);
        if (duration < 0) duration = 0;

        var el = document.createElement('div');
        el.className = 'toast ' + type;
        el.setAttribute('role', 'status');
        el.innerHTML =
            '<div class="t-side"><div class="t-icon">' + (JUL_TOAST_ICONS[type] || JUL_TOAST_ICONS.info) + '</div></div>' +
            '<div class="t-main"><div class="t-text"><div class="t-title"></div><div class="t-msg"></div></div></div>';

        var title = el.querySelector('.t-title');
        if (title) title.textContent = d.header == null ? '' : String(d.header);
        var msg = el.querySelector('.t-msg');
        if (msg) {
            if (d.message) msg.textContent = String(d.message);
            else msg.remove();
        }
        /* touche en relief : reserve pour un futur envoi de touche par le Lua */
        if (d.key) {
            var cap = document.createElement('span');
            cap.className = 'key';
            cap.textContent = String(d.key);
            el.querySelector('.t-main').appendChild(cap);
        }

        el.addEventListener('click', function () { julToastDismiss(el); });

        if (duration > 0) {
            el.style.setProperty('--dur', duration + 'ms');
            var bar = document.createElement('div');
            bar.className = 't-bar';
            el.appendChild(bar);

            /* le survol met la notification (et la barre) en pause */
            var remaining = duration, started = 0, timer = null;
            var start = function () {
                started = Date.now();
                timer = setTimeout(function () { julToastDismiss(el); }, remaining);
                el.classList.remove('paused');
            };
            var pause = function () {
                clearTimeout(timer);
                remaining -= Date.now() - started;
                el.classList.add('paused');
            };
            el.addEventListener('mouseenter', pause);
            el.addEventListener('mouseleave', start);
            el._stop = function () { clearTimeout(timer); };
            start();
        }

        box.appendChild(el);

        var alive = [], i;
        for (i = 0; i < box.children.length; i++) if (!box.children[i]._gone) alive.push(box.children[i]);
        if (alive.length > JUL_TOAST_MAX) julToastDismiss(alive[0]);
    }

    /* ---------------- visibilite ---------------- */
    function showMenu(d) {
        /* setVisible pilote un etat interne du bundle : la fiche joueur ne
           s'affiche que si ce drapeau est a true, et le Lua ne connait pas
           cette action. On la synthetise donc a chaque showMenu. */
        var v = d.visible !== false;
        forward({ action: 'setVisible', visible: v });
        if (v) { if (window.showMenu) window.showMenu(); }
        else { if (window.hideMenu) window.hideMenu(); }
        /* la liste vient d'etre reconstruite : on recale la barre. */
        if (v) resyncScrollbar();
    }

    /* ---------------- mode design (deplacement) ---------------- */
    function setDesignMode(d) {
        S.design = !!d.enabled;
        document.documentElement.setAttribute('data-design', S.design ? 'on' : '');
    }

    var drag = null;
    document.addEventListener('mousedown', function (e) {
        if (!S.design || e.button !== 0) return;
        var t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('#menu-banner')) {
            var root = $('menu-root');
            if (!root) return;
            var r = root.getBoundingClientRect();
            drag = { kind: 'menu', el: root, ox: r.left, oy: r.top, sx: e.clientX, sy: e.clientY };
        } else if (t.closest('.kbl-head')) {
            var kb = $('jul-keybinds');
            if (!kb) return;
            var z = S.scale > 0 ? S.scale : 1;
            var kr = kb.getBoundingClientRect();
            kb.style.right = 'auto';
            drag = { kind: 'kb', el: kb, z: z, ox: kr.left / z, oy: kr.top / z, sx: e.clientX, sy: e.clientY };
        }
        if (drag) { e.preventDefault(); }
    });
    document.addEventListener('mousemove', function (e) {
        if (!drag) return;
        if (drag.kind === 'menu') {
            drag.el.style.left = Math.round(drag.ox + (e.clientX - drag.sx)) + 'px';
            drag.el.style.top = Math.round(drag.oy + (e.clientY - drag.sy)) + 'px';
        } else {
            drag.el.style.left = Math.round(drag.ox + (e.clientX - drag.sx) / drag.z) + 'px';
            drag.el.style.top = Math.round(drag.oy + (e.clientY - drag.sy) / drag.z) + 'px';
        }
        positionCard();
    });
    document.addEventListener('mouseup', function () {
        if (!drag) return;
        if (drag.kind === 'menu') {
            var r = drag.el.getBoundingClientRect();
            S.userX = (r.left * 100 / window.innerWidth) + 'vw';
            S.userY = (r.top * 100 / window.innerHeight) + 'vh';
            S.x = S.userX; S.y = S.userY;
        }
        drag = null;
        positionCard();
    });

    /* =================================================================
       TABLE DES ACTIONS JUiL
       ================================================================= */
    var LUA_ONLY = {
        setMenuPos: 1, setUiScale: 1, setMenuColor: 1, setBanner: 1,
        setBannerOffset: 1,
        setFooterLogo: 1, setFooterUser: 1, setKeybinds: 1,
        showInputPrompt: 1, updateInputPrompt: 1, hideInputPrompt: 1,
        showLoading: 1, loadingProgress: 1, hideLoading: 1,
        resetTabs: 1, designMode: 1, displayCrosshair: 1,
        notify: 1
    };

    var ACTIONS = {
        showMenu: showMenu,
        setMenuPos: setMenuPos,
        setUiScale: function (d) { setScale(d.scale); },
        setMenuColor: setMenuColor,
        setBanner: setBanner,
        setBannerOffset: setBannerOffset,
        setFooterLogo: setFooterLogo,
        setFooterUser: setFooterUser,
        setKeybinds: setKeybinds,
        showLoading: showLoading,
        loadingProgress: loadingProgress,
        hideLoading: hideLoading,
        showInputPrompt: showInputPrompt,
        updateInputPrompt: updateInputPrompt,
        hideInputPrompt: hideInputPrompt,
        displayPlayerCard: displayPlayerCard,
        designMode: setDesignMode,
        displayCrosshair: function (d) {
            if (window.crosshair) { if (d.visible) window.crosshair.show(); else window.crosshair.hide(); }
        },
        /* notifications : gerees ICI, jamais forward:ee -> l'ancien style
           du bundle ne peut plus s'afficher en jeu */
        notify: julNotify,
        /* --- les 3 suivants sont geres ICI et ne doivent JAMAIS partir
               vers le bundle : updateMenuData/updateTab reconstruiraient
               la liste depuis des onglets vides et effaceraient les
               options rendues par setCurrent --- */
        setTabs: function (d) {
            S.tabs = arr(d.tabs).map(function (t) {
                return String(t == null ? '' : (typeof t === 'string' ? t : (t.label || t.name || '')));
            });
            S.tab = int(d.index, 0);
            S.showSingle = false;
            renderTabs();
            resyncScrollbar();
        },
        setTabIndex: function (d) { S.tab = int(d.index, 0); renderTabs(); resyncScrollbar(); },
        resetTabs: function () { S.tabs = ['Main']; S.tab = 0; S.showSingle = true; renderTabs(); resyncScrollbar(); },
        setCurrent: setCurrent
    };

    function dispatcher(e) {
        var d = e && e.data;
        if (!d || typeof d !== 'object') return;
        var a = d.action;
        if (typeof a === 'string' && LUA_ONLY[a]) stopDemo();
        if (typeof a !== 'string' || !Object.prototype.hasOwnProperty.call(ACTIONS, a)) {
            /* action inconnue de la couche JuL : c'est une action Nexus
               (notify, scroll, displayFreecam, demoMode, ...) */
            forward(d);
            return;
        }
        try { ACTIONS[a](d); }
        catch (err) { console.error('[jul-bridge] ' + a, err); }
    }

    /* =================================================================
       INITIALISATION
       ================================================================= */
    function init() {
        /* bas-gauche : texte fixe "JuL MENU" (setFooterUser l'ecrit). */
        setFooterUser();
        S.x = '20.25vh'; S.y = '19.5vh';
        applyPos();
        setBanner({ url: DEFAULT_BANNER });
        setMenuColor({ r: 160, g: 160, b: 160 });
        setScale(0.8);
        renderTabs();

        /* le Lua pilote le buffer : la saisie ne doit pas pouvoir etre
           modifiee cote navigateur (regex / curseur geres en Lua) */
        var inp = document.querySelector('.input-box input');
        if (inp) {
            inp.readOnly = true;
            inp.addEventListener('beforeinput', function (ev) {
                if (ev.cancelable) ev.preventDefault();
            });
            inp.addEventListener('input', function () { inp.value = S.inputValue; });
        }

        if (window.invokeNative || window.GetParentResourceName) {
            stopDemo();                       /* en jeu : aucune demo */
        } else if (/[?&]nexus\b/.test(location.search)) {
            S.demoStopped = true;             /* ?nexus : garder la demo d'origine */
        } else {
            stopDemo();
            setTimeout(julPreview, 350);
        }

        bridge.orig('message', dispatcher);
    }

    /* =================================================================
       APERCU HORS JEU : meme sequence que le Lua (chargement -> menu)
       ================================================================= */
    function julPreview() {
        var send = function (o) { dispatcher({ data: o }); };
        var steps = [
            [10,  'Connexion a l\'interface...', 400],
            [35,  'Chargement de la banniere...', 700],
            [60,  'Application du theme...', 600],
            [85,  'Verification de la touche...', 500],
            [100, 'Pret !', 500]
        ];
        send({ action: 'showLoading', welcome: 'joueur', banner: DEFAULT_BANNER });
        var i = 0;
        (function next() {
            if (i >= steps.length) { finish(); return; }
            var s = steps[i++];
            send({ action: 'loadingProgress', percent: s[0], status: s[1] });
            setTimeout(next, s[2]);
        })();

        function finish() {
            send({ action: 'hideLoading' });
            send({ action: 'showInputPrompt', showInput: true, title: 'Choose Menu Key', value: 'F6', mode: 'keybind', cursor: 2 });
            setTimeout(function () {
                send({ action: 'hideInputPrompt' });
                send({ action: 'setBanner', url: DEFAULT_BANNER });
                send({ action: 'setMenuColor', r: 160, g: 160, b: 160 });
                send({ action: 'setUiScale', scale: 0.8 });
                send({ action: 'setMenuPos', x: 20.25, y: 19.5, force: true });
                send({ action: 'setFooterUser', name: '' });
                send({ action: 'showMenu', visible: true });
                send({ action: 'setTabs', tabs: ['Status', 'Misc', 'Appearance'], index: 0 });
                send({
                    action: 'setCurrent',
                    current: 2,
                    menu: [
                        { type: 'submenu',  label: 'Self Options',   desc: 'Options du ped' },
                        { type: 'submenu',  label: 'Visual Options', desc: 'Effets visuels' },
                        { type: 'checkbox', label: 'Godmode',        desc: 'Regen vie/armure en continu', checked: false },
                        { type: 'checkbox', label: 'Invisibility',   desc: 'Invisible pour les autres', checked: true },
                        { type: 'divider',  label: 'Move' },
                        { type: 'slider',   label: 'Noclip Speed',   desc: 'Adjust noclip flight speed', value: 7, min: 1, max: 100, step: 1 },
                        { type: 'scroll',   label: 'Noclip Type',    options: [{ label: 'Normal' }, { label: 'Invisible' }, { label: 'Solo' }], selected: 1 },
                        { type: 'button',   label: 'Teleport to Waypoint' },
                        { type: 'button',   label: 'Super Punch' }
                    ]
                });
                send({
                    action: 'setKeybinds',
                    rows: [
                        { label: 'Menu',           key: 'F6',   state: 'none' },
                        { label: 'Godmode',        key: 'G',    state: 'off'  },
                        { label: 'Invisibility',   key: 'V',    state: 'on'   },
                        { label: 'Noclip',         key: 'N',    state: 'off'  },
                        { label: 'Teleport',       key: 'B',    state: 'none' }
                    ]
                });
                send({
                    action: 'displayPlayerCard',
                    visible: true,
                    data: {
                        name: 'Night-Raven', sid: 204, dist: '32.4 m', hdg: 128, dir: 'SE',
                        pos: '-1204.1, 86.0, 31.2', num: '5561234870', veh: 'on foot',
                        wep: '0x2752E364', spd: '4.2 km/h', hpN: 162, hpMax: 200, apN: 40
                    }
                });
                send({ action: 'notify', type: 'info', header: 'JuL Menu', message: 'Interface prete.', duration: 4000 });
            }, 900);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
