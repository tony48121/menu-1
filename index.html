<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réglage de la touche du menu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #05060a;
    --panel: #0d0e17;
    --border: rgba(255, 255, 255, 0.08);
    --text: #f2f2f7;
    --text-dim: #8a8ca3;
    --accent: #58c4ff;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel {
    width: 460px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  }

  .row-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 2px solid var(--accent);
  }

  .row-header .icon {
    font-size: 15px;
    color: var(--text-dim);
    opacity: 0.8;
  }

  .row-header .sep {
    width: 1px;
    height: 16px;
    background: var(--border);
  }

  .row-header .label {
    font-size: 14px;
    font-weight: 600;
  }

  .key-row {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  .key-row.listening {
    color: var(--text);
    background: rgba(88, 196, 255, 0.06);
  }

  .key-row .cursor {
    display: inline-block;
    width: 1px;
    margin-left: 3px;
    color: var(--accent);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .hint {
    padding: 0 18px 14px;
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="row-header">
      <span class="icon">⌨</span>
      <span class="sep"></span>
      <span class="label">Choisir la touche du menu</span>
    </div>
    <div class="key-row" id="keyRow" tabindex="0">
      <span id="keyValue">F6</span><span class="cursor">|</span>
    </div>
    <div class="hint">Clique puis appuie sur une touche · Suppr pour effacer · Échap pour annuler</div>
  </div>

<script>
  const keyRow = document.getElementById('keyRow');
  const keyValue = document.getElementById('keyValue');
  let listening = false;
  let currentKey = 'F6';

  // Ce qu'on affiche ici est purement visuel. Quand tu branches ça sur
  // ton menu FiveM, sauvegarde `currentKey` (ex: dans le storage NUI ou
  // renvoyé au client Lua) et utilise-le pour un RegisterKeyMapping
  // dynamique côté client.
  const KEY_LABELS = {
    ' ': 'Espace', 'Escape': 'Échap', 'Delete': 'Suppr', 'Backspace': 'Retour',
    'ArrowUp': '↑', 'ArrowDown': '↓', 'ArrowLeft': '←', 'ArrowRight': '→',
  };

  function labelFor(key) {
    return KEY_LABELS[key] || (key.length === 1 ? key.toUpperCase() : key);
  }

  function startListening() {
    listening = true;
    keyRow.classList.add('listening');
    keyValue.textContent = '...';
  }

  function stopListening(newKey) {
    listening = false;
    keyRow.classList.remove('listening');
    if (newKey) currentKey = newKey;
    keyValue.textContent = labelFor(currentKey);
  }

  keyRow.addEventListener('click', () => {
    if (!listening) startListening();
  });

  keyRow.addEventListener('keydown', (e) => {
    if (!listening) return;
    e.preventDefault();

    if (e.key === 'Escape') {
      stopListening(); // annule, garde l'ancienne touche
      return;
    }
    stopListening(e.key); // Suppr/Backspace sont aussi acceptés comme touche de menu
  });

  stopListening();
</script>
</body>
</html>
