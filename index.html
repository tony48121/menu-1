<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script async src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
*{background:transparent}
::-webkit-scrollbar{display:none;width:0;height:0}

:root{
  --accent-rgb:47,155,240;
  --accent-light:161,210,248;
  --line-rgb:90,175,245;
  --color-main:rgba(var(--accent-rgb),0.35);
  --color-border:rgba(var(--accent-rgb),0.35);
  --color-shadow:rgba(var(--accent-rgb),0.35);
  --color-notify-main:rgb(var(--accent-rgb));
  --color-notify-shadow:rgba(var(--accent-rgb),0.35);
  --color-mainSolid:rgb(var(--accent-rgb));
  --color-tab:rgba(var(--accent-rgb),0.35);
  /* Fond quasi nul : le jeu se voit a travers. Il ne reste qu'un voile gris
     tres leger, juste assez pour que le panneau existe sans etre opaque.
     --bg-deep  = chrome (racine, onglets, fil d'Ariane, pied)
     --bg-panel = zone de liste des items                                          */
  /* SEUL LE FOND (la zone derriere la liste d'options) est translucide.
     La barre d'onglets, le fil d'Ariane et le pied restent en noir plein :
     ce sont des surfaces de navigation, pas du contenu a voir au travers.
     La base (7,7,7) est quasi noire pour que ce fond reste sombre meme a
     faible opacite — avec (38,38,38), un gris a 15 %, ca virait au lavis
     clair et le texte devenait illisible sur une scene claire. */
  --bg-deep:rgba(7,7,7,0.38);
  --bg-panel:rgba(7,7,7,0.38);
  --bg-chrome:#070707;
  --text-primary:#fff;
  --text-secondary:rgba(255,255,255,0.85);
  --item-height:3.2vh;
  --tabs-height:3.6vh;
  --banner-height:10vh;
  --crumb-h:0vh;
  --font:'Space Grotesk','Rubik','Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

/* ---------- conteneur ---------- */
/* text-shadow herite a tous les descendants : indispensable une fois le fond
   quasi transparent, sinon le texte blanc devient illisible sur une scene claire. */
.menu-root{font-family:var(--font);color:var(--text-primary);position:fixed;width:34vh;z-index:1000;border-radius:0.8vh;background:var(--bg-deep);border:0.1vh solid rgba(255,255,255,0.16);box-shadow:0 1vh 3vh rgba(0,0,0,0.6);text-shadow:0 0.1vh 0.25vh rgba(0,0,0,0.92),0 0 0.45vh rgba(0,0,0,0.55)}
.menu-banner{position:relative;border-radius:0.7vh 0.7vh 0 0;overflow:hidden;padding:0}
.menu-banner img{width:100%;height:var(--banner-height);object-fit:cover;display:block}
.menu-body{background:var(--bg-panel);overflow:hidden}

/* ---------- titre de page / fil d'Ariane (optionnel) ---------- */
.menu-crumb{display:none;position:relative;align-items:center;justify-content:center;height:3.2vh;box-sizing:border-box;background:var(--bg-chrome);border-bottom:0.07vh solid rgba(var(--accent-rgb),0.5);z-index:2}
.menu-crumb.on{display:flex}
.crumb-title{font-size:1.35vh;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#fff}
.crumb-parent{position:absolute;left:1.5vh;font-size:0.95vh;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.75)}

/* ---------- onglets : texte centré, soulignement d'accent sous l'onglet actif ---------- */
.menu-tabs{display:flex;height:var(--tabs-height);box-sizing:border-box;background:var(--bg-chrome);overflow:hidden}
.tab-item{flex:1;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.2vh;font-weight:600;white-space:nowrap;color:rgba(255,255,255,0.85);user-select:none;border-bottom:0.3vh solid transparent;transition:color 0.2s ease,border-color 0.2s ease,box-shadow 0.2s ease}
.tab-item.active{color:#fff;border-bottom-color:rgb(var(--accent-rgb));box-shadow:0 0.3vh 0.9vh -0.3vh rgba(var(--accent-rgb),0.7)}
/* variante pilule (setTabStyle {style:'pill'}) */
[data-tabs="pill"] .menu-tabs{padding:0.5vh 1vh}
[data-tabs="pill"] .tab-item{text-transform:uppercase;letter-spacing:0.08em;font-size:1.05vh;border:0.1vh solid transparent;border-radius:2vh}
[data-tabs="pill"] .tab-item.active{border-color:rgb(var(--accent-rgb));background:rgba(var(--accent-rgb),0.18);box-shadow:0 0 0.9vh rgba(var(--accent-rgb),0.45)}

/* ---------- barre de défilement ---------- */
.menu-scrollbar{position:absolute;left:-1.2vh;top:calc(var(--banner-height) + var(--crumb-h) + var(--tabs-height) + 0.4vh);width:0.6vh;height:39vh;transition:opacity 0.3s cubic-bezier(0.4,0,0.2,1)}
.scrollbar-track{width:100%;height:100%;background-color:rgba(0,0,0,0.8);border-radius:0.4vh;position:relative;transition:0.5s}
.scrollbar-thumb{position:absolute;top:0;left:0;width:100%;background-color:var(--color-mainSolid);border-radius:0.2vh;transition:top 0.25s ease-out,height 0.25s ease-out;min-height:2vh}

/* ---------- liste ---------- */
.menu-items{position:relative;max-height:calc(var(--item-height) * 12);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0.6vh 0}
.menu-items::-webkit-scrollbar{display:none}
/* sélection : fond marine à contour lumineux (défaut) ou dégradé plein (setSelectStyle {style:'gradient'}) */
.selection-highlight{position:absolute;left:0.6vh;right:0.6vh;height:var(--item-height);box-sizing:border-box;border-radius:0.5vh;
  background:rgba(var(--accent-rgb),0.16);border:0.1vh solid rgba(var(--accent-rgb),0.9);box-shadow:0 0 1vh rgba(var(--accent-rgb),0.5);
  z-index:0;pointer-events:none;will-change:top;transform:translateZ(0)}
[data-select="gradient"] .selection-highlight{left:0;right:0;border:none;border-radius:0;background:linear-gradient(90deg,rgba(var(--accent-rgb),0.95),rgba(var(--accent-rgb),0.5));box-shadow:inset 0.3vh 0 0 rgb(var(--accent-light))}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:0 1.7vh;height:var(--item-height);box-sizing:border-box;position:relative;z-index:1}
.item-label{display:flex;align-items:center;gap:1vh;min-width:0;flex:1}
.row-icon{font-size:1.6vh;width:1.8vh;color:rgb(var(--accent-light));flex-shrink:0;text-align:center}
.menu-item .name{font-size:1.25vh;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider-val{color:rgba(255,255,255,0.95);font-size:1.1vh;font-weight:500}
.components-container{display:flex;align-items:center;gap:0.8vh;flex-shrink:0}
.component{display:flex;align-items:center}
.caret-icon{font-size:1.3vh;color:rgb(var(--accent-rgb))}
.swatch{display:block;width:1.7vh;height:1.7vh;border-radius:0.45vh;box-shadow:inset 0 0 0 0.1vh rgba(255,255,255,0.18)}

/* ---------- interrupteur ---------- */
.toggle-switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.toggle-switch input{position:absolute;opacity:0;width:0;height:0}
.toggle-track{display:block;width:3.4vh;height:1.7vh;background:#2a2b31;border-radius:1vh;position:relative;transition:background 0.22s ease,border-color 0.22s ease;border:0.1vh solid rgba(255,255,255,0.08);box-sizing:border-box}
.toggle-thumb{position:absolute;top:50%;left:0.2vh;transform:translateY(-50%);width:1.2vh;height:1.2vh;border-radius:50%;background:#e6e7ea;transition:left 0.22s ease,background 0.22s ease}
.toggle-switch input:checked ~ .toggle-track{background:rgb(var(--accent-rgb));border-color:transparent}
.toggle-switch input:checked ~ .toggle-track .toggle-thumb{left:calc(100% - 1.2vh - 0.2vh);background:#fff}
.menu-item.is-selected .toggle-switch input:checked ~ .toggle-track{background:rgba(255,255,255,0.6)}

/* ---------- slider ---------- */
.range-component{position:relative;width:9vh;height:1.6vh;display:flex;align-items:center}
.range-track{position:absolute;left:0;width:100%;height:0.35vh;background:rgba(255,255,255,0.28);border-radius:0.2vh;z-index:1}
.range-fill{position:absolute;left:0;height:0.35vh;background:rgb(var(--accent-light));border-radius:0.2vh;z-index:2;pointer-events:none}
.range-component input[type="range"]{-webkit-appearance:none;appearance:none;position:relative;width:100%;height:0.35vh;background:transparent;outline:none;margin:0;padding:0;cursor:pointer;z-index:3}
.range-component input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:1.25vh;height:1.25vh;border-radius:50%;background:#fff;box-shadow:0 0 0.1vh rgba(0,0,0,0.4);margin-top:-0.125vh;cursor:pointer}
.range-component input[type="range"]::-moz-range-thumb{width:1.25vh;height:1.25vh;border-radius:50%;background:#fff;border:none;cursor:pointer}

/* ---------- sélecteur - valeur - ---------- */
.scroll-value{display:flex;align-items:center;gap:0.6vh;font-size:1.1vh;font-weight:700;letter-spacing:0.03em;color:rgba(255,255,255,0.85);max-width:17vh}
.scroll-value .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll-value .arrow{opacity:0.7}
.menu-item.is-selected .scroll-value{color:#fff}

/* ---------- séparateur : titre de section à gauche, filet qui s'estompe ---------- */
.separator-container{display:flex;align-items:center;height:var(--item-height);padding:0 1.5vh;gap:1vh;box-sizing:border-box;background:rgba(var(--accent-rgb),0.14)}
.separator-bar{display:none}
.separator-bar:last-child{display:block;flex:1;height:0.07vh;background:linear-gradient(90deg,rgba(var(--accent-rgb),0.6),rgba(var(--accent-rgb),0))}
.separator-text{color:rgb(var(--accent-light));font-size:1vh;font-weight:700;white-space:nowrap;letter-spacing:0.16em;text-transform:uppercase}

/* ---------- pied : logo | texte centré | compteur ---------- */
.menu-footer{background:var(--bg-chrome);display:grid;grid-template-columns:auto 1fr auto;align-items:center;height:3.1vh;box-sizing:border-box;border-top:0.07vh solid rgba(255,255,255,0.06);border-radius:0 0 0.7vh 0.7vh;overflow:hidden}
.footer-logo{display:flex;align-items:center;height:100%;padding:0 1.1vh;color:rgb(var(--accent-rgb));border-right:0.07vh solid rgba(255,255,255,0.15)}
/* Bas a gauche : volontairement vide. L'emplacement n'accueille un logo que
   si une URL est explicitement fournie via FOOTER_LOGO_URL dans menu.lua ;
   aucun contenu par defaut (ni hexagone, ni nom, ni marque).
   :empty supprime aussi padding et filet, donc la colonne se reduit a zero et
   il ne reste rien du tout a cet emplacement. Des qu'une image y est posee,
   la regle generale ci-dessus reprend la main. */
.footer-logo:empty{padding:0;border-right:none}
/* Logo image en bas a gauche. Le visuel est blanc sur fond noir : "screen"
   rend le noir entierement transparent, donc le cadre du fichier disparait
   sur le pied et seul le lettrage subsiste. */
.footer-logo img{height:2.2vh;width:auto;display:block;mix-blend-mode:screen}
.footer-brand{text-align:center;font-size:1.05vh;font-weight:500;color:rgb(var(--accent-rgb));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 1vh}
.footer-counter{display:flex;align-items:center;height:100%;padding:0 1.2vh;font-size:1vh;font-weight:500;color:var(--text-secondary);border-left:0.07vh solid rgba(255,255,255,0.15)}

/* ---------- saisie ---------- */
.input-overlay{position:fixed;top:0;left:0;transform:none;width:100%;height:100%;background:rgb(0,0,0,0.5);z-index:999999;color:white;font-weight:500;font-family:var(--font);font-size:1.2vh}
.input-box{background-color:rgba(18,19,24,0.94);border:0.1vh solid rgba(var(--line-rgb),0.5);border-radius:0.6vh;display:flex;flex-direction:column;position:fixed;bottom:17.5vh;left:50%;transform:translateX(-50%);height:auto;width:55vh;overflow:hidden;box-shadow:0 0 1.4vh rgba(var(--accent-rgb),0.35)}
.input-box > .input-header{padding:0.8vh 1vh;border-bottom:0.1vh solid rgb(var(--line-rgb));width:100%;font-size:1.2vh;font-weight:600;background:linear-gradient(90deg,rgba(var(--accent-rgb),0.45) 0%,rgba(var(--accent-rgb),0) 100%)}
.input-header-inner{display:flex;align-items:center;gap:0.5vh}
.input-header-text{color:white}
.input-box input{padding:1.25vh 1vh;border:none;outline:none;background:transparent;color:white;font-size:1.2vh;font-family:var(--font);display:block;margin:0}
body,main{all:unset;display:block}

/* ---------- notifications ---------- */
.notify-stack{position:fixed;bottom:2vh;right:2vh;display:flex;flex-direction:column;gap:0.8vh;z-index:9999;pointer-events:none}
/* box-sizing:border-box OBLIGATOIRE : sans lui la carte fait 32vh + bordures,
   puis dismiss() la reconvertit en border-box -> saut de geometrie a la sortie.
   Pas de backdrop-filter : sur le CEF de FiveM il composite le flou contre du
   noir opaque (aucun fond derriere dans la page) d'ou la boite noire. */
.notify-card{box-sizing:border-box;background:rgba(20,21,26,0.92);border:0.1vh solid rgba(255,255,255,0.08);border-left:0.3vh solid var(--accent);border-radius:0.6vh;color:#fff;font-family:var(--font);width:32vh;max-width:85vw;overflow:hidden;box-shadow:0 0.6vh 2vh rgba(0,0,0,0.5)}
.notify-body{display:flex;flex-direction:row;align-items:center;padding:1vh 1.2vh 0.9vh;gap:1vh}
.notify-icon-wrap{width:2.2vh;height:2.2vh;min-width:2.2vh;border-radius:0.5vh;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notify-icon{font-size:1.1vh;color:#fff;line-height:1;display:block;text-align:center;width:1.1vh;height:1.1vh}
.notify-text{display:flex;flex-direction:column;gap:0.2vh;min-width:0}
.notify-header{font-size:1.35vh;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.02em}
.notify-message{font-size:1.05vh;font-weight:400;color:rgba(200,200,200,0.85);line-height:1.4}
.notify-bar{height:0.25vh;width:100%;background:rgba(255,255,255,0.06)}
.notify-bar-fill{height:100%;background:var(--accent);transition:width 0.1s linear;will-change:width}

/* ---------- cible (reticule overlay) ---------- */
/* Dessinee par le NUI, pas par un composant HUD : ainsi elle coexiste avec
   Remove UI, qui masque les composants 1 a 22 chaque frame.
   Disque blanc plein + croix sombre qui depasse du disque.
   La croix est APRES le disque dans le DOM : elle doit le recouvrir. */
.jul-crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:4.6vh;height:4.6vh;pointer-events:none;z-index:9998}
.jul-cross-ring{position:absolute;top:50%;left:50%;width:2.3vh;height:2.3vh;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0.55vh rgba(0,0,0,0.5)}
.jul-cross-h{position:absolute;top:50%;left:0;width:100%;height:0.28vh;background-color:#0b0b0b;transform:translateY(-50%);box-shadow:0 0 0 0.08vh rgba(255,255,255,0.5)}
.jul-cross-v{position:absolute;left:50%;top:0;width:0.28vh;height:100%;background-color:#0b0b0b;transform:translateX(-50%);box-shadow:0 0 0 0.08vh rgba(255,255,255,0.5)}

/* ---------- freecam ---------- */
.hovering-text-wrap{position:fixed;bottom:7.5vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;outline:none;min-width:18.52vh;font-family:var(--font)}
.hovering-text-list{list-style:none;margin:0;padding:0;text-align:center;pointer-events:none;user-select:none;max-height:calc(9 * (1.3vh * 1.3 + 0.37vh));overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;display:flex;flex-direction:column;align-items:center;scroll-behavior:smooth}
.hovering-text-item{padding:0.185vh 0;font-size:1.3vh;line-height:1.3;transition:transform 0.22s cubic-bezier(.2,.9,.2,1),color 0.22s cubic-bezier(.2,.9,.2,1),letter-spacing 0.22s;transform-origin:center;white-space:nowrap;min-width:27.78vh;font-weight:600;color:#fff}
.hovering-text-inactive{color:#fff;transform:scale(0.98);letter-spacing:0}
.hovering-text-selected{transform:scale(1.03);font-weight:600;letter-spacing:0.015vh;color:var(--color-mainSolid)}
li{display:list-item;text-align:-webkit-match-parent}
ul{list-style-type:disc}

/* ---------- fiche joueur ----------
   Carte d'infos qui apparait quand la selection du menu se pose sur un
   joueur de la liste. Tout le contenu vient de Lua : ce bloc ne fait que
   le poser a l'ecran. pointer-events:none, elle ne doit jamais capter un
   clic ni bloquer le menu. */
.jul-pcard{position:fixed;right:1.6vh;top:50%;transform:translateY(-50%);width:25vh;box-sizing:border-box;padding:0.9vh;display:flex;flex-direction:column;gap:0.6vh;font-family:var(--font);pointer-events:none;z-index:9997;border-radius:0.9vh;background:rgba(11,13,18,0.95);border:0.1vh solid rgba(255,255,255,0.13);box-shadow:0 1vh 3vh rgba(0,0,0,0.7)}
.jul-pc-head{display:flex;align-items:center;gap:0.7vh;padding:0.15vh 0.15vh 0.6vh;border-bottom:0.14vh solid rgb(var(--accent-rgb))}
.jul-pc-av{width:2.9vh;height:2.9vh;border-radius:0.5vh;background:rgb(var(--accent-rgb));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6vh;flex-shrink:0}
.jul-pc-title{flex:1;font-size:1.18vh;font-weight:800;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jul-pc-title .w{color:#fff}
.jul-pc-title .a{color:rgb(var(--accent-rgb))}
.jul-pc-dots{color:rgba(255,255,255,0.55);font-size:1.5vh;line-height:1;flex-shrink:0}
.jul-pc-sec{background:rgba(255,255,255,0.045);border:0.1vh solid rgba(255,255,255,0.07);border-radius:0.65vh;padding:0.15vh 0.75vh}
.jul-pc-row{display:flex;align-items:center;gap:0.6vh;font-size:1.02vh;line-height:2.05;border-bottom:0.07vh solid rgba(255,255,255,0.06)}
.jul-pc-sec .jul-pc-row:last-child,.jul-pc-stat .jul-pc-row:last-child{border-bottom:none}
.jul-pc-row i{color:rgb(var(--accent-light));font-size:1.25vh;width:1.35vh;text-align:center;flex-shrink:0}
.jul-pc-row .k{flex:1;color:rgba(255,255,255,0.94)}
.jul-pc-row .v{color:#fff;font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:13vh}
.v-accent{color:rgb(var(--accent-rgb))!important}
.v-hp{color:#3ddc68!important}
.v-ap{color:rgb(var(--accent-rgb))!important}
.jul-pc-stat{background:rgba(255,255,255,0.045);border:0.1vh solid rgba(255,255,255,0.07);border-radius:0.65vh;padding:0.15vh 0.75vh;display:flex;flex-direction:column}
.jul-pc-stat .jul-pc-row .k{flex:0 0 auto;margin-right:0.5vh}
.jul-pc-row .vnum{font-weight:700;flex-shrink:0;margin-right:0.6vh}
.jul-pc-track{flex:1;min-width:2.5vh;height:0.5vh;border-radius:0.35vh;background:rgba(255,255,255,0.16);overflow:hidden}
.jul-pc-fill{display:block;height:100%;border-radius:0.3vh;width:0%;transition:width .25s linear}
.jul-pc-hp{background:linear-gradient(90deg,#2ecc5e,#7ef0a2)}
.jul-pc-ap{background:linear-gradient(90deg,rgb(var(--accent-rgb)),rgb(var(--accent-light)))}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
console.log('[JuL menu] version v12 (style wave : icones, double chevron, onglets soulignes)');
const app=document.getElementById('app');
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const E_OUT='cubic-bezier(.33,1,.68,1)',E_IN='cubic-bezier(.32,0,.67,0)';

/* ---------- transitions (équivalent de svelte/transition) ---------- */
function tr(el,{kind,dur,start=.94,x=0,y=0,base=''},out){
  const hid={opacity:0},shown={opacity:1};
  if(kind==='scale'){hid.transform=`${base} scale(${start})`;shown.transform=`${base} scale(1)`}
  if(kind==='fly'){hid.transform=`${base} translate(${x}px,${y}px)`;shown.transform=`${base} translate(0px,0px)`}
  return el.animate(out?[shown,hid]:[hid,shown],{duration:dur,easing:kind==='fade'?'linear':out?E_IN:E_OUT,fill:out?'forwards':'none'});
}
function present(s,show,build,plan){
  if(show){
    if(s.els){if(s.out){(s.anims||[]).forEach(a=>a&&a.reverse());s.out=false;s.g++}return}
    s.els=(typeof build==='function')?build():s.els;
    s.out=false;s.anims=(typeof plan==='function')?plan(s.els,false):[];
  }else if(s.els&&!s.out){
    const els=s.els,g=++s.g;s.out=true;
    /* plan peut manquer (appel a 2 arguments) : on ne doit JAMAIS lever,
       sinon s.out reste bloque true et le panneau n'est jamais retire. */
    s.anims=(typeof plan==='function')?plan(els,true):[];
    const done=()=>{if(s.g===g){els.forEach(e=>e.remove());s.els=null;s.out=false}};
    /* .then(done,done) : nettoyage aussi si une animation est annulee
       (avant : .catch(()=>{}) laissait l'etat bloque "out" a jamais). */
    Promise.all(s.anims.map(a=>a&&a.finished)).then(done,done);
  }
}

/* Aucun contenu par defaut en bas a gauche. Un logo n'apparait que si une URL

function buildMenu(){

const planMenu=(e,out)=>[];

function renderTabs(){

    const d=$('div','tab-item'+(i===B.tab?' active':''),t);

function renderCrumb(){

const comp=h=>{const d=$('div','component');d.innerHTML=h;return d};
function mkRow(o){
  if(o.type=='divider'){const d=$('div','separator-container');d.append($('div','separator-bar'),$('div','separator-text'),$('div','separator-bar'));return d}
  const r=$('div','menu-item'),lab=$('div','item-label'),cc=$('div','components-container');
  lab.append($('span','name'));if(o.icon)lab.prepend($('i','ph '+o.icon+' row-icon'));
  types(o).forEach(t=>{
    if(t==='submenu')cc.append(comp('<i class="ph ph-caret-double-right caret-icon"></i>'));
    else if(t==='action')cc.append(comp('<i class="ph ph-plus caret-icon"></i>'));
    else if(t==='color')cc.append(comp('<span class="swatch"></span>'));
    else if(t==='checkbox'){const c=comp('<label class="toggle-switch"><input type="checkbox"><span class="toggle-track"><span class="toggle-thumb"></span></span></label>');
      c.querySelector('input').onchange=e=>{r._o.checked=e.target.checked};cc.append(c)}
    else if(t==='slider'){const c=comp('<div class="range-component"><div class="range-track"></div><div class="range-fill"></div><input type="range"></div>');
      c.querySelector('input').oninput=e=>{r._o.value=+e.target.value;patchRow(r,r._o,r._i)};cc.append(c)}
    else if(t==='scroll')cc.append(comp('<div class="scroll-value"><span class="arrow">-</span><span class="val"></span><span class="arrow">-</span></div>'));
  });
  r.append(lab,cc);return r;
}
function patchRow(r,o,i){
  r._o=o;r._i=i;
  if(o.type=='divider'){r.children[1].textContent=o.label??'';return}
  r.classList.toggle('is-selected',B.cur===i);
  const nm=r.querySelector('.name');nm.textContent=o.label??'';const ic=r.querySelector('.row-icon');if(ic&&o.icon)ic.className='ph '+o.icon+' row-icon';
  if(types(o).includes('slider')&&B.cur===i)nm.append(' ',$('span','slider-val',': '+o.value));
  const cb=r.querySelector('input[type=checkbox]');if(cb)cb.checked=!!o.checked;
  const rg=r.querySelector('input[type=range]');
  if(rg){
    [['min',o.min],['max',o.max],['step',o.step]].forEach(([k,v])=>v==null?rg.removeAttribute(k):rg.setAttribute(k,v));
    rg.value=o.value??'';
    r.querySelector('.range-fill').style.width=o.max>o.min?((o.value-o.min)/(o.max-o.min))*100+'%':'0%';
  }
  const sc=r.querySelector('.scroll-value .val');
  if(sc)sc.textContent=o.options?.[o.selected-1]?.label||o.options?.[0]?.label||(!o.options||o.options.length===0?'Loading...':'None');
  const sw=r.querySelector('.swatch');if(sw)sw.style.background=o.color||'#fff';
}
function renderItems(){
  B.menu.forEach((o,i)=>{
    let row=B.rows[i];
    if(!row||row._s!==sig(o)){const n=mkRow(o);n._s=sig(o);row?row.replaceWith(n):B.list.append(n);row=B.rows[i]=n}
    patchRow(row,o,i);
  });
  while(B.rows.length>B.menu.length)B.rows.pop().remove();
}
function updCounter(){
  const s=B.menu.reduce((a,o,i)=>(o?.type!=='divider'&&a.push(i),a),[]);
  let n=0;
  if(s.length){const p=s.indexOf(B.cur);n=p!==-1?p+1:s.reduce((b,x,k)=>Math.abs(x-B.cur)<Math.abs(s[b]-B.cur)?k:b,0)+1}
  B.cnt.textContent=`${n}/${s.length}`;
}
function applyBar(){
  if(!B.thumb)return;
  B.trackEl.style.height=B.trackH+'px';B.thumb.style.top=B.thumbTop+'px';B.thumb.style.height=B.thumbH+'px';
}
function bar(){
  if(!live()||B.lock)return;
  B.lock=requestAnimationFrame(()=>{
    B.lock=null;const L=B.list;if(!live())return;
    const cH=L.clientHeight,sH=L.scrollHeight,n=B.menu.length;
    B.trackH=Math.round(cH);B.over=sH>cH+1;
    if(B.over){
      B.thumbH=Math.min(Math.max(100,Math.round(cH/sH*B.trackH)),B.trackH);
      const mx=Math.max(0,sH-cH),ra=mx?clamp(L.scrollTop/mx,0,1):0,sc=Math.max(0,B.trackH-B.thumbH);
      B.thumbTop=clamp(Math.round(sc*ra),0,sc);
    }else{
      B.thumbH=Math.min(n<=7?B.trackH:Math.max(100,Math.round(B.trackH*(7/n))),B.trackH);
      const c=Math.max(1,n),ra=c>1?clamp(B.cur,0,c-1)/(c-1):0,sc=Math.max(0,B.trackH-B.thumbH);
      B.thumbTop=clamp(Math.round(sc*ra),0,sc);
    }
    applyBar();
  });
}
function onScroll(){
  const L=B.list;if(!L||!B.over||B.lock)return;
  B.lock=requestAnimationFrame(()=>{
    B.lock=null;
    const mx=Math.max(0,L.scrollHeight-L.clientHeight),ra=mx?clamp(L.scrollTop/mx,0,1):0,sc=Math.max(0,B.trackH-B.thumbH);
    B.thumbTop=clamp(Math.round(sc*ra),0,sc);applyBar();
  });
}
/* Le cadre de selection se deplace SANS animation. L'ancienne version faisait
   un h.animate() de 220 ms avec fill:'forwards' : au rythme de reponse des
   touches (85 ms) l'animation etait interrompue avant d'aller au bout, et le
   cadre restait fige sur une ancienne position, en decalage avec la ligne
   selectionnee. Le saut instantane est le seul etat toujours juste, meme en
   maintenant la touche enfoncee. */
function moveHl(t){
  const h=B.hl;if(!h){B.hlTop=t;return}
  h.getAnimations().forEach(a=>a.cancel());
  B.hlTop=t;h.style.top=t+'px';
}
const curRow=()=>B.menu[B.cur]&&B.menu[B.cur].type!='divider'?B.rows[B.cur]:null;
/* Garantit que la ligne selectionnee est TOUTE ENTIERE dans la zone visible.
   L'ancien scrollIntoView({behavior:'smooth'}) est asynchrone : au rythme de
   reponse des touches (85 ms), chaque nouvelle demande interrompt la
   precedente et la liste ne rattrape jamais -> la selection sortait de l'ecran
   et restait a moitie coupee. Ici le calcul est synchrone et deterministe. */
function ensureVisible(el){
  const L=B.list;if(!el||!L)return;
  const cs=getComputedStyle(L);
  const padT=parseFloat(cs.paddingTop)||0,padB=parseFloat(cs.paddingBottom)||0;
  const t=el.offsetTop,b=t+el.offsetHeight,vt=L.scrollTop,vb=vt+L.clientHeight;
  /* Le rembourrage de la liste (0.6vh en haut et en bas) DOIT rester visible :
     sans lui, la barre de selection vient se coller a 0,3 px du bord et se
     confondre avec le pied de page, comme si elle sortait du panneau. */
  if(t-padT<vt)L.scrollTop=Math.max(0,t-padT);
  else if(b+padB>vb)L.scrollTop=Math.max(0,b+padB-L.clientHeight);
}
function refresh(){
  if(!live())return;
  renderItems();updCounter();
  const el=curRow();if(el){moveHl(el.offsetTop);ensureVisible(el)}
  bar();
}
const showMenu=()=>{present(B.slot,true,buildMenu,planMenu);refresh()};
/* Fermeture DETERMINISTE : le panneau est retire immediatement, sans animation
   ni etat "out" pouvant rester bloque. C'est ce qui garantit que le menu peut
   se fermer pendant qu'une notification s'affiche a cote (la fenetre NUI
   reste visible dans ce cas, donc la page doit masquer le panneau elle-meme). */
function hideMenuNow(){
  const s=B.slot;
  s.g++;                 /* invalide la suppression en attente d'un hide precedent */
  s.out=false;
  s.anims=[];
  if(s.els){s.els.forEach(e=>e.remove());s.els=null}
}

const PC={d:null,slot:{g:0}};
function buildPlayerCard(){

  c.innerHTML=`
    <div class="jul-pc-head"><div class="jul-pc-av"><i class="ph ph-user"></i></div><div class="jul-pc-title"><span class="w">PLAYER</span> <span class="a">INFORMATION</span></div><div class="jul-pc-dots"><i class="ph ph-dots-three-vertical"></i></div></div>
    <div class="jul-pc-sec">${row('ph-identification-badge','Player ID','v-accent')}${row('ph-user','Name')}${row('ph-map-pin','Distance')}${row('ph-compass','Heading')}</div>
    <div class="jul-pc-stat">${stat('hp','ph-heart','Health','jul-pc-hp')}${stat('ap','ph-shield','Armor','jul-pc-ap')}</div>
    <div class="jul-pc-sec">${row('ph-crosshair','Coordinates')}${row('ph-car','Vehicle')}${row('ph-gun','Weapon')}</div>`;
  app.append(c);return [c];
}
const planPlayerCard=(e,out)=>[tr(e[0],{kind:'fly',x:26,dur:260},out)];
function renderPlayerCard(){
  const e=PC.slot.els,d=PC.d;if(!e||!d)return;
  const q=s=>e[0].querySelector(s);
  const set=(sel,val)=>{const n=q(sel);if(n)n.textContent=(val==null||val==='')?'-':String(val)};
  set('[data-k="Player ID"]',d.sid);
  set('[data-k="Name"]',d.name);
  set('[data-k="Distance"]',d.dist);
  /* le degre est ecrit ICI, pas dans Lua : le fichier Lua reste en ASCII pur */
  set('[data-k="Heading"]',(d.dir?((typeof d.hdg==='number'?Math.round(d.hdg):'-')+'° '+d.dir):'-'));
  set('[data-k="Coordinates"]',d.pos);
  set('[data-k="Vehicle"]',d.veh);
  set('[data-k="Weapon"]',d.wep);
  /* la barre se remplit avec le POURCENTAGE, l'etiquette montre le brut :
     "62 / 100" comme dans la reference, et non un pourcentage invente */
  const hpN=(typeof d.hpN==='number')?d.hpN:null;
  const apN=(typeof d.apN==='number')?d.apN:null;
  const hpMax=(typeof d.hpMax==='number'&&d.hpMax>0)?d.hpMax:100;
  /* division simple : le brut lu et le brut max, sans base fixe supposee.
     Avec 100/100 ca donne 100%, avec 62/100 donne 62% — pas de cas particulier
     a deviner, ni de division par zero quand hpMax vaut 100. */
  const hpPct=(hpN!=null)?clamp(hpN/hpMax*100,0,100):0;
  const apPct=(apN!=null)?clamp(apN,0,100):0;
  set('[data-f="hp"]',(hpN!=null)?hpN+' / '+hpMax:'- / -');
  set('[data-f="ap"]',(apN!=null)?apN+' / 100':'- / -');

  if(h)h.style.width=hpPct+'%';if(a)a.style.width=apPct+'%';
}

/* ================= NOTIFICATIONS ================= */
const NC={info:{icon:'fa-info',color:'#3d9bff'},error:{icon:'fa-times',color:'#ff3d3d'},success:{icon:'fa-check',color:'#3ddc68'}};
const stack=$('div','notify-stack');app.append(stack);
function flip(mutate){
  const f=new Map([...stack.children].map(c=>[c,c.getBoundingClientRect()]));
  mutate();
  [...stack.children].forEach(c=>{
    const o=f.get(c);if(!o)return;
    const n=c.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;
    if(dx||dy)c.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:300,easing:E_OUT});
  });
}
function dismiss(card){
  flip(()=>{
    const {offsetWidth:w,offsetHeight:h,offsetLeft:l,offsetTop:t}=card;
    Object.assign(card.style,{position:'absolute',boxSizing:'border-box',left:l+'px',top:t+'px',width:w+'px',height:h+'px'});
  });
  tr(card,{kind:'fly',x:80,dur:250},true).finished.then(()=>card.remove()).catch(()=>{});
}
function notify(header,message,duration,type){
  const cfg=NC[type]||NC.info,card=$('div','notify-card');
  card.style.setProperty('--accent',cfg.color);
  card.innerHTML=`<div class="notify-body"><div class="notify-icon-wrap"><i class="fa ${cfg.icon} notify-icon"></i></div><div class="notify-text"><span class="notify-header"></span><span class="notify-message"></span></div></div><div class="notify-bar"><div class="notify-bar-fill" style="width:100%"></div></div>`;
  card.querySelector('.notify-header').textContent=header;
  card.querySelector('.notify-message').textContent=message??'';
  flip(()=>stack.prepend(card));
  tr(card,{kind:'fly',x:80,dur:350},false);
  const fill=card.querySelector('.notify-bar-fill'),step=100/(duration/100);let p=100;
  const iv=setInterval(()=>{
    if(p>0){p=Math.max(p-step,0);fill.style.width=p+'%'}
    else{clearInterval(iv);setTimeout(()=>dismiss(card),100)}
  },100);
}

/* ================= MESSAGES DU JEU ================= */
addEventListener('message',e=>{
  const d=e.data||{};
  switch(d.action){
    case 'setCurrent':B.cur=d.current-1;B.menu=d.menu||[];showMenu();break;
    case 'showMenu':d.visible?showMenu():hideMenuNow();break;
    case 'setTabs':B.tabs=d.tabs||[];B.tab=d.index;renderTabs();break;
    case 'setTabIndex':B.tab=d.index||0;renderTabs();break;
    case 'resetTabs':B.tabs=['Main Menu'];B.tab=0;renderTabs();break;
    case 'setMenuPos':
      if(d.x!==undefined)B.left=d.x+'vh';
      if(d.y!==undefined)B.top=d.y+'vh';
      if(live()){B.root.style.left=B.left;B.root.style.top=B.top}break;
    case 'setBanner':if(d.url){B.banner=d.url;if(live())B.img.src=d.url}break;
    case 'setMenuColor':{
      const r=d.r??47,g=d.g??155,b=d.b??240,s=document.documentElement.style;
      const lt=v=>Math.round(v+(255-v)*0.55);
      s.setProperty('--accent-rgb',`${r},${g},${b}`);
      s.setProperty('--accent-light',`${lt(r)},${lt(g)},${lt(b)}`);s.setProperty('--line-rgb',`${lt(r)},${lt(g)},${lt(b)}`);break}
    case 'setBreadcrumb':B.crumb=Array.isArray(d.parts)?d.parts:(d.path?String(d.path).split('>').map(s=>s.trim()):[]);renderCrumb();break;
    case 'setTabStyle':document.documentElement.dataset.tabs=d.style||'';break;
    case 'setSelectStyle':document.documentElement.dataset.select=d.style||'';break;
    case 'showInputPrompt':
      I.title=d.title;I.value=d.showInput?d.value:'';inputUI(!!d.showInput);
      if(d.showInput)I.blocking=true;else unblock();break;
    case 'hideInputPrompt':inputUI(false);unblock();break;
    case 'updateInputPrompt':I.title=d.title;I.value=d.value;inputUI(!!I.slot.els&&!I.slot.out);break;
    case 'displayFreecam':
      /* d.options repart de zero quand une liste fraiche arrive : le Lua
         reinitialise son index en parallele, sinon les deux se desynchronisent
         des la deuxieme ouverture. */
      F.opts=d.options||[];
      if(d.options)F.h=0;
      F.wl=d.weaponOptions||F.wl;F.vl=d.vehicleOptions||F.vl;
      if(d.weaponIndex!==undefined)F.w=d.weaponIndex-1;
      if(d.vehicleIndex!==undefined)F.v=d.vehicleIndex-1;
      present(F.slot,!!d.visible,buildFreecam,planFreecam);renderFreecam();break;
    case 'updateWeapon':F.w=d.index-1;renderFreecam();break;
    case 'updateVehicle':F.v=d.index-1;renderFreecam();break;
    case 'scroll':
      if(F.opts.length){F.h=(F.h+(d.direction==='up'?-1:1)+F.opts.length)%F.opts.length;renderFreecam()}break;
    case 'displayCrosshair':crossUI(!!d.visible);break;
    case 'displayPlayerCard':playerCardShow(d);break;
    case 'setFooterUser':
      /* Le nom n'est plus affiche en bas a gauche : on ne fait que le
         conserver, l'emplacement reste vide par defaut. */
      B.userName=String(d.name).slice(0,32);break;
    case 'setFooterLogo':{
      if(!d.url)break;
      B.logoUrl=String(d.url);
      applyFooterLogo(B.logoEl,B.logoUrl);break}
    case 'notify':notify(d.header||'Info',d.message,d.duration||4000,d.type||'info');break;
  }
});
/* ================= APERCU HORS JEU (fichier ouvert dans un navigateur) ================= */
if(location.protocol==='file:'){
  const go=()=>{
    postMessage({action:'setTabs',tabs:['Main','Settings'],index:0},'*');
    postMessage({action:'setBreadcrumb',path:''},'*');
    postMessage({action:'setCurrent',current:2,menu:[
      {type:'submenu',label:'Self',icon:'ph-user'},
      {type:'submenu',label:'Online',icon:'ph-hard-drives'},
      {type:'submenu',label:'Vehicle',icon:'ph-car'},
      {type:'submenu',label:'World',icon:'ph-globe'},
      {type:'checkbox',label:'Show Keybinds',icon:'ph-keyboard',checked:true},
      {type:'slider',label:'Opacity',icon:'ph-circle-half',value:60,min:0,max:100,step:1},
      {type:'scroll',label:'Theme',icon:'ph-palette',options:[{label:'Dark'},{label:'Light'},{label:'Auto'}],selected:1},
      {type:'button',label:'Search',icon:'ph-list-magnifying-glass'}
    ]},'*');
    postMessage({action:'notify',header:'Preview',message:'Browser preview mode',type:'info',duration:5000},'*');
  };
  setTimeout(go,50);
}
})();
</script>
