<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus UI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Notifications (nouveau design "foret + sauge") -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            background: transparent !important;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }
        #app { position: absolute; inset: 0; pointer-events: none; }
    </style>

    <!--
    ==================================================================
      NEXUS UI - Page NUI FiveM (fichier unique, aucune dépendance locale)
    ==================================================================
      Cette page ne contient QUE l'interface (aucun contrôleur de démo).
      Elle est pilotée uniquement par des messages envoyés depuis votre
      script client (Lua / JS) via SendNUIMessage({ action = '...', ... }).

      --- fxmanifest.lua --------------------------------------------------
        fx_version 'cerulean'
        game 'gta5'
        ui_page 'nexus-ui/index.html'
        files { 'nexus-ui/index.html' }
      ---------------------------------------------------------------------

      --- Côté Lua --------------------------------------------------------
        SendNUIMessage({ action = 'setVisible',         visible = true })
        SendNUIMessage({ action = 'setDiscordUsername', username = 'ton_pseudo' })
        SendNUIMessage({ action = 'buildMenu', tabs = { { label = 'Player', options = { ... } } } })
        SendNUIMessage({ action = 'notify', type = 'success', header = 'Titre', message = 'Message', duration = 3500 })

        RegisterNUICallback('close', function(_, cb) SetNuiFocus(false, false); cb({}) end)
      ---------------------------------------------------------------------

      --- Actions gérées par l'interface -----------------------------------
        setVisible              { visible }
        setDiscordUsername      { username }
        buildMenu               { tabs }                       tabs = { { label, options } }
        setTabIndex             { index }
        updateSelection         { index }
        updateCheckbox          { itemIndex, checked }
        updateSlider            { itemIndex, value }
        updateTooltip           { items }
        updateMenuColors        { mainColor }                  couleur du thème, ex: "#e74c3c"
        notify                  { type, header, message, duration }   type: success | warn | error | info
        updateKeybindList       { keybinds }                   toggleKeybindList { visible }
        updateSpectatorList     { spectators }                 toggleSpectatorList { visible }
        setSelectedPlayer       { playerData }                 clearSelectedPlayer
        showCrosshair           / hideCrosshair
        ctxAimbotShow           / ctxAimbotSet / ctxAimbotHide
        openTextInput           { question, value, placeholder }  closeTextInput
        showProgressBar         / updateProgress { percent, topText, bottomText } / hideProgressBar
        setHoveringTextOptions  { options }                    showHoveringText / hideHoveringText
      ==================================================================
    -->
</head>
<body>

    <div id="app"></div>

    <!-- ==================================================================
      PONT D'INTERCEPTION (doit se charger AVANT le bundle Nexus)
      ------------------------------------------------------------------
      menu.lua (framework Lapsus) pilote cette page avec SON protocole.
      La couche de compatibilite (en fin de page) doit recevoir les
      messages NUI AVANT le bundle pour pouvoir :
        - normaliser les paquets du Lua (table Lua vide -> []) ;
        - empecher setTabs / setTabIndex d'effacer la liste des options
          (le bundle reconstruit la liste depuis ses propres onglets,
          qui sont vides dans le protocole JuL) ;
        - traduire les actions JuL vers l'API window.* de Nexus.
      On memorise donc les handlers "message" au lieu de les enregistrer :
      c'est le pont qui fera l'enregistrement reel, et il diffusera vers
      le bundle uniquement ce que le bundle doit voir.
      ================================================================== -->
    <script>
        (function () {
            var orig = window.addEventListener.bind(window);
            window.__julBridge = { handlers: [], orig: orig };
            window.addEventListener = function (type, fn, opts) {
                if (type === 'message' && typeof fn === 'function') {
                    window.__julBridge.handlers.push(fn);
                    return;
                }
                return orig(type, fn, opts);
            };
        })();
    </script>

    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    #menu-root {
        font-family: sans-serif;
        color: white;
        position: fixed;
        top: 21.5vh;
        left: 14.25vh;
        width: 35vh;
        z-index: 1000;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-root.visible { opacity: 1; transform: scale(1); }
    #menu-root.hiding { opacity: 0; transform: scale(0.95); }

    #tooltip-container {
        font-family: sans-serif;
        position: fixed;
        top: 21.5vh;
        left: calc(14.25vh + 35vh + 0.5vh);
        width: 20vh;
        background-color: rgb(20, 20, 20);
        border-radius: 0.45vh;
        padding: 0.9vh 1.4vh;
        font-size: 1.3vh;
        display: none;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #tooltip-container.visible { display: block; opacity: 1; transform: scale(1) translateY(0); }
    #tooltip-container.hiding { opacity: 0; transform: scale(0.95) translateY(-0.45vh); }

    .tooltip-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5vh; min-height: 2.2vh; box-sizing: border-box; }
    .tooltip-item:last-child { margin-bottom: 0; }
    .tooltip-label { color: rgba(255,255,255,0.85); flex-shrink: 0; }
    .tooltip-value-container { display: flex; align-items: center; gap: 0.5vh; min-height: 2.2vh; flex-shrink: 0; }
    .tooltip-value { font-weight: 500; color: rgba(255,255,255,0.85); line-height: 1.2; }
    .tooltip-icon { width: auto; height: 1.45vh; object-fit: cover; flex-shrink: 0; order: -1; }
    .tooltip-image { width: 2.2vh; height: 2.2vh; border-radius: 0.3vh; object-fit: cover; flex-shrink: 0; }
    .tooltip-bar { width: 0.45vh; height: 1.45vh; background-color: rgba(255,255,255,0.1); border-radius: 0.45vh; position: relative; overflow: hidden; flex-shrink: 0; }
    .tooltip-bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; border-radius: 0.15vh; transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

    #header-wrapper {
        /* Fond retire : l'ecart entre banniere et bande d'onglets est
           transparent, le jeu se voit a travers (demande : "invisible"). */
        background-color: transparent;
        /* Cotes bas CARRES : la bande d'onglets est collee a la liste et
           doit etre une ligne continue. L'ancien rayon 0.45vh sur les
           quatre coins rognait les extremites basse de la bande
           (overflow:hidden) et laissait une encoche claire de part et
           d'autre. */
        border-radius: 0.45vh 0.45vh 0 0;
        /* overflow RETIRE : la banniere doit desormais depasser le menu
           sur les cotes (demande), et le rognage la couperait net. La bande
           d'onglets s'elle-meme son overflow:hidden + son rayon 1.36vh. */
        /* 0 : la bande d'onglets doit etre COLLEE au menu (demande). Avec
           l'ancien 0.45vh + la marge basse de la bande (0.55vh) il y avait
           1vh de blanc entre les onglets et la liste. */
        margin-bottom: 0;
        opacity: 0;
        transform: translateY(-0.9vh);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #header-wrapper.visible { opacity: 1; transform: translateY(0); }
    #header-wrapper.hiding { opacity: 0; transform: translateY(-0.9vh); }

    #menu-container {
        background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
        /* Cotes haut CARRES pour affleurer la bande d'onglets : la
           couture doit etre une seule ligne, sans encoche. Bas arrondi
           conserve. */
        border-radius: 0 0 0.45vh 0.45vh;
        overflow: hidden;
        position: relative;
        opacity: 0;
        transform: translateY(-0.45vh);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-container.visible { opacity: 1; transform: translateY(0); }
    #menu-container.hiding { opacity: 0; transform: translateY(-0.45vh); }

    /* Tete du menu en cartes detachees : banniere ET bandeau d'onglets
       partagent la meme marge de 0.55vh et le meme rayon de 0.4vh, donc
       leurs bords gauches sont alignes (bord gauche du menu). Le wrapper
       n'a plus de fond : les ecarts sont transparents et le jeu se voit
       a travers les deux cartes. */
    #menu-banner {
        /* Ecart demande entre banniere et onglets : 2vh (2x l'ancien 1vh,
           juge trop petit). Marge laterale 0.55vh inchangee.
           --banner-off : reglage "Banner Offset" de Settings > Misc. Le
           haut et le bas sont compenses (0.55+off et 2-off) : la hauteur
           du wrapper reste constante, donc la banniere monte ou descend
           SANS bouger les onglets ni la liste. */
        /* Marge laterale NEGATIVE : la banniere depasse le menu de 0.2vh de
           chaque cote seulement -- "juste un tout petit peu plus grand".
           0.75vh = 0.55vh de marge du bloc + 0.2vh de debord ; l'image
           (width:100%) finit donc a 0.2vh au-dela du menu. */
        margin: 0 -0.75vh;
        padding: calc(0.55vh + var(--banner-off, 0vh)) 0.55vh calc(2vh - var(--banner-off, 0vh));
        overflow: visible;
    }
    #banner-image {
        /* 11vh au lieu de 9.4vh : banniere agrandie a la demande.
           object-fit: cover = l'image est recadree, jamais etiree. */
        width: 100%; height: 11vh; object-fit: cover; display: block;
        /* Uniquement les 4 coins arrondis -- pas de forme stadium : le rayon
           reste inferieur a la demi-hauteur (1.5vh < 5.5vh), donc les bords
           haut et bas restent droits entre les coins. */
        border-radius: 1.5vh;
    }

    /* Bande d'onglets COLLEE au menu : ni marge laterale ni marge basse,
       donc elle fait exactement la meme largeur que #menu-container et la
       jonction est franche (demande : "ca doit se rejoindre"). La marge
       laterale de 0.55vh restait sur la banniere, seule. Fond opaque
       #414141 = exactement le rendu actuel (rgba(255,255,255,0.07) sur
       #333) : sans le fond du wrapper, l'ancien rgba rendrait la bande
       quasi invisible.
       Coins arrondis EN HAUT SEULEMENT : 1.36vh = demi-hauteur de la
       bande, soit le meme rayon que celui des extremites precedemment
       affichees. La base reste droite contre la liste. */
    #menu-tabs {
        display: flex;
        margin: 0;
        /* Fond OPAQUE (alpha 1) : les petits recoins laisses par les coins
           arrondis des onglets (les "trous" en V / crescents) ne laissent
           plus voir le jeu a travers la bande. Couleur du menu conservee
           pour que les contours noirs des onglets restent visibles. */
        background-color: rgb(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b));
        border-radius: 0.9vh 0.9vh 0 0;
        /* Rayon egal a celui des .tab-item (0.9vh) : la bordure noire des
           onglets extrements suit exactement le coin de la bande, plus de
           "trou" (bout de jeu visible) aux extremites. */
        /* PAS de overflow:hidden ici : il rognait le bord arrondi de
           l'onglet et la ligne disparaitait dans les coins. */
    }
    .tab-item {
        flex: 1; min-width: 0; padding: 0.8vh 0; font-size: 1.1vh; text-align: center;
        cursor: pointer; color: rgba(255,255,255,0.6); background: transparent;
        /* Encadrement NOIR autour de l'onglet. */
        border: 0.07vh solid #000;
        /* Coins arrondis UNIQUEMENT EN HAUT : le bas reste droit (a plat
           contre la liste du menu), pas d'encoche arrondie en bas. */
        border-radius: 0.9vh 0.9vh 0 0;
        /* Pas de rayon en bas : la base de la bande doit rester droite.
           Les anciens border-bottom-*-radius: 0.5vh laissaient des encoches
           claires sous la couleur active. */
        transition: 0.3s; position: relative;
        /* z-index:0 cree un contexte d'empilement : le ::before (z-index:-1)
           de la couleur active restait ALORS derriere le fond opaque de la
           bande. On l'enferme ici : bleu au-dessus de #414141, texte au-
           dessus du bleu. Indispensable depuis que la bande n'est plus
           translucide. */
        z-index: 0;
    }
    .tab-item::before {
        content: ''; position: absolute;
        /* Remplissage a l'INTERIEUR du cadre : il ne depasse pas les
           lignes (bordure). Il occupe la zone interieure de l'onglet. */
        top: 0; bottom: 0; left: 0; right: 0;
        /* Onglet selectionne : rempli de la COULEUR DU MENU (plein).
           Rayon = 0.9vh - 0.07vh (bordure) = 0.83vh : le remplissage
           épouse le coin INTERIEUR de la bordure. Avec 0.9vh il etait
           plus arrondi que l'espace dispo, un croissant de fond restait
           visible entre le noir et le bleu = "plusieurs lignes". */
        background: rgb(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b));
        border-radius: 0.83vh 0.83vh 0 0;
        transform: scaleY(0); transform-origin: bottom; transition: 0.5s; z-index: -1;
    }
    .tab-item.single { min-width: 8vh; flex-grow: 0; padding: 0.8vh 1vh; flex-basis: auto; }
    .tab-item.active { color: white; font-weight: 500; }
    .tab-item.active::before { transform: scaleY(1); }

    #menu-items { position: relative; max-height: 39vh; overflow: hidden; }
    #items-list { position: relative; transition: transform 0.25s ease-out; }

    .menu-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 1vh 1vh; font-size: 1.2vh; border-radius: 0.2vh;
        transition: background-color 0.2s ease-in-out; height: 3vh; box-sizing: border-box;
        text-shadow: 0 0.1vh 0.25vh rgba(0,0,0,0.55);
    }
    .separator-container { display: flex; align-items: center; width: 100%; gap: 1vh; }
    .separator-bar { flex: 1; height: 0.3vh; background-color: rgba(255,255,255,0.8); min-width: 2vh; border-radius: 0.2vh; }
    .separator-text { color: rgba(255,255,255,0.9); font-weight: 500; white-space: nowrap; padding: 0 0.5vh; }
    .menu-item.separator { justify-content: center; font-weight: 500; color: rgba(255,255,255,0.6); padding: 0.8vh 1.5vh; pointer-events: none; }

    #selection-highlight {
        /* REMPLIT TOUTE la hauteur de la ligne (3vh) : marge a 0 et
           height = 3vh, plus de bandes vides en haut/bas de la ligne. */
        position: absolute; margin-top: 0; top: 0; left: 0; right: 0; height: 3vh;
        /* Remplissage PLEIN (couleur du menu, opaque et uniforme), sans
           voile sombre ni degradé : la selection est bien "remplie". */
        /* REMPLISSAGE PLEIN ET UNIFORME a la couleur du menu :
           plus de voile sombre au centre (il donnait un effet "creux",
           la selection semblait non remplie). */
        background:
            rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 1);
        box-shadow:
            /* liseres tres legers pour la lisibilite */
            inset 0 0.16vh 0 rgba(255,255,255,0.13),
            inset 0 -0.10vh 0 rgba(0,0,0,0.12),
            /* nappe lumineuse tout autour */
            0 0 0.3vh rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.20);
        border-radius: 0.35vh; z-index: -1; transition: top 0.25s ease-out;
    }

    .components-container { display: flex; gap: 1vh; align-items: center; }
    .component { display: flex; align-items: center; gap: 0.5vh; }
    .component.icon { order: -1; }
    .component .icon-image { width: auto; height: 1.6vh; object-fit: contain; flex-shrink: 0; }
    .component .slider-component { display: flex; align-items: center; justify-content: center; width: auto; font-size: 1.2vh; text-align: center; user-select: none; }
    .component .slider-component span { margin: 0 0.8vh; min-width: 5vh; }
    .component .slider-component span::before { content: '- '; color: rgba(255,255,255,0.6); }
    .component .slider-component span::after { content: ' -'; color: rgba(255,255,255,0.6); }
    .component .range-component { position: relative; width: 11vh; height: 2vh; display: flex; align-items: center; gap: 0.5vh; }
    .component .range-value { flex: none; min-width: 3vh; text-align: right; color: rgba(255,255,255,0.9); font-size: 1.1vh; font-variant-numeric: tabular-nums; line-height: 1; }
    .component .range-body { position: relative; flex: 1; height: 2vh; display: flex; align-items: center; }
    .component .range-track { position: absolute; left: 0; width: 100%; height: 0.4vh; background-color: rgba(255,255,255,0.2); border-radius: 0.2vh; z-index: 1; }
    .component .range-fill { position: absolute; left: 0; height: 0.4vh; background-color: #fff; border-radius: 0.2vh; z-index: 2; }
    .component input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 0.4vh; background: transparent; outline: none; padding: 0; margin: 0; cursor: pointer; position: relative; z-index: 3; }
    .component input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 1.4vh; height: 1.4vh; background: #fff; border-radius: 50%; cursor: pointer; margin-top: 0; }
    .component input[type="range"]::-moz-range-thumb { width: 1.4vh; height: 1.4vh; background: #fff; border-radius: 50%; cursor: pointer; border: none; }
    .component button { background: #4a4a4a; border: none; color: white; padding: 0.3vh 0.8vh; border-radius: 0.3vh; font-size: 1.2vh; cursor: pointer; transition: background 0.2s ease; }
    .component button:hover { background: #6a6a6a; }
    .component input[type="checkbox"] { -webkit-appearance: none; appearance: none; background-color: #333; margin: 0; width: 3.3vh; height: 1.4vh; border-radius: 1vh; cursor: pointer; position: relative; box-shadow: inset 0 0 0 0.08vh rgba(0,0,0,0.5); transition: background-color 0.2s ease-in-out; }
    .component input[type="checkbox"]::after { content: ''; position: absolute; top: 0.2vh; left: 0.2vh; width: 1vh; height: 1vh; background-color: #f0f0f0; border-radius: 50%; transition: left 0.2s ease-in-out; }
    .component input[type="checkbox"]:checked { background-color: rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.95); }
    .component input[type="checkbox"]:checked::after { left: 2vh; }

    #menu-footer {
        background-color: var(--ui-back);
        display: flex; justify-content: space-between; align-items: center;
        border-radius: 0.45vh; padding: 0.45vh 0.95vh; font-size: 1.15vh; color: white;
        margin-top: 0.45vh; height: 1.95vh;
        opacity: 0; transform: translateY(1vh);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-footer.visible { opacity: 1; transform: translateY(0); }
    #menu-footer.hiding { opacity: 0; transform: translateY(1vh); }
    #footer-left { font-weight: 500; }
    #footer-right { font-family: monospace; }

    #menu-scrollbar {
        /* top recalcule : la barre doit partir pile au niveau de la
           PREMIERE option et finir au niveau de la DERNIERE. Les options
           demarrent a 16.25vh depuis #menu-root (banniere portee a 11vh)
           et la hauteur (39vh) est deja celle de la zone des options, donc
           aligner le haut aligne aussi le bas. Valeur de repli seule :
           syncScrollbar() reecrit le style en px reels a chaque rebuild. */
        position: absolute; left: -1.2vh; top: 16.25vh; width: 0.6vh; height: 39vh;
        opacity: 0; transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-scrollbar.visible { opacity: 1; }
    #menu-scrollbar.hiding { opacity: 0; }
    #scrollbar-track { width: 100%; height: 100%; background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8); border-radius: 0.4vh; position: relative; }
    #scrollbar-thumb { position: absolute; top: 0; left: 0; width: 100%; background-color: rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.95); border-radius: 0.2vh; transition: top 0.25s ease-out, height 0.25s ease-out; min-height: 2vh; }
    #scrollbar-thumb:hover { background-color: var(--ui-main); }

    /* ---------------- pile de notifications (nouveau design) --------------
       Le conteneur est cree par le bundle (#notification-container) : on le
       reconvertit en pile .toasts. Meme position qu'avant (bas-droite, 2vh)
       pour ne pas recouvrir le panneau Keybinds en haut a droite. */
    #notification-container {
        position: fixed; bottom: 2vh; right: 2vh; z-index: 2000;
        display: flex; flex-direction: column; align-items: flex-end; gap: 1.1vh;
        pointer-events: none; width: auto;
        font-family: 'Bricolage Grotesque', Inter, sans-serif;
        font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
    }

    .input-overlay {
        position: fixed; top: 0; left: 0; transform: none; width: 100%; height: 100%;
        background: rgb(0,0,0,0.5); z-index: 999999; color: white; font-weight: 300;
        font-family: sans-serif; font-size: 1.2vh; transition: 0.5s;
    }
    .input-box {
        background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
        border-radius: 0.25vh; display: flex; flex-direction: column;
        position: fixed; bottom: 17.5vh; left: 50%; transform: translateX(-50%);
        height: auto; width: 55vh; overflow: hidden;
    }
    .input-box > .input-header { padding: 0.8vh 1vh 0.8vh 1vh; border-bottom: 0.1vh solid var(--ui-main); width: 100%; font-size: 1.2vh; }
    .input-box input { padding: 1.25vh 1vh 1.25vh 1vh; border: none; outline: none; background: transparent; color: white; font-size: 1.2vh; }
    .input-box input::selection { background-color: var(--ui-main); color: white; }
    .input-header-inner { display: flex; align-items: center; gap: 0.5vh; }
    .input-header-inner img { width: auto; height: 2vh; object-fit: contain; }
    .input-divider { width: 0.2vh; height: 1.5vh; background: white; }
    .input-header-text { color: white; }

    .notification {
        width: 100%; min-height: 5.5vh;
        background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
        padding: 1.1vh 5vh 1.1vh 1.5vh; display: flex; flex-direction: column;
        gap: 0.35vh; word-wrap: break-word; word-break: break-word; hyphens: auto;
        box-sizing: border-box; transform: translateX(100%); opacity: 0;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative; overflow: hidden;
    }
    .notification.show { transform: translateX(0); opacity: 1; }
    .notification.hide { transform: translateX(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.6, 1); }
    .notification-side { position: absolute; top: -1.1vh; left: 0; height: calc(100% + 2.2vh); width: 0.3vh; }
    .notification-header { font-weight: 600; font-size: 1.4vh; color: white; margin-bottom: 0.15vh; line-height: 1.3; word-wrap: break-word; word-break: break-word; }
    .notification-message { font-size: 1.1vh; color: rgba(255,255,255,0.85); line-height: 1.4; word-wrap: break-word; word-break: break-word; hyphens: auto; }
    .notification-progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 0.3vh; }
    .notification-progress-bar { position: absolute; top: 0; left: 0; height: 100%; width: 100%; transform-origin: left; transition: transform linear; }
    .notification-icon { position: absolute; right: 1.1vh; top: 50%; transform: translateY(-50%); width: 2.2vh; height: 2.2vh; object-fit: contain; z-index: 1; }

    /* --- Remplacement : notifications type "toast" -------------------------
       Palette foret + sauge, colonne d'icone sombre, filet lumineux vertical,
       touche en relief et barre de duree qui se vide jusqu'a la disparition.
       Toutes les tailles viennent du gabarit px d'origine converti a 10.8 px/vh
       (reference 1080p) : 360px -> 33.3vh, 20px -> 1.85vh, 68px -> 6.3vh...
       Les regles .notification* ci-dessus restent en place pour le mode demo. */
    .toast {
        /* Toute la carte prend la COULEUR DU MENU : --jul-acc, la teinte que
           le Lua pose via setMenuColor (gris DBZ au demarrage, bleu JUL_SKY
           pour Simpsons) et qui colore deja Keybinds et la barre de Loading.
           L'accent est pose en rgba AU-DESSUS d'une base sombre : un rgba
           seul laisserait la carte transparente. */
        --accent: var(--jul-acc);
        --accent-rgb: var(--jul-acc-rgb);
        /* teinte du type -- gardee uniquement sur l'icone et la barre de
           duree pour que success / error restent lisibles d'un coup.
           Sans type reconnu, c'est la couleur du menu qui sert. */
        --type: var(--accent);
        --type-rgb: var(--accent-rgb);

        position: relative; display: flex;
        width: min(33.3vh, calc(100vw - 3.7vh));
        border-radius: 1.85vh; overflow: hidden;
        pointer-events: auto; cursor: pointer;
        background:
            linear-gradient(180deg, rgba(var(--accent-rgb), 0.42), rgba(var(--accent-rgb), 0.26)),
            #262c30;
        box-shadow:
            0 0 0 0.14vh rgba(var(--accent-rgb), 0.45),
            0 1.85vh 4.1vh -1.5vh rgba(0, 0, 0, 0.6),
            inset 0 0.19vh 0 rgba(255, 255, 255, 0.12);
        animation: julToastIn 0.45s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
        transition:
            transform 0.35s cubic-bezier(0.5, 0, 1, 0.6),
            opacity 0.3s ease,
            height 0.35s ease 0.06s,
            margin-bottom 0.35s ease 0.06s;
    }
    .toast.success { --type: #c8f7ab; --type-rgb: 200, 247, 171; }
    .toast.info    { --type: #a8ecdf; --type-rgb: 168, 236, 223; }
    .toast.warning { --type: #ffd98a; --type-rgb: 255, 217, 138; }
    .toast.error   { --type: #ffa595; --type-rgb: 255, 165, 149; }
    .toast.leaving { opacity: 0; transform: translateX(2.8vh); }

    /* colonne d'icone : l'en-tete des autres panneaux, tournee a la verticale.
       Meme base sombre que la carte mais teintee par la couleur du menu. */
    .t-side {
        position: relative; flex: none; display: grid; place-items: center;
        width: 6.3vh;
        background:
            linear-gradient(180deg, rgba(var(--accent-rgb), 0.20), rgba(var(--accent-rgb), 0.06)),
            #12171a;
    }
    /* filet lumineux, vertical cette fois -- couleur du menu */
    .t-side::after {
        content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 0.19vh;
        background: linear-gradient(180deg, transparent, var(--accent) 30%, var(--accent) 70%, transparent);
        opacity: 0.95;
        box-shadow: 0 0 1.3vh rgba(var(--accent-rgb), 0.6);
    }
    .t-icon {
        display: grid; place-items: center; width: 3.7vh; height: 3.7vh;
        border-radius: 1.1vh; color: var(--type);
        background: rgba(var(--type-rgb), 0.08);
        box-shadow:
            inset 0 0 0 0.14vh rgba(var(--type-rgb), 0.5),
            0 0 1.7vh -0.4vh rgba(var(--type-rgb), 0.6);
    }
    .t-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1.1vh; padding: 1.4vh 1.5vh 1.65vh 1.65vh; }
    .t-text { flex: 1; min-width: 0; }
    .t-title { font-size: 1.57vh; font-weight: 600; letter-spacing: -0.005em; color: #f6fbf2; word-wrap: break-word; }
    .t-msg { margin-top: 0.19vh; font-size: 1.3vh; font-weight: 400; line-height: 1.35; color: #d8e4d3; word-wrap: break-word; word-break: break-word; hyphens: auto; }

    /* touche en relief, comme dans le panneau Keybinds (reserve : le Lua
       n'envoie pas encore de champ "key") */
    .toast .key {
        flex: none; display: inline-flex; align-items: center; justify-content: center;
        min-width: 4.07vh; height: 3.15vh; padding: 0 1.1vh;
        border-radius: 0.93vh; font-size: 1.25vh; font-weight: 700; letter-spacing: 0.01em;
        color: #1b261c;
        background: linear-gradient(180deg, #f1f6ea, #d2dcc8);
        box-shadow:
            inset 0 0.09vh 0 #fff,
            inset 0 -0.19vh 0 rgba(0, 0, 0, 0.06),
            0 0.37vh 0 #7d9078,
            0 0.74vh 1.1vh -0.37vh rgba(0, 0, 0, 0.45);
        animation: julKeyDrop 0.55s cubic-bezier(0.3, 1.35, 0.5, 1) 0.3s backwards;
    }

    /* barre de duree : se vide jusqu'a la disparition -- teinte du type,
       pour que l'oeil decouvre tout de suite une erreur meme de loin */
    .t-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 0.28vh; background: rgba(0, 0, 0, 0.18); }
    .t-bar::after {
        content: ""; position: absolute; inset: 0; background: var(--type);
        box-shadow: 0 0 0.9vh rgba(var(--type-rgb), 0.8);
        transform-origin: left;
        animation: julToastDrain var(--dur) linear forwards;
    }
    .toast.paused .t-bar::after { animation-play-state: paused; }

    @keyframes julToastIn   { from { opacity: 0; transform: translateX(3vh) scale(0.97); } }
    @keyframes julKeyDrop   { from { opacity: 0; transform: translateY(-1.3vh); } 60% { opacity: 1; transform: translateY(0.19vh); } }
    @keyframes julToastDrain { to { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { .toast, .toast .key { animation: none; } }

            var mainMenu = {

            var THEME_COLORS = ["#e74c3c", "#3498db", "#2ecc71", "#9b59b6", "#f39c12"];

            /* ========================= ETAT DEMO =========================== */
            var navStack = [mainMenu];
            var currentItemIndex = 0;

            var isKeybindsOpen = false;
            var isSpectatorsOpen = false;
            var isPlayerInfoOpen = false;
            var isCrosshairOpen = false;
            var isAimbotFovOpen = false;
            var isHoveringTextOpen = false;

            function currentNode() {
                return navStack[navStack.length - 1];
            }

            function currentOptions() {
                return currentNode().options;
            }

            function sendAction(action, data) {
                var payload = data || {};
                payload.action = action;
                window.postMessage(payload, "*");
            }

            function firstSelectable(options) {
                for (var i = 0; i < options.length; i++) {
                    if (!options[i].separator) return i;
                }
                return 0;
            }

            function renderCurrent(resetIndex) {
                var node = currentNode();
                sendAction("buildMenu", { tabs: [{ label: node.label, options: node.options }] });
                sendAction("setTabIndex", { index: 0 });

                if (resetIndex !== false) currentItemIndex = firstSelectable(node.options);

                setTimeout(function () {
                    sendAction("updateSelection", { index: currentItemIndex });
                    updateTooltipForCurrent();
                }, 60);
            }

            function updateTooltipForCurrent() {
                sendAction("updateTooltip", { items: [] });
            }

            function openSubmenu(node) {
                navStack.push(node);
                renderCurrent(true);
            }

            function goBack() {
                if (navStack.length > 1) {
                    navStack.pop();
                    renderCurrent(true);
                } else {
                    isMenuVisible = false;
                    sendAction("setVisible", { visible: false });
                }
            }

            function activateCurrent() {
                var options = currentOptions();
                var item = options[currentItemIndex];
                if (!item) return;

                if (item.submenu) {
                    openSubmenu(item.submenu);
                    return;
                }

                if (item.checkbox !== undefined) {
                    item.checkbox.checked = !item.checkbox.checked;
                    sendAction("updateCheckbox", { itemIndex: currentItemIndex, checked: item.checkbox.checked });
                    sendAction("notify", {
                        type: item.checkbox.checked ? "success" : "warn",
                        header: item.name,
                        message: item.checkbox.checked ? "Ozellik aktif edildi." : "Ozellik kapatildi.",
                        duration: 2200
                    });
                    updateTooltipForCurrent();
                } else if (item.button !== undefined) {
                    sendAction("notify", {
                        type: "info",
                        header: item.name,
                        message: '"' + item.name + '" aksiyonu tetiklendi.',
                        duration: 2200
                    });
                }
            }

            function moveSelection(dir) {
                var options = currentOptions();
                var next = currentItemIndex;
                var len = options.length;
                for (var step = 0; step < len; step++) {
                    next = (next + dir + len) % len;
                    if (options[next] && !options[next].separator) {
                        currentItemIndex = next;
                        break;
                    }
                }
                sendAction("updateSelection", { index: currentItemIndex });
                updateTooltipForCurrent();
            }

            function changeSlider(dir) {
                var item = currentOptions()[currentItemIndex];
                if (!item || !item.slider) return;
                var maxVal = item.slider.options.length;
                if (dir > 0) {
                    item.slider.value = item.slider.value >= maxVal ? 1 : item.slider.value + 1;
                } else {
                    item.slider.value = item.slider.value <= 1 ? maxVal : item.slider.value - 1;
                }
                sendAction("updateSlider", { itemIndex: currentItemIndex, value: item.slider.value });

                if (item.name === "Theme Color") {
                    var chosen = THEME_COLORS[item.slider.value - 1] || "#e74c3c";
                    sendAction("updateMenuColors", { mainColor: chosen });
                }
                updateTooltipForCurrent();
            }

            function initializeNexusMenu() {
                if (!started) return;

                sendAction("setDiscordUsername", { username: "alperencontact" });
                sendAction("setVisible", { visible: true });
                isMenuVisible = true;

                navStack = [mainMenu];
                currentItemIndex = 0;
                renderCurrent(true);

                sendAction("updateKeybindList", {
                    keybinds: [
                        { name: "Toggle No Clip", controlName: "Caps Lock", enabled: false },
                        { name: "Toggle Freecam", controlName: "Minus Key", enabled: false }
                    ]
                });
                sendAction("toggleKeybindList", { visible: true });

                setTimeout(function () {
                    sendAction("notify", {
                        type: "success",
                        header: "Nexus UI Hazir",
                        message: "Mode demo actif. Haut/Bas naviguer, ENTER ouvrir, RETOUR revenir, M cacher.",
                        duration: 4500
                    });
                }, 450);
            }

            /* ====================== LISTENERS DEMO ========================= */
            var onDemoKeyDown = function (e) {
                var overlay = document.querySelector(".input-overlay");
                if (overlay && overlay.style.pointerEvents === "auto") {
                    if (e.key === "Escape") sendAction("closeTextInput");
                    return;
                }

                if (e.key === "Delete" || e.key === "m" || e.key === "M") {
                    isMenuVisible = !isMenuVisible;
                    sendAction("setVisible", { visible: isMenuVisible });
                    return;
                }

                if (!isMenuVisible) return;

                switch (e.key) {
                    case "ArrowUp":
                        e.preventDefault();
                        moveSelection(-1);
                        break;
                    case "ArrowDown":
                        e.preventDefault();
                        moveSelection(1);
                        break;
                    case "ArrowLeft":
                    case "q":
                    case "Q":
                        e.preventDefault();
                        var prev = currentOptions()[currentItemIndex];
                        if (prev && prev.slider) changeSlider(-1);
                        break;
                    case "ArrowRight":
                    case "e":
                    case "E":
                        e.preventDefault();
                        var next = currentOptions()[currentItemIndex];
                        if (next && next.slider) changeSlider(1);
                        break;
                    case "Enter":
                    case " ":
                        e.preventDefault();
                        activateCurrent();
                        break;
                    case "Backspace":
                        e.preventDefault();
                        goBack();
                        break;
                }
            };

            var onDemoClick = function (e) {
                var menuItem = e.target.closest(".menu-item");
                if (menuItem && menuItem.dataset.index !== undefined && !menuItem.classList.contains("separator")) {
                    var idx = parseInt(menuItem.dataset.index, 10);
                    var options = currentOptions();
                    if (idx === currentItemIndex) {
                        var item = options[idx];
                        if (item && item.slider) changeSlider(1);
                        else activateCurrent();
                    } else {
                        currentItemIndex = idx;
                        sendAction("updateSelection", { index: currentItemIndex });
                        updateTooltipForCurrent();
                    }
                }
            };

            var onDemoContext = function (e) {
                if (e.target.closest("#menu-root")) {
                    e.preventDefault();
                    goBack();
                }
            };

            /* ============================ OUTILS =========================== */
            window.nexusTest = {
                toggleMenu: function () {

                testNotification: function (type) {
                    var types = {

                        error: { header: "Hata Olustu", msg: "Hedef oyuncu bulunamadi veya cevrimdisi." },
                        info: { header: "Nexus Bilgi", msg: "Surum 2.4.1 guncel durumda." }
                    };
                    var conf = types[type] || types.info;
                    sendAction("notify", { type: type || "info", header: conf.header, message: conf.msg, duration: 3500 });
                },

                testProgressBar: function () {
                    sendAction("showProgressBar");

                        pct += 10;

                toggleKeybinds: function () {

                    if (isKeybindsOpen) {

                    }
                    sendAction("toggleKeybindList", { visible: isKeybindsOpen });
                },

                toggleSpectators: function () {
                    isSpectatorsOpen = !isSpectatorsOpen;
                    if (isSpectatorsOpen) {
                        sendAction("updateSpectatorList", {
                            spectators: [
                                { name: "Admin_John", id: 4 },

                            ]
                        });
                    }
                    sendAction("toggleSpectatorList", { visible: isSpectatorsOpen });
                },

                togglePlayerInfo: function () {
                    isPlayerInfoOpen = !isPlayerInfoOpen;
                    if (isPlayerInfoOpen) {
                        sendAction("setSelectedPlayer", {
                            playerData: {
                                name: "Michael_Townley", id: 77, job: "Los Santos Police", group: "Supervisor",
                                health: 85, armor: 60, weapon: "WEAPON_CARBINERIFLE", isInVehicle: false,
                                speed: "0 km/h", distance: "18.4 m", isAlive: true, phone: "555-0149"

                        });
                    } else {
                        sendAction("clearSelectedPlayer");
                    }
                },

                toggleCrosshair: function () {
                    isCrosshairOpen = !isCrosshairOpen;
                    sendAction(isCrosshairOpen ? "showCrosshair" : "hideCrosshair");
                },

                toggleAimbotFov: function () {
                    isAimbotFovOpen = !isAimbotFovOpen;
                    if (isAimbotFovOpen) {
                        sendAction("ctxAimbotShow", { targetOpacity: 0.9, radius: 120, radiusOpacity: 0.6 });
                        sendAction("ctxAimbotSet", {
                            target: { x: window.innerWidth / 2 + 100, y: window.innerHeight / 2 - 80 },
                            targetOpacity: 0.8, radius: 120, radiusOpacity: 0.6

                    } else {
                        sendAction("ctxAimbotHide");
                    }
                },

                testTextInput: function () {
                    sendAction("openTextInput", { question: "Yeni Arac Plakasi Giriniz:", value: "NEXUS01", placeholder: "Orn: 34ABC123" });
                },

                testHoveringText: function () {
                    isHoveringTextOpen = !isHoveringTextOpen;
                    if (isHoveringTextOpen) {
                        sendAction("setHoveringTextOptions", {
                            options: [
                                { id: "1", name: "Teleport to Waypoint", data: "(Safe)" },
                                { id: "2", name: "Teleport to Custom Coord", data: "" },
                                { id: "3", name: "Teleport to Closest Vehicle", data: "(Driver)" },
                                { id: "4", name: "Teleport into Interior", data: "" }

                        });
                        sendAction("showHoveringText");
                    } else {
                        sendAction("hideHoveringText");
                    }
                },

                changeColor: function (hex) {
                    sendAction("updateMenuColors", { mainColor: hex });
                    var idx = THEME_COLORS.indexOf(hex);
                    if (idx >= 0) {
                        var tc = settingsMenu.options.find(function (o) { return o.name === "Theme Color"; });
                        if (tc && tc.slider) tc.slider.value = idx + 1;
                    }
                }
            };

            /* ======================= AIDE A L'ECRAN ========================= */
            function showHint() {
                // Jamais affiché dans le jeu : la démo ne sert qu'au navigateur.
                if (window.invokeNative || window.GetParentResourceName) return;
                if (document.getElementById("nexus-demo-hint")) return;

                if (!document.getElementById("nexus-demo-style")) {
                    var css = document.createElement("style");
                    css.id = "nexus-demo-style";
                    css.textContent =
                        "#nexus-demo-hint{position:fixed;left:2vh;bottom:2vh;z-index:99999;display:flex;align-items:center;gap:.8vh;" +
                        "background:rgba(16,17,22,.92);color:#cbd5e1;border:1px solid rgba(255,255,255,.12);" +
                        "border-left:3px solid var(--ui-main,#e74c3c);border-radius:.6vh;padding:.7vh 1.2vh;" +
                        "font-family:'Inter',sans-serif;font-size:1.05vh;box-shadow:0 8px 30px rgba(0,0,0,.6);" +
                        "backdrop-filter:blur(10px);pointer-events:none}" +
                        "#nexus-demo-hint b{color:#fff;background:var(--ui-main,#e74c3c);padding:.2vh .7vh;border-radius:.35vh;" +
                        "font-size:.95vh;letter-spacing:.05vh;text-transform:uppercase}" +
                        "#nexus-demo-hint span{opacity:.85}";
                    document.head.appendChild(css);
                }

                var hint = document.createElement("div");
                hint.id = "nexus-demo-hint";
                hint.innerHTML =
                    "<b>Mode Demo</b><span>&uarr; &darr; naviguer &middot; ENTRER ouvrir &middot; RETOUR revenir &middot; " +
                    "&larr; &rarr; (ou Q / E) slider &middot; clic droit revenir &middot; M masquer</span>";
                document.body.appendChild(hint);
            }

            function hideHint() {
                var hint = document.getElementById("nexus-demo-hint");
                if (hint) hint.remove();
            }

            /* ======================== START / STOP ========================= */
            function start() {
                if (started) return true;
                started = true;

                window.addEventListener("keydown", onDemoKeyDown);
                document.addEventListener("click", onDemoClick);
                document.addEventListener("contextmenu", onDemoContext);

                teardown = function () {
                    window.removeEventListener("keydown", onDemoKeyDown);
                    document.removeEventListener("click", onDemoClick);
                    document.removeEventListener("contextmenu", onDemoContext);
                };

                showHint();
                initializeNexusMenu();
                return true;
            }

            function stop() {
                if (!started) return false;
                started = false;

                if (teardown) {
                    teardown();
                    teardown = null;
                }

                hideHint();

                sendAction("setVisible", { visible: false });
                sendAction("toggleKeybindList", { visible: false });
                sendAction("toggleSpectatorList", { visible: false });
                sendAction("clearSelectedPlayer");
                sendAction("hideCrosshair");
                sendAction("ctxAimbotHide");
                sendAction("hideHoveringText");
                sendAction("hideProgressBar");
                sendAction("closeTextInput");
                return false;
            }

            return {
                start: start,
                stop: stop,
                isStarted: function () { return started; }
            };
        })();

        /* Demarrage automatique UNIQUEMENT hors FiveM (fichier ouvert dans un navigateur) */
        if (!window.invokeNative && !window.GetParentResourceName) {
            window.NexusDemo.start();
        }

        /* Activation / desactivation a distance depuis le client :
           SendNUIMessage({ action = 'demoMode', enabled = true })  */
        window.addEventListener("message", function (e) {
            var data = e.data;
            if (!data || data.action !== "demoMode") return;
            if (data.enabled === false) window.NexusDemo.stop();
            else window.NexusDemo.start();
        });
    </script>

<style>
/* ==================================================================
   COUCHE DE COMPATIBILITE JuL  (menu.lua / framework Lapsus)
   - --jul-scale : echelle Menu Size (scale du menu, zoom des panneaux)
   - --jul-acc   : couleur du menu (Keybinds / Loading / logo)
   ================================================================== */
:root { --jul-scale: 0.8; --jul-acc: rgb(160,160,160); --jul-acc-rgb: 160,160,160; --banner-off: 1.3vh; }

/* Le menu porte lui-meme l'echelle envoyee par setUiScale.
   transform-origin: top left = meme systeme que menu-1 : x/y en vh
   restent des coordonnees d'origine, pas de recalcul. */
#menu-root,
#menu-root.visible,
#menu-root.hiding {
    transform: scale(var(--jul-scale, 1)) !important;
    transform-origin: top left !important;
}
/* On ne transite que l'opacite : la mise a l'echelle doit etre
   immediate (sinon la transition de 0.3 s reste bloquee sur
   l'ancien scale tant que l'onglet n'est pas visible). */
#menu-root {
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* Un seul onglet (page racine, sous-menu nomme) : la barre est masquee
   comme sur menu-1, et la barre de defilement remonte sur la banniere.
   13.55vh = la ou demarrent les options quand les onglets sont masques
   (16.25vh moins la hauteur du bandeau d'onglets). Valeur de repli, comme
   ci-dessus : syncScrollbar() reecrit le style en px reels. */
#menu-root.jul-single #menu-tabs { display: none; }
#menu-root.jul-single #menu-scrollbar { top: 13.55vh; }

/* --- marqueurs de lignes ( > sous-menu, + bouton ) ------------------- */
.jul-mark { font-size: 1.35vh; line-height: 1; font-weight: 600; color: rgba(255,255,255,0.85); }
.menu-item.is-off { opacity: 0.45; }
.veh-icon { flex: none; width: 1.7vh; height: 1.7vh; color: rgba(255,255,255,0.8); }
.veh-icon svg { width: 100%; height: 100%; display: block; }

/* --- emplacement bas-gauche : vide, sauf logo configure -------------- */
#footer-left { display: inline-flex; align-items: center; min-width: 0; }
#footer-left img { height: 2.4vh; width: auto; display: block; mix-blend-mode: screen; }

/* --- fiche joueur : position calculee par positionCard() ------------- */
#app aside { transform: none !important; }
/* fond neutre : seul --jul-acc porte le bleu (banniere) */
#app aside { background-color: rgba(30,30,30,0.94) !important; }

/* --- boite de saisie : echelle par transform (le centrage de la
       boite se fait via translateX(-50%), incompatible avec zoom) ------ */
.input-box {
    transform: translateX(-50%) scale(var(--jul-scale, 1)) !important;
    transform-origin: bottom center !important;
}

/* ================= PANNEAU "KEYBINDS" (haut droite) ================== */
/* Habille le HUD Keybinds avec la COULEUR DU MENU (--ui-main) : bandeau
   titre colore, lignes / separateurs teintes a la couleur du menu. */
#jul-keybinds {
    position: fixed; top: 2.2vh; right: 2.2vh; z-index: 9996;
    width: 320px; max-width: calc(100vw - 32px); box-sizing: border-box;
    overflow: hidden; border-radius: 1vh; pointer-events: none;
    zoom: var(--jul-scale, 1);
    font-family: 'Inter', sans-serif;
    color: #f6fbf2;
    /* Corps sombre + liseré a la couleur du menu. */
    background: rgba(20, 20, 20, 0.94);
    border: 1px solid rgb(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b));
    box-shadow: 0 2.4vh 6vh rgba(0,0,0,0.45);
}
#jul-keybinds[hidden] { display: none; }
/* Bandeau titre a la COULEUR DU MENU. */
#jul-keybinds .kbl-head {
    padding: 1vh 1.6vh 0.9vh;
    background: rgb(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b));
    border-bottom: 1px solid rgba(255, 255, 255, 0.28);
}
#jul-keybinds .kbl-title {
    margin: 0; font-family: 'Bricolage Grotesque', 'Inter', sans-serif;
    font-size: 1.6vh; font-weight: 700; color: #fff;
}
#jul-keybinds .kbl-rows { list-style: none; margin: 0; padding: 0.5vh 1.6vh 1vh; }
/* Lignes : separateur a la COULEUR DU MENU. */
#jul-keybinds .kbl-bind {
    display: flex; align-items: center; gap: 0.9vh; height: 3vh;
    font-size: 1.25vh; color: #eaeaea; white-space: nowrap;
    border-bottom: 1px solid #000;
}
#jul-keybinds .kbl-bind:last-child { border-bottom: none; }
#jul-keybinds .kbl-act { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#jul-keybinds .kbl-status { flex: none; font-size: 1vh; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
#jul-keybinds .kbl-bind[data-state="on"]  .kbl-status { color: rgb(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b)); }
#jul-keybinds .kbl-bind[data-state="off"] .kbl-status { color: #ff5a5a; }
#jul-keybinds .kbl-bind[data-state="none"] .kbl-status { visibility: hidden; }
/* Touche en keycap clair, bordée a la couleur du menu. */
#jul-keybinds .kbl-key {
    flex: none; max-width: 12vh; overflow: hidden; text-overflow: ellipsis;
    padding: 0.15vh 0.8vh; border-radius: 999px;
    background: #f1f6ea;
    border: 1px solid rgb(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b));
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 1.25vh; font-weight: 400; color: #1b261c;
}

/* ==================== ECRAN DE CHARGEMENT ========================== */
#jul-loading {
    display: none; position: fixed; inset: 0; z-index: 999998;
    place-items: center; pointer-events: none;
}
#jul-loading.on { display: grid; }
#jul-loading .jl-panel {
    box-sizing: border-box; width: 460px; max-width: calc(100vw - 32px);
    overflow: hidden; background: rgba(30,30,30,0.96); border-radius: 0.6vh;
    box-shadow: 0 1vh 3vh rgba(0,0,0,0.55); color: #fff;
    zoom: var(--jul-scale, 1);
}
#jul-loading .jl-head {
    display: flex; align-items: baseline; gap: 0.6vh;
    padding: 1.2vh 1.8vh 1vh; border-bottom: 0.3vh solid var(--jul-acc);
}
#jul-loading .jl-brand-a { font-size: 1.7vh; font-weight: 700; letter-spacing: 0.05em; color: #ffea3c; }
#jul-loading .jl-brand-b { font-size: 1.7vh; font-weight: 400; color: rgba(255,255,255,0.7); }
#jul-loading .jl-content { display: flex; flex-direction: column; padding: 1.8vh 1.8vh 1.6vh; min-height: 0; }
#jul-loading .jl-welcome { margin: 0; font-size: 2.2vh; font-weight: 500; line-height: 1.2; }
#jul-loading .jl-status-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 0.8vh; font-size: 1.3vh; color: rgba(255,255,255,0.65);
}
#jul-loading .jl-percent { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
#jul-loading .jl-bar { position: relative; height: 3.4vh; margin-top: auto; }
#jul-loading .jl-track {
    position: absolute; left: 0; right: 0.6vh; top: 50%;
    height: 0.35vh; margin-top: -0.175vh;
    background: rgba(255,255,255,0.12); border-radius: 0.2vh;
}
#jul-loading .jl-fill {
    height: 100%; width: calc(var(--p, 0) * 100%);
    background: var(--jul-acc); border-radius: 0.2vh; transition: width 0.4s ease;
}
#jul-loading .jl-marker {
    position: absolute; top: 50%; left: calc(var(--p, 0) * 100%);
    width: 1.4vh; height: 1.4vh; margin: -0.7vh 0 0 -0.7vh; border-radius: 50%;
    background: var(--jul-acc); box-shadow: 0 0 0 0.25vh rgba(0,0,0,0.3);
    transition: left 0.4s ease;
}

/* ======================= MODE DESIGN =============================== */
[data-design="on"] #menu-banner { cursor: move; outline: 0.15vh dashed rgba(255,255,255,0.55); outline-offset: -0.15vh; }
[data-design="on"] .kbl-head { cursor: move; outline: 0.15vh dashed var(--jul-acc); outline-offset: -0.15vh; }
[data-design="on"] #jul-keybinds { pointer-events: auto; }
</style>
<script>
(function () {
    'use strict';

    /* =================================================================
       PONT : on enregistre UN SEUL listener "message" reel, puis on
       diffuse vers les handlers captures (bundle Nexus) uniquement ce
       qu'ils doivent voir.
       ================================================================= */
    var bridge = window.__julBridge ||
        (window.__julBridge = { handlers: [], orig: window.addEventListener.bind(window) });

    var DEFAULT_BANNER = 'https://raw.githubusercontent.com/rmdddd/menu_interface/refs/heads/main/icons/jul_menu_v2.png';

    var S = {
        scale: 0.8,
        x: '20.25vh', y: '19.5vh',
        userX: null, userY: null,
        tabs: ['Main'], tab: 0, showSingle: true,
        menu: [], sig: null,
        design: false,
        inputValue: '',
        demoStopped: false
    };

    /* ---------------- utilitaires ---------------- */
    function $(id) { return document.getElementById(id); }
    function arr(v) { return Array.isArray(v) ? v : []; }
    function list(v) { return arr(v).filter(function (o) { return o && typeof o === 'object'; }); }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function num(v, d) { var n = parseFloat(v); return isFinite(n) ? n : d; }
    function int(v, d) { var n = parseInt(v, 10); return isFinite(n) ? n : d; }

    function typeList(t) {
        if (Array.isArray(t)) return t.filter(function (x) { return typeof x === 'string'; });

    }
    function hexOf(r, g, b) {
        function h(n) { var s = clamp(Math.round(n), 0, 255).toString(16); return s.length === 1 ? '0' + s : s; }
        return '#' + h(r) + h(g) + h(b);

    function ch(v) { var n = Math.round(Number(v)); return isFinite(n) ? clamp(n, 0, 255) : 150; }

            if (window.NexusDemo && typeof window.NexusDemo.stop === 'function') window.NexusDemo.stop();
        } catch (e) {}
    }

    /* ---------------- position du menu ---------------- */
    function applyPos() {
        var r = $('menu-root');
        if (!r) return;
        r.style.left = S.x;
        r.style.top = S.y;
        positionCard();
    }

    function setMenuPos(d) {
        var x = (d.x !== undefined) ? cssLen(d.x, null) : null;
        var y = (d.y !== undefined) ? cssLen(d.y, null) : null;
        var xv = (d.x !== undefined) ? num(d.x, 0) : 0;
        var off = (d.x !== undefined && xv <= -100);
        if (d.force) {
            if (x !== null) S.x = x;
            if (y !== null) S.y = y;
            S.userX = null; S.userY = null;
        } else if (off) {
            if (x !== null) S.x = x;
            if (y !== null) S.y = y;
        } else if (S.userX === null || S.userY === null) {
            if (x !== null) S.x = x;
            if (y !== null) S.y = y;
        } else {
            S.x = S.userX; S.y = S.userY;
        }
        applyPos();
    }

    /* ---------------- echelle ---------------- */
    function applyZoom() {
        var aside = document.querySelector('#app aside');
        if (aside && aside.dataset.julZoom !== String(S.scale)) {
            aside.style.zoom = String(S.scale);
            aside.dataset.julZoom = String(S.scale);
        }
        var kb = $('jul-keybinds');
        if (kb) kb.style.zoom = String(S.scale);
        var ld = document.querySelector('#jul-loading .jl-panel');
        if (ld) ld.style.zoom = String(S.scale);
    }

    function setScale(v) {
        var s = Number(v);
        S.scale = (isFinite(s) && s > 0) ? s : 1;
        document.documentElement.style.setProperty('--jul-scale', String(S.scale));
        applyZoom();
        positionCard();
    }

    /* ---------------- fiche joueur ---------------- */
    function positionCard() {
        var aside = document.querySelector('#app aside');
        if (!aside) return;
        applyZoom();
        var z = S.scale > 0 ? S.scale : 1;
        var root = $('menu-root');
        var br = (root && root.isConnected) ? root.getBoundingClientRect() : null;
        var cr = aside.getBoundingClientRect();
        var w = cr.width || aside.offsetWidth || 0;
        var h = cr.height || aside.offsetHeight || 0;
        var x, y;
        if (br && br.width) {
            x = br.right + 6;
            y = br.top + window.innerHeight * 0.065;
        } else {
            x = window.innerWidth - w - 8;
            y = Math.max(8, (window.innerHeight - h) / 2);
        }
        if (x + w > window.innerWidth - 8) x = Math.max(8, window.innerWidth - w - 8);
        if (y < 8) y = 8;
        if (y + h > window.innerHeight - 8) y = Math.max(8, window.innerHeight - h - 8);
        aside.style.left = Math.round(x / z) + 'px';
        aside.style.right = 'auto';
        aside.style.top = Math.round(y / z) + 'px';
    }

    function displayPlayerCard(d) {
        if (d && d.visible && d.data) {
            var p = d.data || {};
            var inVeh = !!(p.veh && String(p.veh).toLowerCase() !== 'on foot');
            var hp = (typeof p.hpN === 'number') ? p.hpN : 200;
            forward({
                action: 'setSelectedPlayer',
                playerData: {
                    id: p.sid,
                    name: p.name,
                    job: 'Unknown',
                    group: 'Unknown',
                    distance: p.dist,
                    speed: p.spd,
                    health: clamp(Math.round(hp - 100), 0, 100),
                    armor: (typeof p.apN === 'number') ? clamp(Math.round(p.apN), 0, 100) : 0,
                    weapon: p.wep,
                    vehicleName: p.veh || 'on foot',
                    isInVehicle: inVeh,
                    isInInterior: false,
                    isAlive: hp > 100,
                    phone: p.num || null
                }
            });
        } else {
            forward({ action: 'clearSelectedPlayer' });
        }
        requestAnimationFrame(positionCard);
        if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
            document.fonts.ready.then(positionCard, function () {});
        }
    }

    /* ---------------- onglets ---------------- */
    function renderTabs() {
        var el = $('menu-tabs');
        if (!el) return;
        clearEl(el);
        var root = $('menu-root');
        if (root) {
            if (S.tabs.length <= 1 && !S.showSingle) root.classList.add('jul-single');
            else root.classList.remove('jul-single');
        }
        for (var i = 0; i < S.tabs.length; i++) {
            var t = document.createElement('div');
            t.className = 'tab-item' + (i === S.tab ? ' active' : '');
            t.textContent = String(S.tabs[i] == null ? '' : S.tabs[i]);
            el.appendChild(t);
        }
        window.currentTabIndex = S.tab;
    }

    /* ---------------- liste des options ---------------- */
    function sigOf(o) {
        return typeList(o.type).join(',') + '|' + (o.icon ? 'i' : '') + '|' +
            (o.options ? arr(o.options).length : '') + '|' + (o.label == null ? '' : o.label);
    }

    var VEH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.2-4.4A2 2 0 0 1 8.1 7.2h7.8a2 2 0 0 1 1.9 1.4L19 13"/><rect x="4" y="13" width="16" height="5.2" rx="1.6"/><path d="M7.5 18.2v1.3M16.5 18.2v1.3"/></svg>';

    function decorate() {
        var box = $('items-list');
        if (!box) return;
        var rows = box.querySelectorAll('.menu-item');
        var menu = S.menu;
        for (var i = 0; i < rows.length; i++) {
            var row = rows[i], o = menu[i];
            if (!o) continue;
            var ts = typeList(o.type);

            /* marqueur : > pour un sous-menu, + pour une action */
            var kind = 'none';
            if (ts.indexOf('submenu') >= 0) kind = 'sub';
            else if (ts.indexOf('action') >= 0 || ts.indexOf('button') >= 0) kind = 'add';
            if (row.dataset.julMark !== kind) {
                var old = row.querySelector('.jul-mark');
                if (old && old.parentNode) old.parentNode.removeChild(old);
                row.dataset.julMark = kind;
                if (kind !== 'none') {
                    var comps = row.querySelector('.components-container');
                    if (!comps) {
                        comps = document.createElement('div');
                        comps.className = 'components-container';
                        row.appendChild(comps);
                    }
                    var sp = document.createElement('span');
                    sp.className = 'component jul-mark';
                    sp.textContent = kind === 'sub' ? '>' : '+';
                    comps.insertBefore(sp, comps.firstChild);
                }
            }

            /* icone vehicule (champ inVeh du Lua) */
            var cc = row.querySelector('.components-container');
            var vi = cc ? cc.querySelector('.veh-icon') : null;
            if (o.inVeh) {
                if (!vi && cc) {
                    vi = document.createElement('span');
                    vi.className = 'veh-icon';
                    vi.setAttribute('aria-hidden', 'true');
                    vi.innerHTML = VEH_SVG;
                    cc.insertBefore(vi, cc.firstChild);
                }
                if (vi) vi.style.display = '';
            } else if (vi) {
                vi.style.display = 'none';
            }

            /* ligne inactive (visible=false / hidden / disabled) */
            if (o.disabled === true || o.visible === false || o.hidden === true) row.classList.add('is-off');
            else row.classList.remove('is-off');
        }
    }

    /* La barre de defilement doit couvrir exactement la liste : de la
       premiere option a la derniere. Son top en CSS (vh) drifte de
       quelques pixels selon la hauteur de la fenetre, car la hauteur du
       bandeau d'onglets contient une part en px (ligne de texte) qui ne
       suit pas les vh. On la recalcule donc en px reels a chaque rebuild,
       depuis #menu-items. */
    function syncScrollbar() {
        var bar = $('menu-scrollbar'), items = $('menu-items'), root = $('menu-root');
        if (!bar || !items || !root) return;
        var rr = root.getBoundingClientRect();
        if (!rr.width || !root.offsetWidth) return;
        /* #menu-root porte transform: scale(...) : les rect sont ecran,
           il faut revenir au px CSS avant d'ecrire dans le style. */
        var sc = rr.width / root.offsetWidth;
        if (!isFinite(sc) || sc <= 0) sc = 1;
        var ir = items.getBoundingClientRect();
        var top = (ir.top - rr.top) / sc, h = ir.height / sc;
        /* Pas d'ecriture si rien ne bouge : setCurrent arrive toutes les
           400 ms et une ecriture force un recalcul de mise en page. */
        if (Math.abs(parseFloat(bar.style.top || -1e9) - top) < 0.05 &&
            Math.abs(parseFloat(bar.style.height || -1e9) - h) < 0.05) return;
        bar.style.top = top + 'px';
        bar.style.height = h + 'px';
    }
    /* Le bundle reconstruit la liste de maniere asynchrone : au moment du
       premier sync les options ne sont pas encore posees (ecart de ~3 px).
       On resynchronise sur les deux frames suivantes, ce qui suffit a
       tomber a 0.16 px pres. */
    function resyncScrollbar() {
        syncScrollbar();
        if (window.requestAnimationFrame) {
            requestAnimationFrame(function () {
                syncScrollbar();
                requestAnimationFrame(function () { syncScrollbar(); });
            });
        }
        /* #menu-container anime translateY(-0.45vh) -> translateY(0) sur
           0.3 s : pendant la transition les rect sont decales de 0.45vh
           (2.9 px a 641 px de haut), ce qui donne une barre trop haute.
           On resynchronise une fois la transition finie. */
        setTimeout(syncScrollbar, 360);
    }

    function setCurrent(d) {
        var menu = list(d.menu);
        S.menu = menu;
        var cur = int(d.current, 1) - 1;
        if (cur < 0) cur = 0;
        var sig = menu.map(sigOf).join('\u0001');
        if (sig !== S.sig) {
            /* la meme longueur avec un contenu different ne re-render pas
               chez Nexus : on vide la liste pour forcer la reconstruction */
            var box = $('items-list');
            if (box) clearEl(box);
            S.sig = sig;
        }
        forward({ action: 'setCurrent', current: cur + 1, menu: menu });
        decorate();
        resyncScrollbar();
        var root = $('menu-root');
        if (root && !root.classList.contains('visible') && window.showMenu) window.showMenu();
    }

    /* ---------------- pied de page ---------------- */
    function setFooterLogo(d) {
        var fl = $('footer-left');
        if (!fl || !d.url) return;
        clearEl(fl);
        var im = document.createElement('img');
        im.alt = '';
        im.src = String(d.url);
        im.onerror = function () { if (im.parentNode) im.parentNode.removeChild(im); };
        fl.appendChild(im);
    }

    function setFooterUser() {
        /* Bas-gauche : toujours "JuL MENU" (demande). Le Lua envoie
           setFooterUser(name = "") a chaque ouverture d'onglet : on
           ecrase avec le texte fixe au lieu de purger la zone. */
        var fl = $('footer-left');
        if (!fl) return;
        clearEl(fl);
        fl.appendChild(document.createTextNode('JuL MENU'));
    }

    /* ---------------- panneau Keybinds ---------------- */
    function ensureKeybinds() {
        var el = $('jul-keybinds');
        if (el) return el;
        el = document.createElement('section');
        el.id = 'jul-keybinds';
        el.hidden = true;
        el.style.zoom = String(S.scale);
        var head = document.createElement('header');
        head.className = 'kbl-head';
        var h1 = document.createElement('h1');
        h1.className = 'kbl-title';
        h1.textContent = 'Keybinds';
        head.appendChild(h1);
        var ul = document.createElement('ul');
        ul.className = 'kbl-rows';
        el.appendChild(head);
