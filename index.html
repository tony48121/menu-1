            case 'resetTabs': {

            case 'displayCrosshair': {

            case 'showLoading': {

            case 'showInputPrompt': {

            }
            case 'hideInputPrompt': {

(function () {
  var $ = function (id) { return document.getElementById(id); };

  // structure

    foot.insertBefore(av, left);
    var pill = document.createElement('span'); pill.id = 'footer-pill'; pill.textContent = 'Nexus V1.0';
    foot.insertBefore(pill, right);

  var lastMenu = [];
  function decorate(menu) {
    var rows = list.querySelectorAll(':scope > .menu-item');
    rows.forEach(function (row, i) {
      var raw = (menu && menu[i]) || {};
      var holder = row.querySelector('.component.icon');

  function range(name, min, max, step, v, extra) { return Object.assign({ name: name, type: 'slider', min: min, max: max, step: step, value: v }, extra || {}); }
  function scroll(name, opts, i, extra) { return Object.assign({ name: name, type: 'scroll', options: opts, selected: i || 0 }, extra || {}); }
  function btn(name, extra) { return Object.assign({ name: name, type: 'button' }, extra || {}); }
  function sep(name) { return { name: name, type: 'divider' }; }
  function sub(name, key, icon, extra) { return Object.assign({ name: name, type: 'submenu', submenu: key, icon: icon }, extra || {}); }

  var visualHud = [
    sep('HUD'),
    check('Crosshair', false, { fx: 'crosshair' }),
    check('Keybind List', false, { fx: 'keybinds' }),
    check('Spectator List', false, { fx: 'spectators' }),
    check('Hovering Text', false, { fx: 'hovering' }),
    check('Help Message', true, { fx: 'help' })
  ];
  var visualTheme = [sep('Theme'), scroll('Menu Color', COLORS.map(function (c) { return c[0]; }), 0, { fx: 'color' })];

  var menus = {
    root: {
      title: 'Menu',
      tabs: [{
        label: 'Menu', items: [
          sub('Self', 'self', ICONS.self),
          sub('Players', 'players', ICONS.players),
          sub('Vehicle', 'vehicle', ICONS.vehicle),
          sub('Weapons', 'weapons', ICONS.weapons),
          sub('World', 'world', ICONS.world),

            scroll('Class', ['Super', 'Sports', 'Muscle', 'Off-road', 'Compact'], 0),

          check('Mask', false),
          check('Hat', false),
          btn('Back', { back: true })
        ]
      }]
    }
  };

  /* ---------- état de navigation ---------- */
  var stack = [{ menu: menus.root, tab: 0, sel: {} }];
  function cur() { return stack[stack.length - 1]; }
  function curTab() { return cur().menu.tabs[cur().tab]; }
  function curItems() { return curTab().items; }
  function selIndex() { return cur().sel[cur().tab] || 0; }
  function setSel(i) { cur().sel[cur().tab] = i; }
  function isSep(it) { return it.type === 'divider'; }
  function firstValid() { var it = curItems(); for (var i = 0; i < it.length; i++) if (!isSep(it[i])) return i; return 0; }

  function toMsgItem(it) {
    var o = { name: it.name };
    if (it.icon) o.icon = it.icon;
    if (it.type === 'divider') o.type = 'divider';
    if (it.type === 'submenu') { o.type = 'submenu'; o.submenu = it.submenu; }
    if (it.type === 'checkbox') { o.type = 'checkbox'; o.checked = it.checked; }
    if (it.type === 'slider') { o.type = 'slider'; o.min = it.min; o.max = it.max; o.step = it.step; o.value = it.value; }
    if (it.type === 'scroll') { o.type = 'scroll'; o.options = it.options; o.selected = it.selected; }
    return o;
  }

  /* ---------- rendu (= ce que ferait le Lua) ---------- */
  function renderAll(opts) {
    opts = opts || {};
    var c = cur();
    send({ action: 'setTabs', tabs: c.menu.tabs.map(function (t) { return t.label; }) });
    send({ action: 'setTabIndex', index: c.tab });
    if (c.sel[c.tab] == null) setSel(firstValid());
    send({ action: 'setCurrent', menu: curItems().map(toMsgItem), current: selIndex() + 1 });
    send({ action: 'updateBreadcrumb', breadcrumb: 'Player' });
    if (opts.show !== false) send({ action: 'setVisible', visible: true });
    pushSelection();
  }

  function pushSelection() {
    send({ action: 'updateSelection', index: selIndex() });
    var it = curItems()[selIndex()];
    // l'UI met à jour le tooltip « en place » si le nombre de lignes est identique :
    // on le vide pour forcer la reconstruction quand on change d'élément
    var tt = $('tooltip-container'); if (tt) tt.innerHTML = '';
    send({ action: 'updateTooltip', items: it && it.tip ? it.tip(it) : [] });
  }

  /* ---------- actions ---------- */
  function notify(type, header, message, duration) {
    send({ action: 'notify', type: type, header: header, message: message, duration: duration || 4000 });
  }

  function move(dir) {
    var items = curItems(), n = items.length, i = selIndex();
    for (var k = 0; k < n; k++) {
      i = (i + dir + n) % n;
      if (!isSep(items[i])) break;
    }
    setSel(i);
    pushSelection();
  }

  function changeTab(dir) {
    var c = cur(), n = c.menu.tabs.length;
    if (n < 2) return;
    c.tab = (c.tab + dir + n) % n;
    renderAll({ show: false });
  }

  function applyFx(it) {
    switch (it.fx) {
      case 'crosshair': send({ action: it.checked ? 'showCrosshair' : 'hideCrosshair' }); break;
      case 'keybinds':
        send({
          action: 'updateKeybindList', keybinds: [
            { name: 'Invincible', controlName: 'F5', enabled: true },
            { name: 'Noclip', controlName: 'F6', enabled: true },
            { name: 'Engine On', controlName: 'G', enabled: false },
            { name: 'Heal', controlName: 'H', enabled: true }
          ]
        });
        send({ action: 'toggleKeybindList', visible: it.checked }); break;
      case 'spectators':
        send({ action: 'updateSpectatorList', spectators: [{ name: 'Alex', id: 12 }, { name: 'Sam', id: 7 }, { name: 'Jordan', id: 31 }] });
        send({ action: 'toggleSpectatorList', visible: it.checked }); break;
      case 'hovering':
        send({
          action: 'setHoveringTextOptions', options: [
            { id: 1, name: 'Open Door', data: '' }, { id: 2, name: 'Search', data: '' },
            { id: 3, name: 'Talk', data: '' }, { id: 4, name: 'Inspect', data: '' }]
        });
        send({ action: it.checked ? 'showHoveringText' : 'hideHoveringText' }); break;
      case 'help':
        send({ action: 'updateHelpMessage', message: it.checked ? helpText() : null }); break;
      case 'color':
        send({ action: 'updateMenuColors', mainColor: COLORS[it.selected][1] }); break;
    }
  }

  function helpText() { return '↑ ↓ Navigate   ← → Adjust   Enter Select   Q / E Tabs   Backspace Back'; }

  function onValueChanged(it, idx) {
    if (it.type === 'checkbox') send({ action: 'updateCheckbox', index: idx, checked: it.checked });
    if (it.type === 'slider') send({ action: 'updateRange', index: idx, value: it.value });
    if (it.type === 'scroll') send({ action: 'updateSlider', index: idx, value: it.selected + 1 });
    if (it.fx) applyFx(it);
    if (it.notify && it.type === 'checkbox' && it.checked) notify.apply(null, it.notify);
    if (curItems()[selIndex()] === it) send({ action: 'updateTooltip', items: it.tip ? it.tip(it) : [] });
  }

  function adjust(dir) {
    var idx = selIndex(), it = curItems()[idx];
    if (!it) return;
    if (it.type === 'checkbox') { it.checked = !it.checked; }
    else if (it.type === 'slider') { it.value = Math.max(it.min, Math.min(it.max, it.value + dir * it.step)); }
    else if (it.type === 'scroll') { it.selected = (it.selected + dir + it.options.length) % it.options.length; }
    else return;
    onValueChanged(it, idx);
  }

  var inputActive = false, inputCb = null;
  function openInput(it) {
    inputActive = true;
    send({ action: 'openTextInput', question: it.input.title, placeholder: it.input.placeholder, value: '' });
    inputCb = it.onInput;
  }
  function closeInput(submit) {
    var field = document.querySelector('.input-box input');
    var v = field ? field.value : '';
    send({ action: 'closeTextInput' });
    inputActive = false;
    var cb = inputCb; inputCb = null;
    if (submit && cb) cb(v);
  }

  function runProgress() {
    if (state.busy) return;
    state.busy = true;
    send({ action: 'showProgressBar' });
    var p = 0;
    var steps = ['Preparing…', 'Loading assets…', 'Applying changes…', 'Finishing…'];
    var t = setInterval(function () {
      p += 4 + Math.random() * 6;
      if (p >= 100) {
        p = 100; clearInterval(t);
        send({ action: 'updateProgress', percent: 100, topText: 'Done', bottomText: 'Completed' });
        setTimeout(function () { send({ action: 'hideProgressBar' }); state.busy = false; notify('success', 'Progress', 'Task completed.'); }, 600);
        return;
      }
      send({ action: 'updateProgress', percent: Math.round(p), topText: steps[Math.min(3, Math.floor(p / 26))], bottomText: 'Please wait…' });
    }, 120);
  }

  function runKeybindSetup() {
    send({ action: 'openKeybindSetup', featureName: 'Invincible' });
    inputActive = true; inputCb = null;
    function onKey(e) {
      e.preventDefault(); e.stopPropagation();
      var name = e.key.length === 1 ? e.key.toUpperCase() : e.key;
      send({ action: 'updateKeybindSetup', keyName: name });
      setTimeout(function () { send({ action: 'closeKeybindSetup' }); inputActive = false; notify('success', 'Keybind', 'Bound to ' + name + '.'); }, 500);
      window.removeEventListener('keydown', onKey, true);
    }
    window.addEventListener('keydown', onKey, true);
  }

  function activate() {
    var idx = selIndex(), it = curItems()[idx];
    if (!it || isSep(it)) return;
    if (it.type === 'checkbox' || it.type === 'slider' || it.type === 'scroll') { adjust(1); return; }
    if (it.back) { goBack(); return; }
    if (it.submenu) {
      stack.push({ menu: menus[it.submenu], tab: 0, sel: {} });
      renderAll({ show: false });
      return;
    }
    if (it.input) { openInput(it); return; }
    if (it.fx === 'progress') { runProgress(); return; }
    if (it.fx === 'keybindSetup') { runKeybindSetup(); return; }
    if (it.fx === 'tour') { startTour(); return; }
    if (it.notify) notify.apply(null, it.notify);
  }

  function goBack() {
    if (stack.length > 1) { stack.pop(); renderAll({ show: false }); }
    else closeMenu();
  }

  function openMenu() {
    state.open = true;
    renderAll();
    send({ action: 'updateHelpMessage', message: helpEnabled() ? helpText() : null });
  }
  function closeMenu() {
    state.open = false;
    send({ action: 'setVisible', visible: false });
    send({ action: 'updateTooltip', items: [] });
  }
  function helpEnabled() {
    for (var i = 0; i < visualHud.length; i++) if (visualHud[i].name === 'Help Message') return visualHud[i].checked;
    return true;
  }

  /* ---------- clavier ---------- */
  window.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) {
      if (inputActive && e.key === 'Enter') { e.preventDefault(); closeInput(true); }
      else if (inputActive && e.key === 'Escape') { e.preventDefault(); closeInput(false); }
      return;
    }
    if (inputActive) return;
    var k = e.key;
    if (k === 'F1' || k === 'm' || k === 'M') { e.preventDefault(); state.open ? closeMenu() : openMenu(); return; }
    if (k === 'h' || k === 'H') { togglePanel(); return; }
    if (k === 't' || k === 'T') { state.tour ? stopTour() : startTour(); return; }
    if (state.tour || !state.open) return;
    switch (k) {
      case 'ArrowUp': e.preventDefault(); move(-1); break;
      case 'ArrowDown': e.preventDefault(); move(1); break;
      case 'ArrowLeft': e.preventDefault(); adjust(-1); break;
      case 'ArrowRight': e.preventDefault(); adjust(1); break;
      case 'Enter': e.preventDefault(); activate(); break;
      case 'q': case 'Q': changeTab(-1); break;
      case 'e': case 'E': changeTab(1); break;
      case 'Tab': e.preventDefault(); changeTab(e.shiftKey ? -1 : 1); break;
      case 'Backspace': case 'Escape': e.preventDefault(); goBack(); break;
    }
  });

  /* ---------- souris (bonus) ---------- */
  document.addEventListener('wheel', function (e) {
    if (!state.open || state.tour || inputActive) return;
    if (e.target.closest && e.target.closest('#nx-demo-panel')) return;
    move(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('click', function (e) {
    if (!state.open || state.tour || inputActive) return;
    var tab = e.target.closest && e.target.closest('.tab-item');
    if (tab) {
      var n = parseInt(tab.dataset.index, 10);
      if (!isNaN(n) && n !== cur().tab && cur().menu.tabs.length > 1) { cur().tab = n; renderAll({ show: false }); }
      return;
    }
    var row = e.target.closest && e.target.closest('.menu-item');
    if (row && !row.classList.contains('separator')) {
      var i = parseInt(row.dataset.index, 10);
      if (isNaN(i)) return;
      if (i !== selIndex()) { setSel(i); pushSelection(); }
      var it = curItems()[i];
      var onComponent = e.target.closest('.component');
      if (!onComponent || it.type === 'checkbox') activate();
    }
  });

  /* ---------- panneau d'aide ---------- */
  var panel = document.createElement('div');
  panel.id = 'nx-demo-panel';
  panel.innerHTML = [
    '<h4>Demo controls <span>H</span></h4>',
    '<div class="row"><span>Navigate</span><kbd>↑ ↓</kbd></div>',
    '<div class="row"><span>Adjust value</span><kbd>← →</kbd></div>',
    '<div class="row"><span>Select</span><kbd>Enter</kbd></div>',
    '<div class="row"><span>Switch tab</span><kbd>Q / E</kbd></div>',
    '<div class="row"><span>Back / close</span><kbd>Backspace</kbd></div>',
    '<div class="row"><span>Open / close menu</span><kbd>F1 / M</kbd></div>',
    '<div class="row"><span>Guided tour</span><kbd>T</kbd></div>',
    '<div class="btns">',
    '<button data-a="menu">Toggle menu</button>',
    '<button data-a="tour">Guided tour</button>',
    '<button data-a="notif">Notification</button>',
    '<button data-a="progress">Progress</button>',
    '</div>'
  ].join('');
  document.body.appendChild(panel);
  function togglePanel() { panel.classList.toggle('off'); }
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var a = b.dataset.a;
    if (a === 'menu') state.open ? closeMenu() : openMenu();
    if (a === 'tour') state.tour ? stopTour() : startTour();
    if (a === 'notif') { var t = ['success', 'info', 'warning', 'error']; notify(t[Math.floor(Math.random() * 4)], 'Nexus Menu', 'Demo notification.'); }
    if (a === 'progress') runProgress();
    b.blur();
  });

  /* ---------- visite guidée ---------- */
  var tourToken = 0;
  async function moveTo(name, alive) {
    for (var k = 0; k < 30 && alive(); k++) {
      var it = curItems()[selIndex()];
      if (it && it.name === name) return;
      move(1); await wait(140);
    }
  }
  async function startTour() {
    if (state.tour) return;
    state.tour = true;
    var my = ++tourToken;
    var alive = function () { return state.tour && my === tourToken; };
    stack = [{ menu: menus.root, tab: 0, sel: {} }];
    openMenu();
    try {
      notify('info', 'Guided tour', 'Press T to stop at any time.', 3500);
      await wait(1500); if (!alive()) return;
      var i;

      // Self > Status
      await moveTo('Self', alive); await wait(500); activate(); await wait(1000); if (!alive()) return;
      await moveTo('Invincible', alive); await wait(300); adjust(1); await wait(800);
      await moveTo('Health', alive); await wait(300);
      for (i = 0; i < 4 && alive(); i++) { adjust(-1); await wait(170); }
      for (i = 0; i < 2 && alive(); i++) { adjust(1); await wait(170); }
      await wait(500);
      await moveTo('Run Speed', alive); await wait(300);
      for (i = 0; i < 3 && alive(); i++) { adjust(1); await wait(380); }
      await moveTo('Heal', alive); await wait(300); activate(); await wait(1400); if (!alive()) return;

      // Self > Appearance > Outfit Editor
      changeTab(1); await wait(1000);
      await moveTo('Outfit Editor', alive); await wait(500); activate(); await wait(1200); if (!alive()) return;
      await moveTo('Top', alive); adjust(1); await wait(500);
      await moveTo('Pants', alive); adjust(1); await wait(500);
      goBack(); await wait(700); goBack(); await wait(900); if (!alive()) return;

      // Players (onglets)
      await moveTo('Players', alive); await wait(400); activate(); await wait(1000);
      await moveTo('Show Distance', alive); adjust(1); await wait(600);
      changeTab(1); await wait(1000); changeTab(-1); await wait(700);
      goBack(); await wait(800); if (!alive()) return;

      // Visual > HUD + Theme
      await moveTo('Visual', alive); await wait(400); activate(); await wait(900);
      var names = ['Crosshair', 'Keybind List', 'Spectator List', 'Hovering Text'];
      for (i = 0; i < names.length && alive(); i++) { await moveTo(names[i], alive); await wait(250); adjust(1); await wait(800); }
      changeTab(1); await wait(900);
      await moveTo('Menu Color', alive);
      for (i = 0; i < 3 && alive(); i++) { adjust(1); await wait(700); }
      if (!alive()) return;
      resetFx(true); await wait(500);
      goBack(); await wait(700);

      // Settings > Notifications + Misc
      await moveTo('Settings', alive); await wait(400); activate(); await wait(900);
      await moveTo('Notify: Success', alive);
      for (i = 0; i < 4 && alive(); i++) { activate(); await wait(650); move(1); await wait(200); }
      await wait(1200); if (!alive()) return;
      changeTab(1); await wait(900);
      await moveTo('Progress Bar', alive); await wait(400); activate(); await wait(4300); if (!alive()) return;

      resetFx();
      notify('success', 'Tour finished', 'Use the arrow keys to explore on your own.', 4500);
      await wait(800);
    } finally {
      if (my === tourToken) state.tour = false;
    }
  }
  function stopTour() { state.tour = false; tourToken++; resetFx(); }

  function resetFx(keepNav) {
    visualHud.forEach(function (it) {
      if (it.type === 'checkbox' && it.fx && it.fx !== 'help' && it.checked) { it.checked = false; applyFx(it); }
    });
    visualTheme.forEach(function (it) { if (it.fx === 'color') { it.selected = 0; applyFx(it); } });
    send({ action: 'hideProgressBar' }); state.busy = false;
    if (keepNav) {
      if (state.open) renderAll({ show: false });
      return;
    }
    stack = [{ menu: menus.root, tab: 0, sel: {} }];
    if (state.open) renderAll({ show: false });
  }

  /* ---------- API manuelle (console) ---------- */
  window.NexusDemo = {
    open: openMenu, close: closeMenu, tour: startTour, stop: stopTour,
    notify: notify, send: send, progress: runProgress
  };

  /* ---------- démarrage ---------- */
  function boot() {
    send({ action: 'updateMenuColors', mainColor: '#ffffff', backColor: '#0c0c0e' });
    send({ action: 'banner', bannerLink: BANNER });
    openMenu();
    setTimeout(function () { notify('info', 'Nexus Menu', 'Demo mode active. Press H for the controls.', 5000); }, 700);
  }
  if (document.readyState === 'complete') setTimeout(boot, 250);
  else window.addEventListener('load', function () { setTimeout(boot, 250); });
})();

     SendNUIMessage({ action = 'show' })
     SendNUIMessage({ action = 'hide' })
     SendNUIMessage({ action = 'update', data = {
       name = 'DRILL', serverId = 1227, radio = 12, distance = 391.7,

     }})
   Échap envoie le callback NUI « close ».
   Hors jeu (navigateur) : le panneau s'affiche avec des données de démo.

const ICONS = {
  user:   '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  id:     '<rect x="2" y="5" width="20" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.6-1.5 1.7-2 3-2s2.4.5 3 2M14 10h5M14 14h4"/>',
  radio:  '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  nav:    '<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
  heart:  '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  check:  '<circle cx="12" cy="12" r="10"/><path d="m8.5 12.3 2.4 2.4 4.6-4.9"/>',
  mars:   '<circle cx="10" cy="14" r="5"/><path d="m14 10 6-6M15 4h5v5"/>',
  venus:  '<circle cx="12" cy="9" r="5"/><path d="M12 14v8M9 19h6"/>',
  home:   '<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  pin:    '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',

};

/* [clé, libellé, icône, type d'affichage] */
const SECTIONS = [
  { title: 'Player', rows: [
    ['name',     'Name',      'user'],
    ['serverId', 'Server ID', 'id'],
    ['radio',    'Radio',     'radio'],
    ['distance', 'Distance',  'nav']
  ]},
  { title: 'Status', rows: [

    ['gender',   'Gender',    'mars'],
    ['interior', 'Interior',  'home'],
    ['location', 'Location',  'pin']
  ]},
  { title: 'Vehicle', rows: [
    ['vehicle',  'Vehicle',   'car']
  ]}
];

const FORMAT = {
  distance: v => (v === null || v === undefined || v === '') ? '—' : Number(v).toFixed(1) + ' m',

};

const DEMO = {
  name: 'DRILL', serverId: 1227, radio: 12, distance: 391.7,

};

const IN_GAME = typeof GetParentResourceName === 'function';
const state = {};
const refs = {};
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

/* ── Construction du DOM ── */
document.getElementById('card').innerHTML = SECTIONS.map(s => `

    fill: li.querySelector('.bar i'),
    dot: li.querySelector('.dot')
  };
});

function paint() {
  for (const k in refs) {
    const r = refs[k];
    const raw = state[k];
    const text = FORMAT[k] ? FORMAT[k](raw) : (raw === null || raw === undefined || raw === '' ? '—' : String(raw));
    if (r.txt.textContent !== text) {
      r.txt.textContent = text;
      r.txt.classList.remove('flash');
      void r.txt.offsetWidth;
      r.txt.classList.add('flash');
    }
  }
  if (refs.health.fill) {
    const p = clamp(((Number(state.health) || 100) - 100) / 100, 0, 1);

    refs.health.bar.classList.toggle('low', p < 0.3);

}

function setVisible(on) {
  document.getElementById('wrap').classList.toggle('show', on);
}

function post(name, data) {
  if (!IN_GAME) return;
  fetch('https://' + GetParentResourceName() + '/' + name, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
    body: JSON.stringify(data || {})
  }).catch(() => {});
}

window.addEventListener('message', ({ data }) => {
  if (!data) return;
  if (data.action === 'show') setVisible(true);
  else if (data.action === 'hide') setVisible(false);
  else if (data.action === 'update') update(data.data || {});
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') post('close');
});

/* Aucune sélection, glisser ou menu contextuel possible */
['contextmenu', 'selectstart', 'dragstart', 'mousedown'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault())
);

/* ── Démo hors jeu ── */
if (IN_GAME) {
  document.body.classList.add('ingame');
} else {
  document.body.classList.add('preview');
  update(DEMO);
  setVisible(true);
  setInterval(() => {
    state.distance = Math.max(0, Number(state.distance) + (Math.random() * 6 - 3));
    paint();
  }, 1200);
}

<script>
(function(){
  function dispatch(data){ window.dispatchEvent(new MessageEvent('message', { data: data })); }
  window.addEventListener('message', function(e){
    var h = e.data || {};
    if (!h || !h.action) return;
    if (h.action === 'setSelectedPlayer') {
      var p = h.playerData || {};
      var d = {
        name: p.name || 'Unknown',
        serverId: p.id != null ? p.id : '',
        radio: p.phone || '',
        distance: p.distance || '',
        health: p.health != null ? p.health : 0,
        armour: p.armor != null ? p.armor : 0,
        status: p.isAlive === false ? 'Dead' : 'Alive',
        gender: '',
        interior: p.isInVehicle ? 'In Vehicle' : 'Outside',
        location: p.job || '',
        vehicle: p.isInVehicle ? (p.vehicleName || 'In Vehicle') : 'On foot'
      };
      dispatch({ action: 'show' });
      dispatch({ action: 'update', data: d });
    } else if (h.action === 'updateSelectedPlayerInfo') {
      // best-effort update
      dispatch({ action: 'update', data: { health: h.health, armour: h.armor } });
    } else if (h.action === 'clearSelectedPlayer') {
      dispatch({ action: 'hide' });
    }
  });
})();
