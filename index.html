    <!--
    ==================================================================
      VANTA UI - Page NUI FiveM (fichier unique, aucune dependance locale)
    ==================================================================
      Cette page ne contient QUE l'interface, pilotee par des messages
      envoyes depuis votre script client (Lua / JS) via SendNUIMessage.

      --- fxmanifest.lua --------------------------------------------------
        fx_version 'cerulean'
        game 'gta5'
        ui_page 'Vanta-ui/index.html'
        files { 'Vanta-ui/index.html' }
      ---------------------------------------------------------------------

      --- Cote Lua --------------------------------------------------------
        -- ouvrir
        SendNUIMessage({ action = 'showUI', visible = true,
                         elements = { ... }, index = 0,
                         path = { 'Home' }, username = 'Synclua' })
        -- fermer
        SendNUIMessage({ action = 'showUI', visible = false })

        RegisterNUICallback('close', function(_, cb) SetNuiFocus(false, false); cb({}) end)
      ---------------------------------------------------------------------

      --- Actions gerees par l'interface -----------------------------------
        showUI           { visible, elements, index, path, username }
        updateElements   { elements, index, categories, categoryIndex, path }
        keydown          { index }                        mise a jour de la selection
        updateBanner     { bannerLink, bannerColor }      bannerColor = "R, V, B"
        showNotification { type, title, desc, duration }  type : success | info | error
        displayBinds     { visible, binds }               binds = { { keyLabel, type, label, checked } }
        updateKeyboard   { visible, title, value }        panneau de saisie
        setVisible       { data = true|false }            masque/affiche tout le NUI
        demoMode         { enabled = true|false }         mode demo (navigateur par defaut)
      ---------------------------------------------------------------------
      Structure d'un element (elements / tabs) :
        { type: 'subMenu' | 'button' | 'checkbox' | 'slider' | 'slider-checkbox'
                | 'scrollable' | 'scrollable-checkbox' | 'divider',
          label: 'Texte', desc: 'Description', checked: true, value: 1,
          values: { 'Option 1', 'Option 2' }, min: 0, max: 100, step: 1,
          hazardous: true, metaData: { { key: 'Distance', value: '317.0m' } },
          categories: { { label: 'Categorie', tabs: { ... } } } }

      --- Navigation clavier (menu ouvert) --------------------------------
        HAUT / BAS    selection   ENTRER   ouvrir un sous-menu
        RETOUR        revenir     Q / E (ou GAUCHE / DROITE) changer de categorie
      ==================================================================
    -->

        var state = {
          visible: false,
          tabs: rootTabs,
          selectedIndex: 0,
          playerCard: null,
          menuStack: [],
          categories: null,
          categoryIndex: 0,
          path: ["Home"],
          banner: { link: "https://files.catbox.moe/vgyx34.png", color: "152, 45, 234" },
          userName: "Synclua",
          keybindsVisible: false,
          keybinds: [
            { keyLabel: "U", type: "checkbox", label: "Noclip", checked: true },
            { keyLabel: "H", type: "checkbox", label: "Freecam", checked: false },
            { keyLabel: "Z", type: "button", label: "Refill Health" },
            { keyLabel: "Z", type: "button", label: "Refill Armour" },
          ],
          keyboard: { visible: false, title: "Keyboard Input", value: "Value" },
        };

        var tabEls = [];

        /* ======================================================
           RENDER
           ====================================================== */
        function sliderPercent(tab) {
          return tab.max && tab.min !== undefined
            ? ((tab.value - tab.min) / (tab.max - tab.min)) * 100
            : tab.value;
        }

        function checkboxHTML(tab) {
          return '<div class="Checkbox ' + (tab.checked ? "Checked" : "") + '"><div class="Inside"></div></div>';
        }

        function sliderHTML(tab, transition) {
          return (
            '<div class="Slider"><div class="Progress" style="width:' +
            sliderPercent(tab) +
            "%" +
            (transition ? "; transition:0.5s width" : "") +
            '"><div class="Thumb"></div></div></div>'
          );
        }

        function scrollableHTML(tab) {
          return (
            '<div class="Scrollable"><span>-</span><span>' +
            esc(tab.values && tab.value ? tab.values[tab.value - 1] : "") +
            "</span><span>-</span></div>"
          );
        }

        function tabInner(tab, i) {
          var selected = i === state.selectedIndex;
          var html = "";

          if (tab.type !== "divider") {
            var label = tab.label;
            if (selected && (tab.type === "slider" || tab.type === "slider-checkbox")) {
              label = tab.label + ": " + tab.value;
            }
            html +=
              '<span class="VTLabel">' +
              esc(label) +
              (tab.hazardous ? '<span style="color:#fcb603">&nbsp;*</span>' : "") +
              "</span>";
          }

          if (tab.type === "subMenu") html += ICON_SUBMENU;
          if (tab.type === "checkbox") html += checkboxHTML(tab);
          if (tab.type === "slider") html += sliderHTML(tab, false);
          if (tab.type === "slider-checkbox")
            html += '<div class="VOptions">' + sliderHTML(tab, true) + checkboxHTML(tab) + "</div>";
          if (tab.type === "scrollable-checkbox")
            html += '<div class="VOptions">' + scrollableHTML(tab) + checkboxHTML(tab) + "</div>";
          if (tab.type === "scrollable") html += scrollableHTML(tab);
          if (tab.type === "divider") {
            html +=
              '<div class="Divider"><div class="Left"></div><span class="Label">' +
              '<span style="color:rgb(' +
              state.banner.color +
              ')">[</span>' +
              esc(tab.label) +
              '<span style="color:rgb(' +
              state.banner.color +
              ')">]</span></div><div class="Right"></div></div>';
          }

          return html;
        }

        function renderTabs() {
          var old = el.vtabs.querySelectorAll(".VTab");
          for (var i = 0; i < old.length; i++) old[i].remove();

          var fragment = document.createDocumentFragment();
          tabEls = [];
          state.tabs.forEach(function (tab, index) {
            var node = document.createElement("div");
            node.className =
              "VTab" +
              (index === state.selectedIndex ? " Selected" : "") +
              (tab.disabled ? " Disabled" : "");
            node.innerHTML = tabInner(tab, index);
            fragment.appendChild(node);
            tabEls.push(node);
          });
          el.vtabs.appendChild(fragment);
        }

        function updateHighlight() {
          if (!state.visible || state.tabs.length === 0) return;

          var node = tabEls[state.selectedIndex];
          if (!node) return;

          var pxToVw = function (px) {
            return (px / window.innerWidth) * 100 + "vw";
          };

          el.highlight.style.top = pxToVw(node.offsetTop);
          el.highlight.style.height = pxToVw(node.offsetHeight);

          var parent = node.parentElement;
          if (parent) {
            var parentRect = parent.getBoundingClientRect();
            var nodeRect = node.getBoundingClientRect();
            var distance =
              nodeRect.top < parentRect.top
                ? parentRect.top - nodeRect.top
                : nodeRect.bottom > parentRect.bottom
                ? nodeRect.bottom - parentRect.bottom
                : 0;
            var behavior = distance > 150 ? "auto" : "smooth";
            node.scrollIntoView({ block: "nearest", behavior: behavior });
          }
        }

        function updateProgress() {
          if (state.tabs.length === 0) return;

          var visibleCount = Math.floor(14.0625 / 1.5625);
          var notDivider = state.tabs.filter(function (tab) {
            return tab.type !== "divider";
          });
          var total = notDivider.length;
          var selected = notDivider.indexOf(state.tabs[state.selectedIndex]);

          if (total <= visibleCount) {
            el.progress.style.height = "97%";
            el.progress.style.top = "0%";
          } else {
            var heightPercent = (visibleCount / total) * 100;
            var topPercent = (selected / total) * (100 - heightPercent);
            el.progress.style.height = heightPercent + "%";
            el.progress.style.top = topPercent + "%";
          }
        }

        function updateIndicator() {
          var notDivider = state.tabs.filter(function (tab) {
            return tab.type !== "divider";
          });
          var index = notDivider.indexOf(state.tabs[state.selectedIndex]);
          el.indicator.textContent = "(" + (index + 1) + "/" + notDivider.length + ")";
        }

        function renderCategories() {
          var pcat = document.querySelector(".PCategories");
          if (pcat) pcat.style.display = state.categories && state.categories.length ? "" : "none";

          /* l'en-tete (nom + page) ne s'affiche que sur la page Home ;
             des qu'on est dans une categorie (onglets), il disparait */
          var header = document.querySelector(".VHeader");
          if (header) header.style.display = state.categories && state.categories.length ? "none" : "";

          var old = document.querySelectorAll(".PCategories .PCategory");
          for (var i = 0; i < old.length; i++) old[i].remove();

          var count = state.categories ? state.categories.length : 0;
          el.catHighlight.style.width = (count > 0 ? 100 / count : 100) + "%";
          el.catHighlight.style.transform = "translateX(" + state.categoryIndex * 100 + "%)";
          el.catHighlight.style.background =
            "linear-gradient(180deg, rgba(" + state.banner.color + ", 0.55) 0%, rgba(" + state.banner.color + ", 0.10) 100%)";
          el.catHighlight.style.boxShadow = "0 0 1.2vw rgba(" + state.banner.color + ", 0.35)";

          if (!state.categories) return;

          var fragment = document.createDocumentFragment();
          state.categories.forEach(function (cat, index) {
            var node = document.createElement("div");
            node.className = "PCategory" + (index === state.categoryIndex ? " active" : "");
            node.innerHTML = "<span>" + esc(cat.label) + "</span>";
            fragment.appendChild(node);
          });
          document.querySelector(".PCategories").appendChild(fragment);
        }

        function renderDesc() {
          var tab = state.tabs[state.selectedIndex];
          var show =
            state.visible &&
            tab &&
            !tab.metaData &&
            tab.type !== "subMenu" &&
            tab.type !== "divider" &&
            tab.type !== "slider" &&
            tab.type !== "scrollable";

          if (!show) {
            el.desc.classList.remove("show");
            el.desc.innerHTML = "";
            return;
          }

          var html = "<span>" + esc(tab.desc) + "</span>";
          if (
            tab.type === "button" ||
            tab.type === "checkbox" ||
            tab.type === "scrollable-checkbox" ||
            tab.type === "slider-checkbox"
          ) {
            html += '<span style="margin-left:12.65vw">F7 : Lier</span>';
          }

          el.desc.innerHTML = html;
          el.desc.classList.add("show");
        }

        function renderMetadata() {
          var tab = state.tabs[state.selectedIndex];
          var card = state.playerCard;
          var values = card ? card.values : tab && tab.metaData ? tab.metaData : null;
          var show = values && values.length > 0 ? true : false;

          if (!show) {
            el.metadata.classList.remove("show");
            return;
          }

          el.metadataTitle.textContent = (card ? card.title : tab.name) || "";
          el.metadataValues.innerHTML = values
            .map(function (val) {
              var status =
                val.key === "Health" || val.key === "Armour"
                  ? '<div class="Status" style="background-color:rgba(' +
                    val.color +
                    ', 0.25)"><div class="Progress" style="height:' +
                    parseInt(val.value) +
                    "%; background-color:rgb(" +
                    val.color +
                    ')"></div></div>'
                  : "";

              return (
                '<div class="Value"><div class="Key">' +
                esc(val.key) +
                '</div><div class="Val"><span style="color:' +
                (val.key === "Weapon" ? "#D82325" : "") +
                '">' +
                esc(val.value) +
                "</span>" +
                status +
                "</div></div>"
              );
            })
            .join("");

          el.metadata.classList.add("show");
        }

        function render() {
          renderTabs();
          updateHighlight();
          updateProgress();
          updateIndicator();
          renderCategories();
          renderDesc();
          renderMetadata();

          el.path.textContent = state.path.join("");

          if (el.bannerImg.getAttribute("src") !== state.banner.link) {
            el.bannerImg.style.display = "";
            el.bannerBox.style.background = "";
            el.bannerImg.setAttribute("src", state.banner.link);
          }

          el.footerIcon.style.color = "rgb(" + state.banner.color + ")";
          el.highlight.style.backgroundColor = "rgba(" + state.banner.color + ", 0.60)";
        }

        function setSelectedIndex(index) {
          state.selectedIndex = index;
          render();
        }

        /* ======================================================
           NOTIFICATIONS
           ====================================================== */
        var notificationId = 0;

        function addNotification(data) {
          notificationId++;

          var node = document.createElement("div");
          node.className = "Notification " + (data.type || "info");
          node.innerHTML =
            '<div class="Header">' +
            ICON_NOTIFICATION +
            '<span class="Title">' +
            esc(data.title) +
            "</span></div>" +
            '<div class="Body"><span class="NDesc">' +
            esc(data.desc) +
            "</span></div>";

          el.notifications.appendChild(node);

          requestAnimationFrame(function () {
            node.offsetWidth;
            node.classList.add("enter");
          });

          var autoTimer;
          var fallbackTimer;
          var done = false;

          function cleanup() {
            clearTimeout(autoTimer);
            clearTimeout(fallbackTimer);
            node.removeEventListener("transitionend", handleEnd);
            if (node.parentNode) node.remove();
          }

          function handleEnd(e) {
            if (e.target !== node) return;
            done = true;
            cleanup();
          }

          function startExit() {
            node.classList.remove("enter");
            node.classList.add("exit");
            node.addEventListener("transitionend", handleEnd);
            fallbackTimer = setTimeout(function () {
              if (!done) cleanup();
            }, 600);
          }

          autoTimer = setTimeout(startExit, data.duration || 4000);
        }

        /* ======================================================
           KEYBINDS
           ====================================================== */
        function renderKeybinds() {
          el.keybindList.innerHTML = state.keybinds
            .map(function (bind) {
              var status =
                bind.type === "checkbox" || bind.type === "slider-checkbox"
                  ? '<span style="color:white">(<span class="BStatus" style="color:' +
                    (bind.checked ? "" : "rgba(255, 255, 255, 0.50)") +
                    '">' +
                    (bind.checked ? "On" : "Off") +
                    "</span>)</span>"
                  : "";

              return (
                '<div class="Keybind ' +
                (bind.checked ? "Activated" : "") +
                '"><div class="Label">' +
                esc(bind.label) +
                '</div><div class="Elements"><span style="color:white">(' +
                esc(bind.keyLabel) +
                ')</span><div style="position:relative; display:flex; align-items:center; margin-right:0.35vw; color:white">' +
                status +
                "</div></div></div>"
              );
            })
            .join("");
        }

        /* ======================================================
           NUI MESSAGES
           ====================================================== */
        function applyKeyboard() {
          var visible = !!state.keyboard.visible;
          el.overlay.classList.toggle("show", visible);
          el.inputWrapper.classList.toggle("show", visible);
          el.inputTitle.textContent = state.keyboard.title || "";

          var value = state.keyboard.value === undefined ? "" : String(state.keyboard.value);
          var cursor = state.keyboard.cursor;
          if (typeof cursor !== "number" || isNaN(cursor) || cursor < 0 || cursor > value.length) {
            cursor = value.length;
          }

          el.inputValue.classList.add("julcursor");

          if (value.length === 0 && state.keyboard.placeholder) {
            el.inputValue.innerHTML =
              '<span class="JLGhost">' + esc(state.keyboard.placeholder) + '</span><i class="JLCaret"></i>';
            return;
          }

          el.inputValue.innerHTML =
            esc(value.slice(0, cursor)) + '<i class="JLCaret"></i>' + esc(value.slice(cursor));
        }

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || typeof data !== "object") return;

          switch (data.action) {
            case "showUI":
              state.visible = !!data.visible;

              if (data.visible && data.elements) {
                state.tabs = data.elements || [];
                if (typeof data.index === "number") state.selectedIndex = data.index;
                if (data.path && Array.isArray(data.path)) state.path = data.path;
                else state.path = ["Home"];
              }

              if (!data.visible && typeof data.index === "number") state.selectedIndex = data.index;

              if (typeof data.username !== "undefined") state.userName = data.username;

              el.vanta.classList.toggle("show", state.visible);
              render();
              break;

            case "keydown":
              if (typeof data.index === "number") setSelectedIndex(data.index);
              break;

            case "updateBanner":
              state.banner = {
                link: data.bannerLink != null ? data.bannerLink : state.banner.link,
                color: data.bannerColor != null ? data.bannerColor : state.banner.color,
              };
              if (typeof data.bannerColor !== "undefined") {
                document.documentElement.style.setProperty("--menu-color", data.bannerColor);
              }
              render();
              break;

            case "updateElements":
              state.tabs = data.elements || [];
              state.selectedIndex = typeof data.index === "number" ? data.index : 0;

              if (data.categories) {
                state.categories = data.categories;
                state.categoryIndex = data.categoryIndex || 0;
              } else {
                state.categories = null;
                state.categoryIndex = 0;
              }

              if (data.path && Array.isArray(data.path)) state.path = data.path;

              render();
              break;

            case "showNotification":
              addNotification({
                type: data.type || "info",
                title: data.title || "Notification",
                desc: data.desc || "",
                duration: data.duration || 4000,
              });
              break;

            case "displayBinds":
              state.keybindsVisible = !!data.visible;
              if (typeof data.binds !== "undefined") state.keybinds = data.binds;
              el.keybinds.classList.toggle("show", state.keybindsVisible);
              renderKeybinds();
              break;

            case "updateKeyboard":
              state.keyboard = {
                visible: data.visible,
                title: data.title,
                value: data.value,
              };
              applyKeyboard();
              break;

            case "setVisible":
              el.vis.classList.toggle("on", !!data.data);
              break;
          }
        });

        /* ======================================================
           PONT PROTOCOLE JuL
           ======================================================
           Traduit les messages du menu.lua existant (protocole JuL)
           vers cette interface Vanta. Le Lua reste inchange.
        ------------------------------------------------------ */
        var JUL = {
          scale: 1,
          x: "4vw",
          y: null,
          userX: null,
          userY: null,
          design: false,
          freecam: { visible: false, options: [], index: 0 },
        };

        var JUL_SKY = [81, 189, 245];

        function juNum(v, d) {
          var n = parseFloat(v);
          return isFinite(n) ? n : d;
        }

        function juKind(item) {
          var t = item.type;
          var list = Array.isArray(t) ? t : [t];
          if (list.indexOf("divider") >= 0) return "divider";
          if (list.indexOf("submenu") >= 0) return "subMenu";
          if (list.indexOf("checkbox") >= 0) return "checkbox";
          if (list.indexOf("slider") >= 0) return "slider";
          if (list.indexOf("scroll") >= 0 || list.indexOf("list") >= 0) return "scrollable";
          return "button";
        }

        function juElements(menu) {
          return (Array.isArray(menu) ? menu : [])
            .map(function (item) {
              if (!item || typeof item !== "object") return null;
              var kind = juKind(item);
              var e = { label: item.label == null ? "" : String(item.label) };
              if (item.desc) e.desc = String(item.desc);
              if (item.disabled) e.disabled = true;

              if (kind === "subMenu") {
                e.type = "subMenu";
              } else if (kind === "divider") {
                e.type = "divider";
              } else if (kind === "checkbox") {
                e.type = "checkbox";
                e.checked = !!item.checked;
              } else if (kind === "slider") {
                e.type = "slider";
                e.value = juNum(item.value, 0);
                if (item.min !== undefined) e.min = juNum(item.min, 0);
                if (item.max !== undefined) e.max = juNum(item.max, 100);
              } else if (kind === "scrollable") {
                e.type = "scrollable";
                var opts = Array.isArray(item.options) ? item.options : [];
                e.values = opts.length
                  ? opts.map(function (o) {
                      return o && typeof o === "object"
                        ? String(o.label == null ? "" : o.label)
                        : String(o == null ? "" : o);
                    })
                  : ["-"];
                e.value = Math.max(1, juNum(item.selected, 1));
              } else {
                e.type = "button";
              }

              return e;
            })
            .filter(function (e) {
              return e !== null;
            });
        }

        /* --- position + echelle du menu --- */
        function juPos() {
          var vanta = el.vanta;
          if (JUL.y === null && JUL.userY === null) {
            vanta.style.left = JUL.userX !== null ? JUL.userX : JUL.x;
            vanta.style.top = "";
            vanta.style.transform = "";
            vanta.style.transformOrigin = "";
            return;
          }
          vanta.style.left = JUL.userX !== null ? JUL.userX : JUL.x;
          vanta.style.top = JUL.userY !== null ? JUL.userY : JUL.y;
          vanta.style.transformOrigin = "0 0";
          vanta.style.transform = "scale(" + JUL.scale + ")";
        }

        /* --- echelle des autres panneaux (touches, saisie, notifs, charge, freecam) --- */
        function juZoom() {
          var z = JUL.scale;
          var t = z === 1 ? "" : "scale(" + z + ")";
          el.keybinds.style.transform = t;
          el.inputWrapper.style.transform = z === 1 ? "" : "translateX(-50%) scale(" + z + ")";
          el.notifications.style.transform = z === 1 ? "" : "translateX(-50%) scale(" + z + ")";
          var card = document.getElementById("JLLoadingCard");
          if (card) card.style.transform = t;
          var fc = document.getElementById("JLFreecam");
          if (fc) fc.style.transform = t;
          juPos();
        }

        var JUL_ACTIONS = {
          showMenu: function (d) {
            var v = !d || d.visible !== false;
            state.visible = v;
            if (!v) state.playerCard = null;
            el.vanta.classList.toggle("show", v);
            render();
          },

          setMenuPos: function (d) {
            d = d || {};
            var x = juNum(d.x, null);
            var y = juNum(d.y, null);
            var off = x !== null && x <= -100;
            if (d.force || off) {
              JUL.userX = null;
              JUL.userY = null;
            }
            if (off || d.force || (JUL.userX === null && JUL.userY === null)) {
              if (x !== null) JUL.x = x + "vh";
              if (y !== null) JUL.y = y + "vh";
            }
            juPos();
          },

          setUiScale: function (d) {
            var z = juNum(d && d.scale, 1);
            JUL.scale = z > 0 ? z : 1;
            juZoom();
          },

          setMenuColor: function (d) {
            d = d || {};
            var r = Math.max(0, Math.min(255, Math.round(juNum(d.r, 160))));
            var g = Math.max(0, Math.min(255, Math.round(juNum(d.g, 160))));
            var b = Math.max(0, Math.min(255, Math.round(juNum(d.b, 160))));
            /* remap de la teinte par defaut du Lua vers le bleu JuL */
            if (r === 45 && g === 175 && b === 235) {
              r = JUL_SKY[0];
              g = JUL_SKY[1];
              b = JUL_SKY[2];
            }
            state.banner.color = r + ", " + g + ", " + b;
            document.documentElement.style.setProperty("--menu-color", state.banner.color);
            render();
          },

          setBanner: function (d) {
            if (d && d.url) {
              state.banner.link = String(d.url);
              render();
            }
          },

          setBannerOffset: function (d) {
            var v = juNum(d && d.v, null);
            if (v === null) return;
            v = Math.max(-0.55, Math.min(2, v));
            el.bannerBox.style.marginTop = v + "vh";
            el.bannerBox.style.marginBottom = -v + "vh";
          },

          setFooterLogo: function (d) {
            var foot = document.querySelector(".VFooter");
            if (!foot) return;
            var old = foot.querySelector(".JLFooterImg");
            if (old) old.remove();
            var url = d && d.url ? String(d.url) : "";
            if (!url) {
              el.footerIcon.style.display = "";
              return;
            }
            el.footerIcon.style.display = "none";
            var img = document.createElement("img");
            img.className = "JLFooterImg";
            img.src = url;
            img.alt = "";
            foot.appendChild(img);
          },

          setFooterUser: function (d) {
            var nm = document.getElementById("MenuName");
            if (nm) nm.textContent = d && d.name ? String(d.name) : "JuL Menu";
          },

          setKeybinds: function (d) {
            var rows = d && Array.isArray(d.rows) ? d.rows : [];
            state.keybinds = rows.map(function (r) {
              r = r || {};
              var st = String(r.state || "none");
              return {
                label: r.label == null ? "" : String(r.label),
                keyLabel: r.key == null ? "" : String(r.key),
                type: st === "none" ? "button" : "checkbox",
                checked: st === "on",
              };
            });
            state.keybindsVisible = rows.length > 0;
            el.keybinds.classList.toggle("show", state.keybindsVisible);
            renderKeybinds();
          },

          setCurrent: function (d) {
            state.tabs = juElements(d && d.menu);
            var cur = Math.round(juNum(d && d.current, 1)) - 1;
            state.selectedIndex = Math.max(0, Math.min(Math.max(0, state.tabs.length - 1), cur));
            render();
          },

          setTabs: function (d) {
            var names = d && Array.isArray(d.tabs) ? d.tabs : [];
            state.categories = names.length
              ? names.map(function (n) {
                  return { label: String(n == null ? "" : n) };
                })
              : null;
            var max = state.categories ? state.categories.length - 1 : 0;
            state.categoryIndex = Math.max(0, Math.min(max, Math.round(juNum(d && d.index, 0))));
            if (state.categories) {
              var cat = state.categories[state.categoryIndex];
              state.path = [cat ? cat.label : "Menu"];
            }
            render();
          },

          setTabIndex: function (d) {
            if (!state.categories) return;
            state.categoryIndex = Math.max(
              0,
              Math.min(state.categories.length - 1, Math.round(juNum(d && d.index, 0)))
            );
            var cat = state.categories[state.categoryIndex];
            state.path = [cat ? cat.label : "Menu"];
            render();
          },

          resetTabs: function () {
            state.categories = null;
            state.categoryIndex = 0;
            state.path = ["Home"];
            render();
          },

          showInputPrompt: function (d) {
            d = d || {};
            state.keyboard = {
              visible: d.showInput === undefined ? true : !!d.showInput,
              title: d.title == null ? "Saisie" : String(d.title),
              value: d.value == null ? "" : String(d.value),
              cursor: typeof d.cursor === "number" ? d.cursor : null,
              placeholder: d.mode === "keybind" ? "Appuie sur une touche..." : "",
            };
            applyKeyboard();
          },

          updateInputPrompt: function (d) {
            d = d || {};
            state.keyboard.title = d.title == null ? state.keyboard.title : String(d.title);
            state.keyboard.value = d.value == null ? "" : String(d.value);
            state.keyboard.cursor = typeof d.cursor === "number" ? d.cursor : null;
            applyKeyboard();
          },

          hideInputPrompt: function () {
            state.keyboard.visible = false;
            applyKeyboard();
          },

          notify: function (d) {
            d = d || {};
            addNotification({
              type: d.type || "info",
              title: d.header || "Notification",
              desc: d.message || "",
              duration: juNum(d.duration, 4000),
            });
          },

          showLoading: function (d) {
            d = d || {};
            var box = document.getElementById("JLLoading");
            if (!box) return;
            var w = document.getElementById("JLLoadingWelcome");
            if (w) w.textContent = d.welcome ? "Bienvenue, " + d.welcome : "Bienvenue";
            var img = document.getElementById("JLLoadingImg");
            if (img && d.banner) img.src = String(d.banner);
            JUL_ACTIONS.loadingProgress({ percent: 0, status: "" });
            box.classList.add("show");
          },

          loadingProgress: function (d) {
            d = d || {};
            var pct = Math.max(0, Math.min(100, Math.round(juNum(d.percent, 0))));
            var f = document.getElementById("JLLoadingFill");
            var p = document.getElementById("JLLoadingPercent");
            var s = document.getElementById("JLLoadingStatusText");
            if (f) f.style.width = pct + "%";
            if (p) p.textContent = pct + "%";
            if (s && d.status) s.textContent = String(d.status);
          },

          hideLoading: function () {
            var box = document.getElementById("JLLoading");
            if (box) box.classList.remove("show");
          },

          displayPlayerCard: function (d) {
            if (!d || !d.visible || !d.data) {
              state.playerCard = null;
              renderMetadata();
              return;
            }
            var p = d.data;
            var hpMax = juNum(p.hpMax, 0);
            var hpN = juNum(p.hpN, 0);
            var hpPct = hpMax > 0 ? Math.round((hpN / hpMax) * 100) : Math.round(hpN - 100);
            hpPct = Math.max(0, Math.min(100, hpPct));
            var apPct = Math.max(0, Math.min(100, Math.round(juNum(p.apN, 0))));

            var vals = [];
            if (p.dist != null) vals.push({ key: "Distance", value: String(p.dist) });
            if (p.sid != null) vals.push({ key: "Server ID", value: String(p.sid) });
            vals.push({ key: "Health", value: String(hpPct), color: "0, 255, 17" });
            vals.push({ key: "Armour", value: String(apPct), color: "0, 132, 255" });
            if (p.wep != null) vals.push({ key: "Weapon", value: String(p.wep) });
            if (p.veh != null) vals.push({ key: "Vehicle", value: String(p.veh) });
            if (p.spd != null) vals.push({ key: "Speed", value: String(p.spd) });
            if (p.num) vals.push({ key: "Phone", value: String(p.num) });
            if (p.pos) vals.push({ key: "Position", value: String(p.pos) });
            if (p.hdg != null) vals.push({ key: "Heading", value: String(p.hdg) + (p.dir ? " " + p.dir : "") });

            state.playerCard = { title: p.name == null ? "" : String(p.name), values: vals };
            renderMetadata();
          },

          displayCrosshair: function (d) {
            var c = document.getElementById("JLCrosshair");
            if (c) c.classList.toggle("show", !!(d && d.visible));
          },

          displayFreecam: function (d) {
            JUL.freecam.visible = !!(d && d.visible);
            JUL.freecam.options =
              d && Array.isArray(d.options)
                ? d.options.map(function (o) {
                    return o && o.label != null ? String(o.label) : "";
                  })
                : [];
            JUL.freecam.index = 0;
            juFreecam();
          },

          scroll: function (d) {
            if (!JUL.freecam.visible) return;
            var n = JUL.freecam.options.length;
            if (!n) return;
            JUL.freecam.index = (JUL.freecam.index + (d && d.direction === "up" ? n - 1 : 1)) % n;
            juFreecam();
          },

          designMode: function (d) {
            JUL.design = !!(d && d.enabled);
            document.documentElement.setAttribute("data-design", JUL.design ? "on" : "");
          },
        };

        function juFreecam() {
          var box = document.getElementById("JLFreecam");
          var rows = document.getElementById("JLFreecamRows");
          if (!box || !rows) return;
          box.classList.toggle("show", JUL.freecam.visible);
          rows.innerHTML = JUL.freecam.options
            .map(function (label, i) {
              return '<div class="Row' + (i === JUL.freecam.index ? " Active" : "") + '">' + esc(label) + "</div>";
            })
            .join("");
        }

        function juDispatch(data) {
          if (!data || typeof data !== "object") return;
          var fn = JUL_ACTIONS[data.action];
          if (!fn) return;
          try {
            fn(data);
          } catch (err) {
            if (window.console && console.error) console.error("[JuL] " + data.action, err);
          }
        }

        window.addEventListener("message", function (event) {
          juDispatch(event.data);
        });

        /* --- mode design : glisser le menu / le panneau de touches --- */
        var juDrag = null;

        document.addEventListener("mousedown", function (e) {
          if (!JUL.design || e.button !== 0 || !e.target || !e.target.closest) return;

          if (e.target.closest(".VBanner")) {
            var r = el.vanta.getBoundingClientRect();
            juDrag = { kind: "menu", sx: e.clientX, sy: e.clientY, ox: r.left, oy: r.top };
          } else if (e.target.closest(".KBLWrapper .Header")) {
            var kr = el.keybinds.getBoundingClientRect();
            var layoutW = kr.width / JUL.scale;
            var lx = kr.left - layoutW * (1 - JUL.scale);
            el.keybinds.style.right = "auto";
            el.keybinds.style.left = lx + "px";
            el.keybinds.style.top = kr.top + "px";
            juDrag = { kind: "kbl", sx: e.clientX, sy: e.clientY, ox: lx, oy: kr.top };
          }
        });

        document.addEventListener("mousemove", function (e) {
          if (!juDrag) return;
          var dx = e.clientX - juDrag.sx;
          var dy = e.clientY - juDrag.sy;
          if (juDrag.kind === "menu") {
            JUL.userX = Math.round(juDrag.ox + dx) + "px";
            JUL.userY = Math.round(juDrag.oy + dy) + "px";
            juPos();
          } else {
            el.keybinds.style.left = Math.round(juDrag.ox + dx) + "px";
            el.keybinds.style.top = Math.round(juDrag.oy + dy) + "px";
          }
        });

        document.addEventListener("mouseup", function () {
          juDrag = null;
        });

        /* ======================================================
           APERCU NAVIGATEUR (hors FiveM uniquement)
           Simule la sequence que menu.lua envoie au NUI.
           ====================================================== */
        function julPreview() {
          document.getElementById("root").classList.add("BrowserPreview");

          juDispatch({ action: "showLoading", welcome: "joueur", banner: state.banner.link });

          var steps = [
            [12, "Connexion a l'interface...", 420],
            [38, "Chargement de la banniere...", 620],
            [64, "Application du theme...", 520],
            [88, "Verification des touches...", 480],
            [100, "Pret !", 420],
          ];
          var i = 0;
          (function next() {
            if (i >= steps.length) {
              juDispatch({ action: "hideLoading" });
              setTimeout(open, 250);
              return;
            }
            var s = steps[i++];
            juDispatch({ action: "loadingProgress", percent: s[0], status: s[1] });
            setTimeout(next, s[2]);
          })();

          function open() {
            juDispatch({ action: "setMenuPos", x: 20.25, y: 14, force: true });
            juDispatch({ action: "setUiScale", scale: 1 });
            juDispatch({ action: "setMenuColor", r: JUL_SKY[0], g: JUL_SKY[1], b: JUL_SKY[2] });
            juDispatch({ action: "showMenu", visible: true });

            /* --- page Home : aucun onglet, en-tete (Home | JuL Menu) visible --- */
            juDispatch({ action: "resetTabs" });
            juDispatch({
              action: "setCurrent",
              current: 2,
              menu: [
                { type: "submenu", label: "Player" },
                { type: "submenu", label: "Online" },
                { type: "submenu", label: "Weapon" },
                { type: "submenu", label: "Vehicle" },
                { type: "submenu", label: "Destroyer" },
                { type: "submenu", label: "Misc" },
                { type: "submenu", label: "Settings" },
              ],
            });
            juDispatch({
              action: "setKeybinds",
              rows: [
                { label: "Menu", key: "INSERT", state: "none" },
                { label: "Noclip", key: "U", state: "on" },
                { label: "Freecam", key: "H", state: "off" },
                { label: "Godmode", key: "G", state: "on" },
              ],
            });

            setTimeout(function () {
              /* --- categorie (ex. Misc) : barre d'onglets, en-tete masque --- */
              juDispatch({ action: "setTabs", tabs: ["Status", "Misc", "Appearance"], index: 0 });
              juDispatch({
                action: "setCurrent",
                current: 2,
                menu: [
                  { label: "Noclip", type: "checkbox", checked: false },
                  {
                    label: "Noclip Type",
                    type: "scroll",
                    selected: 1,
                    options: [{ label: " Normal " }, { label: " Fast " }, { label: " Smooth " }],
                  },
                  { label: "Noclip Speed", type: "slider", value: 5, min: 1, max: 20 },
                  { label: "Teleport to Waypoint", type: "button", desc: "Teleporte au marqueur pose sur la carte" },
                  { label: "Super Punch", type: "checkbox", checked: false },
                  { label: "Godmode", type: "checkbox", checked: true },
                  { label: "Solo Session", type: "checkbox", checked: false },
                  { label: "Semi God Mode", type: "checkbox", checked: false },
                  { label: "Invisibility", type: "checkbox", checked: false },
                  { label: "No Ragdoll", type: "checkbox", checked: false },
                ],
              });
              juDispatch({
                action: "displayPlayerCard",
                visible: true,
                data: {
                  name: "f4",
                  sid: 991,
                  dist: "32.4 m",
                  hdg: 128,
                  dir: "SE",
                  pos: "-1204.1, 86.0, 31.2",
                  num: "5561234870",
                  veh: "on foot",
                  wep: "0x2752E364",
                  spd: "4.2 km/h",
                  hpN: 162,
                  hpMax: 200,
                  apN: 40,
                },
              });
              juDispatch({ action: "displayCrosshair", visible: true });
              juDispatch({
                action: "notify",
                type: "info",
                header: "JuL Menu",
                message: "Interface prete. Apercu navigateur.",
                duration: 8000,
              });

              setTimeout(function () {
                juDispatch({ action: "setTabIndex", index: 1 });
              }, 3200);
              setTimeout(function () {
                juDispatch({ action: "setTabIndex", index: 2 });
              }, 4600);

              setTimeout(function () {
                juDispatch({
                  action: "displayFreecam",
                  visible: true,
                  options: [
                    { label: "Teleport To Crosshair" },
                    { label: "Bring Vehicle" },
                    { label: "Enter Vehicle" },
                    { label: "Repair Vehicle" },
                    { label: "Unlock Vehicle" },
                    { label: "Engine On" },
                    { label: "Delete Vehicle" },
                    { label: "Copy Crosshair Coords" },
                  ],
                });
              }, 1800);
            }, 1600);
          }
        }

        /* ======================================================
           NAVIGATION CLAVIER
           ====================================================== */
        window.addEventListener("keydown", function (e) {
          /* En jeu : la navigation est pilotee par le Lua (Lapsus.IsKeyDown), pas par le CEF */
          if (window.invokeNative || window.GetParentResourceName) return;
          if (!state.visible) return;
          if (state.tabs.length === 0) return;

          switch (e.key) {
            case "ArrowUp":
              setSelectedIndex((state.selectedIndex - 1 + state.tabs.length) % state.tabs.length);
              break;

            case "ArrowDown":
              setSelectedIndex((state.selectedIndex + 1) % state.tabs.length);
              break;

            case "Enter": {
              var current = state.tabs[state.selectedIndex];
              if (current && current.categories) {
                state.menuStack.push({
                  tabs: state.tabs,
                  categories: state.categories,
                  categoryIndex: state.categoryIndex,
                });
                state.categories = current.categories;
                state.categoryIndex = 0;
                state.tabs = current.categories[0].tabs;
                state.selectedIndex = 0;
                render();
              }
              break;
            }

            case "Backspace": {
              if (state.menuStack.length > 0) {
                var last = state.menuStack.pop();
                state.tabs = last.tabs;
                state.categories = last.categories;
                state.categoryIndex = last.categoryIndex;
                state.selectedIndex = 0;
                render();
              }
              break;
            }

            case "q":
            case "ArrowLeft": {
              if (state.categories) {
                var prevIndex = (state.categoryIndex - 1 + state.categories.length) % state.categories.length;
                state.categoryIndex = prevIndex;
                state.tabs = state.categories[prevIndex].tabs;
                state.selectedIndex = 0;
                render();
              }
              break;
            }

            case "e":
            case "ArrowRight": {
              if (state.categories) {
                var nextIndex = (state.categoryIndex + 1) % state.categories.length;
                state.categoryIndex = nextIndex;
                state.tabs = state.categories[nextIndex].tabs;
                state.selectedIndex = 0;
                render();
              }
              break;
            }
          }
        });

        window.addEventListener("resize", function () {
          updateHighlight();
        });

        /* ======================================================
           INIT
           ====================================================== */
        el.vis.classList.add("on");

        // Repli si le banner ne charge pas (pas d'image cassée affichée)
        el.bannerImg.addEventListener("error", function () {
          el.bannerImg.style.display = "none";
          el.bannerBox.style.background =
            "linear-gradient(120deg, rgba(var(--menu-color), 0.45) 0%, rgba(11, 11, 11, 0.95) 65%)";
        });

        renderKeybinds();
        applyKeyboard();
        render();

        /* ======================================================
           MODE DEMO - navigateur uniquement (aucune interference en jeu)
           ====================================================== */
        window.VantaDemo = (function () {
          var started = false;

          function showHint() {
            // Jamais affiche dans le jeu : la demo ne sert qu'au navigateur.
            if (window.invokeNative || window.GetParentResourceName) return;
            if (document.getElementById("vanta-demo-hint")) return;

            if (!document.getElementById("vanta-demo-style")) {
              var css = document.createElement("style");
              css.id = "vanta-demo-style";
              css.textContent =
                "#vanta-demo-hint{position:fixed;left:2vh;bottom:2vh;z-index:99999;display:flex;align-items:center;gap:.8vh;" +
                "background:rgba(11,11,11,.92);color:#cbd5e1;border:1px solid rgba(255,255,255,.12);" +
                "border-left:3px solid rgb(var(--menu-color));border-radius:.5vh;padding:.7vh 1.2vh;" +
                "font-family:'Readex Pro',sans-serif;font-size:1.05vh;box-shadow:0 8px 30px rgba(0,0,0,.6);" +
                "backdrop-filter:blur(10px);pointer-events:none}" +
                "#vanta-demo-hint b{color:#fff;background:rgb(var(--menu-color));padding:.2vh .7vh;border-radius:.35vh;" +
                "font-size:.95vh;letter-spacing:.05vh;text-transform:uppercase}" +
                "#vanta-demo-hint span{opacity:.85}";
              document.head.appendChild(css);
            }

            var hint = document.createElement("div");
            hint.id = "vanta-demo-hint";
            hint.innerHTML =
              "<b>Mode Demo</b><span>&uarr; &darr; naviguer &middot; ENTRER ouvrir &middot; RETOUR revenir &middot; " +
              "Q / E (ou &larr; &rarr;) changer de categorie</span>";
            document.body.appendChild(hint);
          }

          function hideHint() {
            var hint = document.getElementById("vanta-demo-hint");
            if (hint) hint.remove();
          }

          function start() {
            if (started) return true;
            started = true;

            document.getElementById("root").classList.add("BrowserPreview");
            showHint();

            state.visible = true;
            el.vanta.classList.add("show");

            state.keybindsVisible = true;
            el.keybinds.classList.add("show");

            render();

            addNotification({
              type: "success",
              title: "Success",
              desc: "You have successfully loaded Sync Menu, welcome!",
              duration: 4000,
            });
            addNotification({
              type: "info",
              title: "Info",
              desc: "Your license will never expire, thanks for using Sync Menu.",
              duration: 4000,
            });
            addNotification({
              type: "error",
              title: "Error",
              desc: "Loaded Staff/Developer Modules!",
              duration: 4000,
            });

            return true;
          }

          function stop() {
            if (!started) return false;
            started = false;

            hideHint();
            document.getElementById("root").classList.remove("BrowserPreview");

            state.visible = false;
            el.vanta.classList.remove("show");

            state.keybindsVisible = false;
            el.keybinds.classList.remove("show");

            el.notifications.innerHTML = "";
            el.overlay.classList.remove("show");
            el.inputWrapper.classList.remove("show");
            el.metadata.classList.remove("show");
            el.desc.classList.remove("show");

            render();
            return false;
          }

          return {
            start: start,
            stop: stop,
            isStarted: function () {
              return started;
            },
          };
        })();

        // Demarrage automatique UNIQUEMENT hors FiveM (fichier ouvert dans un navigateur) :
        // apercu simulant la sequence envoyee par menu.lua
        if (!window.invokeNative && !window.GetParentResourceName) {
          julPreview();
        }

        // Activation / desactivation a distance : SendNUIMessage({ action = 'demoMode', enabled = true })
        window.addEventListener("message", function (e) {
          var data = e.data;
          if (!data || data.action !== "demoMode") return;
          if (data.enabled === false) window.VantaDemo.stop();
          else window.VantaDemo.start();
        });
      })();
    </script>

    <script>
      /* Helper d'appel aux callbacks NUI de votre ressource (optionnel).
         Exemple : window.NUI('close', {}) */
      window.NUI = function (name, data) {
        var resource = window.GetParentResourceName ? window.GetParentResourceName() : 'vanta-ui';
        return fetch('https://' + resource + '/' + name, {
          method: 'post',
          headers: { 'Content-Type': 'application/json; charset=UTF-8' },
          body: JSON.stringify(data || {}),
        })
          .then(function (r) {
            return r.json();
          })
          .catch(function () {});
      };

      /* Decommentez pour envoyer la fermeture du clavier/overlay a votre ressource :
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') window.NUI('close', {});
      });
      */
    </script>
  </body>
