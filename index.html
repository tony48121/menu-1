<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script async src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
*{background:transparent}
::-webkit-scrollbar{display:none;width:0;height:0}

:root{
  --accent-rgb:84,150,96;
  --accent-light:178,208,183;
  --line-rgb:178,208,183;
  --color-main:rgba(var(--accent-rgb),0.35);
  --color-border:rgba(var(--accent-rgb),0.35);
  --color-shadow:rgba(var(--accent-rgb),0.35);
  --color-notify-main:rgb(var(--accent-rgb));
  --color-notify-shadow:rgba(var(--accent-rgb),0.35);
  --color-mainSolid:rgb(var(--accent-rgb));
  --color-tab:rgba(var(--accent-rgb),0.35);
  /* ----- PALETTE DU MENU : panneau noir + UNE couleur (celle du menu) -----
     Le fond reste noir (demande), mais TEINTE par la couleur du menu ; seule
     cette couleur change
     change : onglet actif, ligne selectionnee, filets, interrupteur allume,
     barre de defilement. Tout est recalcule par mnApplyColor() au chargement
     puis a chaque setMenuColor. Les variables sont des triplets "r,g,b" :
     l'opacite se regle dans le CSS avec rgba(var(--mn-x-rgb),alpha).
     Valeurs ci-dessous = repli (vert du menu par defaut).
       bg   = fond de la carte joueur (noir teinte a 6 %)
       acc  = couleur du menu (filets, contours, barre de defilement)
       hi   = fill eclairci (haut des degrades)   lo = fill assombri (bas)
       fill = acc ASSOMBRI EN HSL (saturation gardee) pour que le texte BLANC
              reste lisible dessus (selection, onglet actif, interrupteur)
       on   = acc tres lumineux, pour le texte/les icones d'accent            */
  --mn-bg-rgb:5,9,6;
  --mn-char-rgb:18,26,34;
  --mn-acc-rgb:84,150,96;
  --mn-hi-rgb:106,153,114;
  --mn-lo-rgb:37,65,42;
  --mn-fill-rgb:73,130,83;
  --mn-on-rgb:123,244,145;
  --item-height:4.16vh;
  --tabs-height:3.77vh;
  --banner-height:13vh;
  /* bandeau de titre ("Main Menu") SUPPRIME a la demande : hauteur 0 pour que
     la barre de defilement et la liste remontent d'elles-memes. */
  --crumb-h:0vh;
  --font:'Space Grotesk','Rubik','Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  /* police du menu et de la fiche joueur (les captures sont en Poppins) */
  --menu-font:'Poppins','Space Grotesk','Rubik','Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

/* ---------- conteneur ---------- */
/* Pas de fond sur la racine : la banniere et les barres sont noires, la liste
   a son propre fond. Un fond sur la racine s'ajouterait a celui de la liste.
   Pas d'overflow:hidden non plus : le creux et la barre sont dessines a
   l'interieur du panneau, rien ne depasse du cadre. */
.menu-root{font-family:var(--menu-font);color:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;position:fixed;width:44.2vh;z-index:1000;border-radius:1.3vh;background:transparent;border:0.13vh solid rgba(255,255,255,0.08);border-right:0.39vh solid rgb(var(--mn-acc-rgb));box-shadow:0.26vh 0 1.43vh -0.26vh rgba(var(--mn-acc-rgb),0.6),0 1.3vh 3.9vh rgba(0,0,0,0.6)}
.menu-banner{position:relative;border-radius:1.17vh 1.17vh 0 0;overflow:hidden;padding:0;background:#000}
.menu-banner img{width:100%;height:var(--banner-height);object-fit:cover;display:block}
.menu-body{position:relative;background:rgba(var(--mn-char-rgb),0.94);overflow:hidden;padding-left:1.56vh}
/* creux : petite gouttiere creusee dans le bord gauche du panneau. Le degrade
   part du plus sombre (fond du creux) vers le plus clair, un filet clair
   marque le bord interne : c'est ce bord qui donne la profondeur. La liste
   est decalee d'autant pour que la selection n'entre jamais dans le creux. */
.menu-body::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1.56vh;box-sizing:border-box;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0.72),rgba(0,0,0,0.30));
  border-right:0.13vh solid rgba(255,255,255,0.07)}

/* ---------- barre de titre : bandeau noir avec le nom de section (photo :
   "Online Options" entre banniere et onglets). renderCrumb y ecrit le fil
   d'Ariane ou, a defaut, l'onglet actif ; --crumb-h reserve sa hauteur pour
   que la barre de defilement et la liste descendent d'elles-memes. ---------- */
.menu-crumb{display:none}
.crumb-title{font-size:1.63vh;font-weight:500;letter-spacing:0.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
/* le titre seul s'affiche, comme sur les captures */
.crumb-parent{display:none}

/* ---------- onglets : colonnes egales, onglet actif rempli de la couleur du menu ---------- */
.menu-tabs{display:flex;height:var(--tabs-height);box-sizing:border-box;background:rgb(var(--mn-char-rgb));overflow:hidden}
.tab-item{flex:1;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.63vh;font-weight:600;white-space:nowrap;color:rgba(255,255,255,0.92);user-select:none;transition:background 0.2s ease,color 0.2s ease}
.tab-item.active{color:#fff;background:linear-gradient(180deg,rgb(var(--mn-hi-rgb)),rgb(var(--mn-fill-rgb)))}
/* variante pilule (setTabStyle {style:'pill'}) */
[data-tabs="pill"] .menu-tabs{padding:0.65vh 1.3vh}
[data-tabs="pill"] .tab-item{text-transform:uppercase;letter-spacing:0.08em;font-size:1.37vh;border:0.13vh solid transparent;border-radius:2.6vh}
[data-tabs="pill"] .tab-item.active{border-color:rgb(var(--mn-hi-rgb));background:rgba(var(--mn-fill-rgb),0.55);color:#fff}
/* filets entre onglets (photo : List|Basic|Advanced|Car) ; pas en pilule */
.tab-item+.tab-item{border-left:1px solid rgba(255,255,255,0.10)}
[data-tabs="pill"] .tab-item+.tab-item{border-left:none}
/* page Main Menu : l'onglet unique ne prend PAS le fond bleu (demande) ;
   il rend comme un onglet inactif. Le bandeau-titre noir, lui, reste. */
[data-main="on"] .tab-item.active{background:none;color:rgba(255,255,255,0.92)}
[data-tabs="pill"] [data-main="on"] .tab-item.active{background:none;border-color:transparent}
/* page Main Menu : la ligne d'onglets (un seul onglet "Main Menu", doublon
   du bandeau-titre) est supprimee, le bandeau noir reste seul. */
[data-main="on"] .menu-tabs{display:none}

/* ---------- barre de defilement (dans le creux a gauche) ---------- */
/* barre logee DANS le creux : top = bord haut du corps de liste (sans le
   0.52vh de padding), donc le track recouvre exactement la gouttiere et ne
   deborde plus sur le pied de page. z-index:5 car la barre est un frere de
   .menu-body place AVANT lui dans le DOM : sans le, le corps passerait
   par-dessus et masquerait la barre. */
/* bottom:3.9vh = hauteur du pied de page : le conteneur s'arrete au haut du
   pied, donc il ne deborde JAMAIS sur lui, quelle que soit la longueur de
   la liste (le track est de toute facon recalcule en px par applyBar).
   pointer-events:none : la barre n'est qu'un affichage, le defilement se
   fait sur la liste ; sinon le conteneur masquerait le clic sur le pied. */
.menu-scrollbar{position:absolute;left:0.39vh;top:calc(var(--banner-height) + var(--crumb-h) + var(--tabs-height));bottom:3.9vh;width:0.78vh;z-index:5;pointer-events:none;overflow:hidden;transition:opacity 0.3s cubic-bezier(0.4,0,0.2,1)}
.scrollbar-track{width:100%;height:100%;background-color:rgba(0,0,0,0.55);border-radius:0.39vh;position:relative}
.scrollbar-thumb{position:absolute;top:0;left:0;width:100%;background-color:rgb(var(--mn-acc-rgb));border-radius:0.26vh;transition:top 0.25s ease-out,height 0.25s ease-out;min-height:2.6vh}

/* ---------- liste ---------- */
.menu-items{position:relative;max-height:calc(var(--item-height) * 13);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0.52vh 0}
.menu-items::-webkit-scrollbar{display:none}
/* etat "liste vide" : le cadre de selection flotte alors sur rien, on livre
   donc l'explication plutot qu'un panneau blanc avec 0/0. */
.menu-empty{position:relative;z-index:1;display:flex;flex-direction:column;gap:0.46vh;align-items:center;text-align:center;padding:1.43vh 2.08vh}
.menu-empty-title{font-size:1.5vh;font-weight:700;letter-spacing:0.08em;color:rgb(var(--mn-on-rgb))}
.menu-empty-sub,.menu-empty-hint{font-size:1.3vh;font-weight:500;line-height:1.5;color:rgba(255,255,255,0.8)}
/* selection : bande pleine largeur, degrade vertical de la couleur du menu (defaut)
   ou degrade horizontal qui s'estompe (setSelectStyle {style:'gradient'}) */
.selection-highlight{position:absolute;left:0;right:0;height:var(--item-height);box-sizing:border-box;
  background:linear-gradient(180deg,rgb(var(--mn-hi-rgb)),rgb(var(--mn-fill-rgb)));
  border-top:0.13vh solid rgba(255,255,255,0.3);border-bottom:0.13vh solid rgba(var(--mn-hi-rgb),0.9);
  z-index:0;pointer-events:none;will-change:top;transform:translateZ(0)}
[data-select="gradient"] .selection-highlight{border:none;background:linear-gradient(90deg,rgb(var(--mn-fill-rgb)),rgba(var(--mn-fill-rgb),0.12));box-shadow:inset 0.39vh 0 0 rgb(var(--mn-hi-rgb))}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:0 2.6vh;height:var(--item-height);box-sizing:border-box;position:relative;z-index:1;border-bottom:0.09vh solid rgba(255,255,255,0.055)}
.menu-item.is-selected{border-bottom-color:transparent}
.menu-item.is-selected .name{font-weight:700}
.item-label{display:flex;align-items:center;gap:1.3vh;min-width:0;flex:1}
/* pas d'icones devant les lignes, comme sur les captures (le Lua peut toujours en envoyer) */
.row-icon{display:none}
.menu-item .name{font-size:1.63vh;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider-val{color:rgba(255,255,255,0.95);font-size:1.43vh;font-weight:500}
.components-container{display:flex;align-items:center;gap:1.04vh;flex-shrink:0}
.component{display:flex;align-items:center}
.caret-icon{font-size:1.63vh;font-weight:400;line-height:1;color:rgba(255,255,255,0.88)}
.swatch{display:block;width:2.21vh;height:2.21vh;border-radius:0.59vh;box-shadow:inset 0 0 0 0.13vh rgba(255,255,255,0.3)}
/* sur la ligne selectionnee, le texte prend la couleur lisible sur l'accent */
.menu-item.is-selected .name,.menu-item.is-selected .caret-icon,.menu-item.is-selected .slider-val,.menu-item.is-selected .scroll-value{color:#fff}

/* ---------- interrupteur : piste grise eteinte / couleur du menu allumee ---------- */
.toggle-switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.toggle-switch input{position:absolute;opacity:0;width:0;height:0}
.toggle-track{display:block;width:4.81vh;height:2.47vh;background:#62636c;border-radius:1.3vh;position:relative;transition:background 0.22s ease;box-sizing:border-box}
.toggle-thumb{position:absolute;top:50%;left:0.33vh;transform:translateY(-50%);width:1.76vh;height:1.76vh;border-radius:50%;background:#f2f2f4;transition:left 0.22s ease,background 0.22s ease}
.toggle-switch input:checked ~ .toggle-track{background:#878d98}
.toggle-switch input:checked ~ .toggle-track .toggle-thumb{left:calc(100% - 1.76vh - 0.33vh);background:#fff}
/* sur la ligne selectionnee la piste a la meme couleur que la bande : on l'inverse */
.menu-item.is-selected .toggle-switch input:checked ~ .toggle-track{background:linear-gradient(90deg,rgb(var(--mn-hi-rgb)),rgb(var(--mn-lo-rgb)))}
.menu-item.is-selected .toggle-switch input:checked ~ .toggle-track .toggle-thumb{background:#fff}
.menu-item.is-selected .toggle-track{box-shadow:0 0 0 0.13vh rgba(255,255,255,0.35)}

/* ---------- slider ---------- */
.range-component{position:relative;width:11.7vh;height:2.08vh;display:flex;align-items:center}
.range-track{position:absolute;left:0;width:100%;height:0.46vh;background:rgba(255,255,255,0.28);border-radius:0.26vh;z-index:1}
.range-fill{position:absolute;left:0;height:0.46vh;background:rgb(var(--mn-on-rgb));border-radius:0.26vh;z-index:2;pointer-events:none}
.menu-item.is-selected .range-track{background:rgba(255,255,255,0.4)}
.menu-item.is-selected .range-fill{background:#fff}
.range-component input[type="range"]{-webkit-appearance:none;appearance:none;position:relative;width:100%;height:0.46vh;background:transparent;outline:none;margin:0;padding:0;cursor:pointer;z-index:3}
.range-component input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:1.63vh;height:1.63vh;border-radius:50%;background:#fff;box-shadow:0 0 0.13vh rgba(0,0,0,0.4);margin-top:-0.16vh;cursor:pointer}
.range-component input[type="range"]::-moz-range-thumb{width:1.63vh;height:1.63vh;border-radius:50%;background:#fff;border:none;cursor:pointer}

/* ---------- sélecteur - valeur - ---------- */
.scroll-value{display:flex;align-items:center;gap:0.78vh;font-size:1.43vh;font-weight:600;letter-spacing:0.02em;color:rgba(255,255,255,0.85);max-width:22.1vh}
.scroll-value .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll-value .arrow{opacity:0.7}

/* ---------- séparateur : filet blanc - titre - filet blanc ---------- */
.separator-container{display:flex;align-items:center;justify-content:center;height:var(--item-height);padding:0 2.6vh;gap:1.82vh;box-sizing:border-box;background:transparent}
.separator-bar{display:block;flex:1 1 0;min-width:0;height:0.18vh;background:#fff;border-radius:0.13vh}
.separator-text{flex:none;color:#fff;font-size:1.5vh;font-weight:600;white-space:nowrap;letter-spacing:0.02em;text-align:center}

/* ---------- pied : texte a gauche | compteur a droite, filet de couleur au-dessus ---------- */
.menu-footer{background:#000;display:grid;grid-template-columns:auto 1fr auto;align-items:center;height:3.9vh;box-sizing:border-box;border-top:0.2vh solid rgb(var(--mn-acc-rgb));border-radius:0 0 1.17vh 1.17vh;overflow:hidden}
.footer-logo{display:flex;align-items:center;height:100%;padding:0 0 0 2.08vh;color:rgb(var(--mn-on-rgb))}
/* Bas a gauche : volontairement vide. L'emplacement n'accueille un logo que
   si une URL est explicitement fournie via FOOTER_LOGO_URL dans menu.lua ;
   aucun contenu par defaut (ni hexagone, ni nom, ni marque).
   :empty supprime aussi le padding, donc la colonne se reduit a zero et
   il ne reste rien du tout a cet emplacement. Des qu'une image y est posee,
   la regle generale ci-dessus reprend la main. */
.footer-logo:empty{padding:0}
/* Logo image en bas a gauche. Le visuel est blanc sur fond noir : "screen"
   rend le noir entierement transparent, donc le cadre du fichier disparait
   sur le pied et seul le lettrage subsiste. */
.footer-logo img{height:2.86vh;width:auto;display:block;mix-blend-mode:screen}
.footer-brand{text-align:left;font-size:1.43vh;font-weight:500;color:rgba(255,255,255,0.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2.08vh}
.footer-counter{display:flex;align-items:center;height:100%;padding:0 2.08vh;font-size:1.43vh;font-weight:600;color:#fff;letter-spacing:0.02em}

/* ---------- saisie ---------- */
.input-overlay{position:fixed;top:0;left:0;transform:none;width:100%;height:100%;background:rgb(0,0,0,0.5);z-index:999999;color:white;font-weight:500;font-family:var(--font);font-size:1.2vh}
.input-box{background-color:rgba(18,19,24,0.94);border:0.1vh solid rgba(var(--line-rgb),0.5);border-radius:0.6vh;display:flex;flex-direction:column;position:fixed;bottom:17.5vh;left:50%;transform:translateX(-50%);height:auto;width:55vh;overflow:hidden;box-shadow:0 0 1.4vh rgba(var(--accent-rgb),0.35)}
.input-box > .input-header{padding:0.8vh 1vh;border-bottom:0.1vh solid rgb(var(--line-rgb));width:100%;font-size:1.2vh;font-weight:600;background:linear-gradient(90deg,rgba(var(--accent-rgb),0.45) 0%,rgba(var(--accent-rgb),0) 100%)}
.input-header-inner{display:flex;align-items:center;gap:0.5vh}
.input-header-text{color:white}
.input-box input{padding:1.25vh 1vh;border:none;outline:none;background:transparent;color:white;font-size:1.2vh;font-family:var(--font);display:block;margin:0}

/* ===== Panneau de saisie / capture de touche ("Choose Menu Key") =====
   Reproduit menu-key (1).html : la reference faisait 1126 x 95 px
   (en-tete 38 px). AGRAANDI a la demande : on est passe de 640 x 64 px
   (en-tete 24 px) a 860 x 86 px (en-tete 32 px), polices 15 -> 20 px,
   icone 22x15 -> 30x21. Tous les ratios d'origine sont conserves (echelle
   ~1.34), donc rien n'est deforme.
   Il sert MAINTENANT pour TOUTES les prompts, keybinds compris : la saisie
   n'a pas besoin de <input> (c'est le Lua qui pousse le buffer via
   updateInputPrompt, avec cursorPos), donc le rendu est identique partout.
   LA LARGEUR EST EN vw : min(860px, 66vw). Un simple width fixe serait
   ecrase par max-width sur les petits ecrans et le panneau SEMBLERAIT ne pas
   changer ; en vw il suit toutes les resolutions (66vw sur un ecran de 800px,
   plafonne a 860px au-dela de ~1300px).
   VOILE : .kb-overlay fond un rideau sombre plein ecran derriere le panneau,
   comme l'ancien .input-overlay.
   Tout le panneau est calcule a partir d'UNE couleur, celle du menu
   (--accent-rgb), via kbApplyColor().
   POSITION : en bas de l'ecran (demande : "au niveau du bas de l'ecran").
   align-items:end + padding-bottom:3vh : le panneau reste centre a
   l'horizontale mais sa ligne de pied tombe sur celle du menu (le menu est
   ancre bottom:3vh, la hauteur du pied). Un place-items:center le laissait
   au milieu de l'ecran, chevauchant le personnage. La reference d'origine
   le collait en haut (padding-top:30px). */
.kb-overlay{box-sizing:border-box;position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;
  pointer-events:none;display:grid;align-items:end;justify-items:center;padding-bottom:3vh;
  background:rgba(0,0,0,0.55);
  font-family:var(--font);font-weight:500;color:var(--kb-text,#fff)}
.kb-panel{box-sizing:border-box;width:min(860px,66vw);max-width:calc(100vw - 48px);height:86px;display:flex;
  flex-direction:column;overflow:hidden;background:var(--kb-panel,rgba(98,98,98,0.82));
  border:1px solid var(--kb-border,rgba(208,208,208,0.35));border-radius:6px;
  box-shadow:0 0.35vh 1.4vh rgba(0,0,0,0.55)}
.kb-head{flex:none;height:32px;display:flex;align-items:center;gap:14px;padding:0 15px;
  background:var(--kb-head,rgba(57,57,57,0.92));border-bottom:1px solid var(--kb-rule,rgba(224,224,224,0.7))}
.kb-head svg{flex:none;color:var(--kb-icon,#e5e5e5)}
.kb-divider{flex:none;width:1px;height:20px;background:var(--kb-line,rgba(255,255,255,0.14))}
.kb-title{margin:0;font-size:20px;font-weight:700;letter-spacing:0.01em;color:#fff}
.kb-value{flex:1;min-height:0;display:flex;align-items:center;padding:0 21px;font-size:20px;font-weight:700}
.kb-key{overflow:hidden;text-overflow:ellipsis;white-space:pre;display:inline-flex;align-items:center}
.kb-key.placeholder{font-weight:400;color:var(--kb-text-off,rgba(255,255,255,0.72))}
.kb-caret{flex:none;width:3px;height:23px;background:var(--kb-text,#fff);
  animation:kb-blink 1.1s steps(1) infinite}
/* le curseur ne prend sa marge que quand il est en fin de texte : au milieu
   d'un mot il doit coller au caractere, sinon tout le texte glisse de 4px */
.kb-key.kb-gap .kb-caret{margin-left:5px}
@keyframes kb-blink{50%{opacity:0}}
.kb-hint{margin-left:auto;padding-left:21px;font-size:16px;font-weight:500;white-space:nowrap;
  color:var(--kb-text-off,rgba(255,255,255,0.72))}
@media (prefers-reduced-motion:reduce){.kb-caret{animation:none}}

/* ===== Panneau "Keybinds" (haut droite) =====
   Reproduit keybinds (1).html : voyant d'etat + libelle de l'option + touche.
   POSITION DEMANDEE : tout en haut a droite. Le panneau est une INFOS PERSISTANTE
   (il dit a quoi sert chaque touche), donc il reste visible meme quand le menu
   est ferme : le Lua garde la couche NUI active via _G.julKeybindHud, sur le
   meme principe que le viseur (_G.julCrosshair).
   Les couleurs derivent de l'accent du menu (kblApplyColor), donc le panneau
   suit DBZ (gris) ou Simpsons (bleu) sans rien coder en dur.
   Le voyant "on" est LE SEUL element qui ne derive pas de l'accent : sur un
   menu gris, hsl(sat=0) ne sait pas quelle teinte choisir et la reference
   produisait un voyant rose. Un vert d'etat reste lisible sur toutes les
   teintes. Les options sans etat persistent (bouton, curseur) n'ont pas de
   voyant : on met un espaceur de meme largeur pour garder les libelles alignes. */
.kb-list{box-sizing:border-box;position:fixed;top:2.2vh;right:2.2vh;z-index:9996;width:300px;

/* ---------- notifications (maquette notifications.html) ----------
   Pile en haut a droite, 340px. Tout se calcule a partir d'UNE couleur,

   warning, error, chacun avec sa propre icone SVG. Barre de temps en bas,
   en pause au survol. duration 0 = reste jusqu'a fermeture. */
.notify-stack{position:fixed;top:24px;right:24px;width:390px;max-width:calc(100vw - 32px);
  display:flex;flex-direction:column;gap:12px;z-index:9999;pointer-events:none;--slide:32px}
.nt-toast{--accent:var(--nt-on,#e0e0e0);position:relative;overflow:hidden;display:flex;
  align-items:flex-start;gap:14px;padding:14px 12px 17px 14px;pointer-events:auto;
  background:var(--nt-panel,rgba(98,98,98,0.88));border:1px solid var(--nt-border,rgba(208,208,208,0.35));
  border-radius:10px;animation:nt-in 0.28s ease-out both;
  font-family:var(--font);color:var(--nt-text,#fff)}
.nt-toast[data-level="success"]{--accent:var(--nt-success,#7be38b)}

.nt-toast[data-level="error"]{--accent:var(--nt-error,#ff7a70)}
.nt-toast.leaving{animation:nt-out 0.22s ease-in forwards}
@keyframes nt-in{from{opacity:0;transform:translateX(var(--slide))}to{opacity:1;transform:none}}
@keyframes nt-out{from{opacity:1;transform:none}to{opacity:0;transform:translateX(var(--slide))}}
.nt-icon{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  background:rgba(0,0,0,0.28);color:var(--accent)}

.nt-body{flex:1;min-width:0;padding-top:1px}
.nt-title{margin:0;font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.nt-msg{margin:3px 0 0;font-size:14px;line-height:1.4;color:var(--nt-text-off,rgba(255,255,255,0.72));overflow-wrap:anywhere}
.nt-close{flex:none;width:28px;height:28px;border:0;border-radius:6px;background:transparent;
  color:var(--nt-text-off,rgba(255,255,255,0.72));font:400 22px/1 var(--font);cursor:pointer}
.nt-close:hover{background:rgba(0,0,0,0.25);color:var(--nt-text,#fff)}
.nt-timer{position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--accent);
  transform-origin:left center;animation:nt-shrink linear forwards}
.nt-toast:hover .nt-timer{animation-play-state:paused}
@keyframes nt-shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.nt-toast,.nt-toast.leaving,.nt-timer{animation:none}.nt-toast.leaving{opacity:0}}

/* ---------- cible (reticule overlay) ---------- */
/* Dessinee par le NUI, pas par un composant HUD : ainsi elle coexiste avec
   Remove UI, qui masque les composants 1 a 22 chaque frame.
   Disque blanc plein + croix sombre qui depasse du disque.
   La croix est APRES le disque dans le DOM : elle doit le recouvrir. */
.jul-crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:4.6vh;height:4.6vh;pointer-events:none;z-index:9998}
.jul-cross-ring{position:absolute;top:50%;left:50%;width:2.3vh;height:2.3vh;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0.55vh rgba(0,0,0,0.5)}

.jul-cross-v{position:absolute;left:50%;top:0;width:0.28vh;height:100%;background-color:#0b0b0b;transform:translateX(-50%);box-shadow:0 0 0 0.08vh rgba(255,255,255,0.5)}

/* ---------- freecam ---------- */
.hovering-text-wrap{position:fixed;bottom:7.5vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;outline:none;min-width:18.52vh;font-family:var(--font)}
.hovering-text-list{list-style:none;margin:0;padding:0;text-align:center;pointer-events:none;user-select:none;max-height:calc(9 * (1.3vh * 1.3 + 0.37vh));overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;display:flex;flex-direction:column;align-items:center;scroll-behavior:smooth}
.hovering-text-item{padding:0.185vh 0;font-size:1.3vh;line-height:1.3;transition:transform 0.22s cubic-bezier(.2,.9,.2,1),color 0.22s cubic-bezier(.2,.9,.2,1),letter-spacing 0.22s;transform-origin:center;white-space:nowrap;min-width:27.78vh;font-weight:600;color:#fff}
.hovering-text-inactive{color:#fff;transform:scale(0.98);letter-spacing:0}
.hovering-text-selected{transform:scale(1.03);font-weight:600;letter-spacing:0.015vh;color:var(--color-mainSolid)}
li{display:list-item;text-align:-webkit-match-parent}
ul{list-style-type:disc}

/* ---------- fiche joueur ----------
   Carte d'infos qui apparait quand la selection du menu se pose sur un
   joueur de la liste. Tout le contenu vient de Lua : ce bloc ne fait que
   le poser a l'ecran. pointer-events:none, elle ne doit jamais capter un
   clic ni bloquer le menu. Fond noir, nom et barres a la couleur du menu. */
/* ---------- fiche joueur (photo : nom + ID soulignes, lignes iconees) ----------
   Carte affichee a la selection d'un joueur, calee a droite du menu par
   positionPlayerCard (laisse intact : il travaille sur le rectangle reel).
   Les icones sont des classes Phosphor dont le rendu a ete MESURE (toutes
   rendent un glyphe ; ph-gun n'existe pas dans cette version, d'ou ph-bomb
   pour Weapon). Le filet et les icones suivent la couleur du menu

.jul-pcard{position:fixed;right:1.6vh;top:0;width:360px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:17px 19px 12px;display:flex;flex-direction:column;font-family:var(--menu-font);color:#fff;pointer-events:none;z-index:9997;border-radius:12px;background:rgba(var(--mn-bg-rgb),0.96);border:1px solid rgba(var(--mn-acc-rgb),0.35);box-shadow:0 1vh 3vh rgba(0,0,0,0.65)}
.pc-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 2px 12px;border-bottom:2px solid rgb(var(--mn-acc-rgb))}
.pc-name{margin:0;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-id{flex:none;font-size:19px;font-weight:700}
.pc-sec{padding:7px 2px;border-bottom:1px solid rgba(255,255,255,0.08)}
.pc-sec:last-child{border-bottom:none;padding-bottom:0}
.pc-row{display:flex;align-items:center;gap:12px;min-height:36px}
.pc-ic{flex:none;width:24px;text-align:center;font-size:19px;line-height:1;color:rgb(var(--mn-acc-rgb))}
.pc-ic.pc-heart{color:#7be38b}
.pc-k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;color:rgba(255,255,255,0.55)}
.pc-v{flex:none;max-width:192px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:600;text-align:right}
/* ---------- contour du menu : a droite (defaut), tout autour, ou aucun (setEdgeStyle) ---------- */
[data-edge="all"] .menu-root{border-color:rgb(var(--mn-acc-rgb));border-width:0.39vh;box-shadow:0 0 1.43vh rgba(var(--mn-acc-rgb),0.55),0 1.3vh 3.9vh rgba(0,0,0,0.6)}
[data-edge="off"] .menu-root{border-right:0.13vh solid rgba(255,255,255,0.08);box-shadow:0 1.3vh 3.9vh rgba(0,0,0,0.6)}
/* ===== Ecarts avec les captures du menu a 4 couleurs ===== */
/* valeurs "< x >" par defaut pour les listes (photo) ; "- x -" seulement si
   item.arrows vaut explicitement false */
.scroll-value.arrows .arrow{font-size:0;opacity:1}
.scroll-value.arrows .arrow::before{font-size:1.5vh;font-weight:700;line-height:1}
.scroll-value.arrows .arrow:first-child::before{content:"<"}
.scroll-value.arrows .arrow:last-child::before{content:">"}
/* titre de page (setTitleStyle {style:'on'}) : barre noire, titre centre en gras */
[data-title="on"] .menu-crumb{display:flex;align-items:center;justify-content:center;height:3.9vh;box-sizing:border-box;background:#000}
[data-title="on"] .crumb-title{font-size:1.69vh;font-weight:700;color:#fff}
/* ancien fond noir (setBgStyle {style:'black'}) */
[data-bg="black"] .menu-body{background:rgba(var(--mn-bg-rgb),0.93)}
[data-bg="black"] .menu-tabs{background:#0b0b0d}
</style>

<body>
<div id="app"></div>
<script>
(()=>{
console.log('[JuL menu] version v14 (panneau noir + couleur du menu : barre de titre, onglets pleins, selection en degrade)');
const app=document.getElementById('app');
/* bandeau-titre visible par defaut (photo : bandeau noir "Online Options"
   entre banniere et onglets). Le Lua n'envoie jamais setTitleStyle, donc
   sans ceci la barre resterait cachee. renderCrumb y ecrit le nom de section. */
document.documentElement.dataset.title='on';
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const E_OUT='cubic-bezier(.33,1,.68,1)',E_IN='cubic-bezier(.32,0,.67,0)';

/* ---------- transitions (équivalent de svelte/transition) ---------- */
function tr(el,{kind,dur,start=.94,x=0,y=0,base=''},out){
  const hid={opacity:0},shown={opacity:1};
  if(kind==='scale'){hid.transform=`${base} scale(${start})`;shown.transform=`${base} scale(1)`}
  if(kind==='fly'){hid.transform=`${base} translate(${x}px,${y}px)`;shown.transform=`${base} translate(0px,0px)`}
  return el.animate(out?[shown,hid]:[hid,shown],{duration:dur,easing:kind==='fade'?'linear':out?E_IN:E_OUT,fill:out?'forwards':'none'});
}
function present(s,show,build,plan){
  if(show){
    if(s.els){if(s.out){(s.anims||[]).forEach(a=>a&&a.reverse());s.out=false;s.g++}return}
    s.els=(typeof build==='function')?build():s.els;
    s.out=false;s.anims=(typeof plan==='function')?plan(s.els,false):[];
  }else if(s.els&&!s.out){
    const els=s.els,g=++s.g;s.out=true;
    /* plan peut manquer (appel a 2 arguments) : on ne doit JAMAIS lever,
       sinon s.out reste bloque true et le panneau n'est jamais retire. */
    s.anims=(typeof plan==='function')?plan(els,true):[];
    const done=()=>{if(s.g===g){els.forEach(e=>e.remove());s.els=null;s.out=false}};
    /* .then(done,done) : nettoyage aussi si une animation est annulee
       (avant : .catch(()=>{}) laissait l'etat bloque "out" a jamais). */
    Promise.all(s.anims.map(a=>a&&a.finished)).then(done,done);
  }
}

/* ================= MENU PRINCIPAL (Base) ================= */
const B={cur:0,menu:[],tabs:['Main Menu'],tab:0,crumb:[],top:'23vh',left:'6.25vh',
  banner:'https://raw.githubusercontent.com/tony48121/Dragon-Ball-jul/refs/heads/main/jul_menu_v2.png',
  trackH:0,thumbTop:0,thumbH:24,over:false,hlTop:0,lock:null,rows:[],slot:{g:0}};
const live=()=>B.root&&B.root.isConnected;
const types=o=>Array.isArray(o.type)?o.type:[o.type];
const sig=o=>o.type=='divider'?'d':types(o).join(',')+(o.icon?'|i':'');

/* Aucun contenu par defaut en bas a gauche. Un logo n'apparait que si une URL
   est donnee (FOOTER_LOGO_URL dans menu.lua) : mix-blend-mode:screen est pose
   en CSS et rend le noir du fichier transparent sur le pied. Si l'image ne
   charge pas, on retombe sur le slot vide. */
function applyFooterLogo(lg,url){
  if(!lg||!url)return;
  const im=$('img');im.alt='';
  im.onerror=()=>{lg.replaceChildren();lg.classList.remove('has-img')};
  im.src=url;
  lg.replaceChildren(im);lg.classList.add('has-img');
}
function buildMenu(){
  const r=$('div','menu-root');r.style.cssText=`top:${B.top};left:${B.left};transform-origin:top left`;
  const ban=$('div','menu-banner'),img=$('img');img.alt='';img.src=B.banner;ban.append(img);
  const crumb=$('div','menu-crumb'),tabs=$('div','menu-tabs');
  const sb=$('div','menu-scrollbar'),trk=$('div','scrollbar-track'),thumb=$('div','scrollbar-thumb');trk.append(thumb);sb.append(trk);
  const body=$('div','menu-body'),list=$('div','menu-items');list.onscroll=onScroll;
  const hl=$('div','selection-highlight');hl.style.top=B.hlTop+'px';list.append(hl);body.append(list);
  const foot=$('div','menu-footer'),cnt=$('span','footer-counter');const logo=$('span','footer-logo');
  /* Slot bas gauche laissee vide par defaut. B.logoUrl est memorise : le pied
     est reconstruit a chaque showMenu, donc la reapplication ici est ce qui
     fait survivre un logo configure. */
  if(B.logoUrl)applyFooterLogo(logo,B.logoUrl);
  foot.append(logo,$('span','footer-brand','JuL - Menu'),cnt);
  r.append(ban,crumb,tabs,sb,body,foot);app.append(r);
  Object.assign(B,{root:r,img,crumbEl:crumb,tabsEl:tabs,trackEl:trk,thumb,list,hl,cnt,logoEl:logo,rows:[]});
  renderTabs();renderCrumb();applyBar();
  return [r];
}
const planMenu=(e,out)=>[];

function renderTabs(){
  if(!live())return;
  B.tabsEl.replaceChildren(...B.tabs.map((t,i)=>{
    const d=$('div','tab-item'+(i===B.tab?' active':''),t);
    return d;
  }));
  renderCrumb();
}
function renderCrumb(){
  if(!live())return;
  const p=B.crumb,c=B.crumbEl;
  /* Player (Status/Misc/Appearance) : le bandeau ecrit toujours "Player",
     peu importe l'onglet actif (demande). */
  const t=B.tabs;
  const isPlayer=(t.length===3&&t[0]==='Status'&&t[1]==='Misc'&&t[2]==='Appearance');
  /* Online (List/Safe/Player/Vehicle) : le bandeau ecrit toujours "Online",
     peu importe l'onglet actif (demande, miroir de Player). */
  const isOnline=(t.length===4&&t[0]==='List'&&t[1]==='Safe'&&t[2]==='Player'&&t[3]==='Vehicle');
  /* Settings (Settings/Banners/Misc/Resources) : pareil, "Settings" fixe. */
  const isSettings=(t.length===4&&t[0]==='Settings'&&t[1]==='Banners'&&t[2]==='Misc'&&t[3]==='Resources');
  /* Misc (General/Freecam) : pareil, "Misc" fixe. */
  const isMisc=(t.length===2&&t[0]==='General'&&t[1]==='Freecam');
  /* Vehicle : onglet renomme "Spawn" (le bandeau reste "Vehicle"). */
  const isVehicle=(t.length===2&&t[0]==='Spawn'&&t[1]==='Mods');
  const title=isPlayer?'Player':(isOnline?'Online':(isSettings?'Settings':(isMisc?'Misc':(isVehicle?'Vehicle':(p.length?String(p[p.length-1]):String(B.tabs[B.tab]||'Main'))))));
  /* page Main Menu : le bandeau-titre noir RESTE, mais l'onglet unique perd
     son fond bleu (demande : "supprimer que la bande bleue"). Le flag
     data-main pilote le CSS des onglets. Repose a chaque rendu car le
     panneau est reconstruit a chaque showMenu. */
  const isMain=!p.length&&(title.trim().toLowerCase()==='main menu');
  B.root.dataset.main=isMain?'on':'';
  c.replaceChildren($('span','crumb-title',title));
  B.root.style.setProperty('--crumb-h',document.documentElement.dataset.title==='on'?'3.9vh':'0vh');
  /* sans la ligne d'onglets sur Main Menu, la barre et la liste remontent */
  B.root.style.setProperty('--tabs-height',isMain?'0vh':'3.77vh');
}
const comp=h=>{const d=$('div','component');d.innerHTML=h;return d};
function mkRow(o){
  if(o.type=='divider'){const d=$('div','separator-container');d.append($('div','separator-bar'),$('div','separator-text'),$('div','separator-bar'));return d}
  const r=$('div','menu-item'),lab=$('div','item-label'),cc=$('div','components-container');
  lab.append($('span','name'));if(o.icon)lab.prepend($('i','ph '+o.icon+' row-icon'));
  types(o).forEach(t=>{
    if(t==='submenu')cc.append(comp('<span class="caret-icon" aria-hidden="true">&gt;</span>'));
    else if(t==='action')cc.append(comp('<span class="caret-icon" aria-hidden="true">+</span>'));
    else if(t==='color')cc.append(comp('<span class="swatch"></span>'));
    else if(t==='checkbox'){const c=comp('<label class="toggle-switch"><input type="checkbox"><span class="toggle-track"><span class="toggle-thumb"></span></span></label>');
      c.querySelector('input').onchange=e=>{r._o.checked=e.target.checked};cc.append(c)}
    else if(t==='slider'){const c=comp('<div class="range-component"><div class="range-track"></div><div class="range-fill"></div><input type="range"></div>');
      c.querySelector('input').oninput=e=>{r._o.value=+e.target.value;patchRow(r,r._o,r._i)};cc.append(c)}
    else if(t==='scroll')cc.append(comp('<div class="scroll-value"><span class="arrow">-</span><span class="val"></span><span class="arrow">-</span></div>'));
  });
  r.append(lab,cc);return r;
}
function patchRow(r,o,i){
  r._o=o;r._i=i;
  if(o.type=='divider'){r.children[1].textContent=o.label??'';return}
  r.classList.toggle('is-selected',B.cur===i);
  const nm=r.querySelector('.name');nm.textContent=o.label??'';const ic=r.querySelector('.row-icon');if(ic&&o.icon)ic.className='ph '+o.icon+' row-icon';
  if(types(o).includes('slider')&&B.cur===i)nm.append(' ',$('span','slider-val',': '+o.value));
  const cb=r.querySelector('input[type=checkbox]');if(cb)cb.checked=!!o.checked;
  const rg=r.querySelector('input[type=range]');
  if(rg){
    [['min',o.min],['max',o.max],['step',o.step]].forEach(([k,v])=>v==null?rg.removeAttribute(k):rg.setAttribute(k,v));
    rg.value=o.value??'';
    r.querySelector('.range-fill').style.width=o.max>o.min?((o.value-o.min)/(o.max-o.min))*100+'%':'0%';
  }
  const sc=r.querySelector('.scroll-value .val');
  if(sc)sc.parentElement.classList.toggle('arrows',o.arrows!==false);
  if(sc)sc.textContent=o.options?.[o.selected-1]?.label||o.options?.[0]?.label||(!o.options||o.options.length===0?'Loading...':'None');
  const sw=r.querySelector('.swatch');if(sw)sw.style.background=o.color||'#fff';
}
function renderItems(){
  if(!Array.isArray(B.menu))B.menu=[];
  B.menu.forEach((o,i)=>{
    let row=B.rows[i];
    if(!row||row._s!==sig(o)){const n=mkRow(o);n._s=sig(o);row?row.replaceWith(n):B.list.append(n);row=B.rows[i]=n}
    patchRow(row,o,i);
  });
  while(B.rows.length>B.menu.length)B.rows.pop().remove();
}
/* Liste vide : on affiche une explication au lieu d'un panneau blanc avec un
   compteur 0/0. Ce cas vient TOUJOURS du Lua (MenuConfig non charge, sanitize
   ou json.encode en echec) : le message dit donc ou aller regarder. */
function setEmptyState(on){
  if(!live())return;
  let e=B.list.querySelector('.menu-empty');
  if(!on){if(e)e.remove();return}
  if(e)return;
  e=$('div','menu-empty');
  e.append($('div','menu-empty-title','MENU VIDE (0/0)'),
           $('div','menu-empty-sub',"Le script n'a envoye aucun element."));
  e.append($('div','menu-empty-hint','Re-injecte menu.lua (voir F8).'));
  B.list.append(e);
}
function updCounter(){
  if(!Array.isArray(B.menu))B.menu=[];
  const s=B.menu.reduce((a,o,i)=>(o&&o.type!=='divider'&&a.push(i),a),[]);
  let n=0;
  if(s.length){const p=s.indexOf(B.cur);n=p!==-1?p+1:s.reduce((b,x,k)=>Math.abs(x-B.cur)<Math.abs(s[b]-B.cur)?k:b,0)+1}
  if(B.cnt)B.cnt.textContent=`${n} / ${s.length}`;
}
function applyBar(){
  if(!B.thumb)return;
  B.trackEl.style.height=B.trackH+'px';B.thumb.style.top=B.thumbTop+'px';B.thumb.style.height=B.thumbH+'px';
}
function bar(){
  if(!live())return;
  /* on annule le rAF en attente au lieu d'etre avale : sinon trackH garde
     la hauteur de l'ancien menu et le track deborde sur le pied. */
  if(B.lock){cancelAnimationFrame(B.lock);B.lock=null}
  B.lock=requestAnimationFrame(()=>{
    B.lock=null;const L=B.list;if(!live())return;
    const cH=L.clientHeight,sH=L.scrollHeight,n=B.menu.length;
    B.trackH=Math.round(cH);B.over=sH>cH+1;
    if(B.over){
      B.thumbH=Math.min(Math.max(100,Math.round(cH/sH*B.trackH)),B.trackH);
      const mx=Math.max(0,sH-cH),ra=mx?clamp(L.scrollTop/mx,0,1):0,sc=Math.max(0,B.trackH-B.thumbH);
      B.thumbTop=clamp(Math.round(sc*ra),0,sc);
    }else{
      B.thumbH=Math.min(n<=7?B.trackH:Math.max(100,Math.round(B.trackH*(7/n))),B.trackH);
      const c=Math.max(1,n),ra=c>1?clamp(B.cur,0,c-1)/(c-1):0,sc=Math.max(0,B.trackH-B.thumbH);
      B.thumbTop=clamp(Math.round(sc*ra),0,sc);
    }
    applyBar();
  });
}
function onScroll(){
  const L=B.list;if(!L||!B.over||B.lock)return;
  B.lock=requestAnimationFrame(()=>{
    B.lock=null;
    const mx=Math.max(0,L.scrollHeight-L.clientHeight),ra=mx?clamp(L.scrollTop/mx,0,1):0,sc=Math.max(0,B.trackH-B.thumbH);
    B.thumbTop=clamp(Math.round(sc*ra),0,sc);applyBar();
  });
}
/* Le cadre de selection se deplace SANS animation. L'ancienne version faisait
   un h.animate() de 220 ms avec fill:'forwards' : au rythme de reponse des
   touches (85 ms) l'animation etait interrompue avant d'aller au bout, et le
   cadre restait fige sur une ancienne position, en decalage avec la ligne
   selectionnee. Le saut instantane est le seul etat toujours juste, meme en
   maintenant la touche enfoncee. */
function moveHl(t){
  const h=B.hl;if(!h){B.hlTop=t;return}
  h.getAnimations().forEach(a=>a.cancel());
  B.hlTop=t;h.style.top=t+'px';
}
const curRow=()=>B.menu[B.cur]&&B.menu[B.cur].type!='divider'?B.rows[B.cur]:null;
/* Garantit que la ligne selectionnee est TOUTE ENTIERE dans la zone visible.
   L'ancien scrollIntoView({behavior:'smooth'}) est asynchrone : au rythme de
   reponse des touches (85 ms), chaque nouvelle demande interrompt la
   precedente et la liste ne rattrape jamais -> la selection sortait de l'ecran
   et restait a moitie coupee. Ici le calcul est synchrone et deterministe. */
function ensureVisible(el){
  const L=B.list;if(!el||!L)return;
  const cs=getComputedStyle(L);
  const padT=parseFloat(cs.paddingTop)||0,padB=parseFloat(cs.paddingBottom)||0;
  const t=el.offsetTop,b=t+el.offsetHeight,vt=L.scrollTop,vb=vt+L.clientHeight;
  /* Le rembourrage de la liste (0.6vh en haut et en bas) DOIT rester visible :
     sans lui, la barre de selection vient se coller a 0,3 px du bord et se
     confondre avec le pied de page, comme si elle sortait du panneau. */
  if(t-padT<vt)L.scrollTop=Math.max(0,t-padT);
  else if(b+padB>vb)L.scrollTop=Math.max(0,b+padB-L.clientHeight);
}
function refresh(){
  if(!live())return;
  renderItems();updCounter();
  setEmptyState(!Array.isArray(B.menu)||B.menu.length===0);
  const el=curRow();if(el){moveHl(el.offsetTop);ensureVisible(el)}
  bar();
}
const showMenu=()=>{present(B.slot,true,buildMenu,planMenu);refresh()};
/* Fermeture DETERMINISTE : le panneau est retire immediatement, sans animation
   ni etat "out" pouvant rester bloque. C'est ce qui garantit que le menu peut
   se fermer pendant qu'une notification s'affiche a cote (la fenetre NUI
   reste visible dans ce cas, donc la page doit masquer le panneau elle-meme). */
function hideMenuNow(){
  const s=B.slot;
  s.g++;                 /* invalide la suppression en attente d'un hide precedent */
  s.out=false;
  s.anims=[];
  if(s.els){s.els.forEach(e=>e.remove());s.els=null}
}

/* ===== Echelle de l'interface (option Menu Size) =====
   L'option ne regle pas que le menu : elle met a l'echelle TOUTE
   l'interface (panneau de saisie + liste des touches + fiche joueur).
   On utilise `zoom` et pas `transform:scale` : zoom recalcule la mise en
   page et le texte reste net, alors que transform ne ferait qu'etirer
   l'image (flou). positionPlayerCard travaille sur le rectangle rendu,
   donc la fiche reste calee a droite du menu une fois zoomee.
   Les toasts, la freecam et le viseur sont des affichages de jeu :
   ils gardent leur taille. */
const UI={scale:0.8};
function uiApplyScale(){
  document.querySelectorAll('.kb-panel,.kb-list,.jul-pcard').forEach(function(e){e.style.zoom=UI.scale});
  /* le zoom change la taille rendue : on recale la fiche aussitot, sinon
     elle garderait l'ancienne position jusqu'au prochain paquet (250ms) */
  if(typeof positionPlayerCard==='function')positionPlayerCard();
}

/* ================= FICHE JOUEUR ================= */
/* Carte d'infos affichee quand la selection du menu se pose sur un joueur
   de la liste. Lua envoie un paquet complet a chaque rafraichissement :
   ce bloc n'affiche, ne calcule et ne devine RIEN. */
/* Elle se cale sur le MENU et non sur l'ecran : on lit le rectangle reel de
   .menu-root a chaque affichage, pour que Menu Size et setMenuPos suivent
   tout seuls, sans qu'aucune largeur ait besoin d'etre devinee.
   B est declare plus bas : d'ou le typeof, un accours sans B ne doit pas
   faire echouer l'affichage de la carte. */
const PC_GAP=6, PC_M=8, PC_DYVH=6.5;
function positionPlayerCard(el){
  const c=el||(PC.slot.els&&PC.slot.els[0]);
  if(!c)return;
  /* le zoom de l'option Menu Size (style.zoom) multiplie AUSSI les offsets
     positionnes : un left ecrit 339px avec zoom 0.7 rend 237px. On ecrit donc
     les coordonnees divisees par l'echelle pour retomber juste. Mesure :
     339 x 0.7 = 237.3 au dixieme. */
  const z=(typeof UI!=='undefined'&&UI.scale>0)?UI.scale:1;
  const root=(typeof B!=='undefined')?B.root:null;
  const b=(root&&root.isConnected)?root.getBoundingClientRect():null;
  /* rect plutôt qu'offsetWidth : largeur fractionnaire, la cale anti-debordement
     doit se fier a la meme valeur que celle rendue par le navigateur. */
  const cr=c.getBoundingClientRect();
  const w=cr.width||c.offsetWidth||0, h=cr.height||c.offsetHeight||0;
  let x,y;
  if(b&&b.width){
    x=b.right+PC_GAP;
    /* haut de la fiche au MILIEU de la banniere (demande) : banniere 13vh
       donc +6.5vh sous le haut du menu. En vh pour suivre toutes les
       resolutions ; stable quelle que soit la hauteur du menu. */
    y=b.top+PC_DYVH*window.innerHeight/100;
  }else{
    /* menu absent : repli centre, sans translate (voir CSS) */
    x=window.innerWidth-w-PC_M;
    y=Math.max(PC_M,(window.innerHeight-h)/2);
  }
  /* la fiche ne doit jamais deborder a droite ni sortir verticalement */
  if(x+w>window.innerWidth-PC_M)x=Math.max(PC_M,window.innerWidth-w-PC_M);
  if(y<PC_M)y=PC_M;
  if(y+h>window.innerHeight-PC_M)y=Math.max(PC_M,window.innerHeight-PC_M-h);
  c.style.left=Math.round(x/z)+'px';
  c.style.right='auto';
  c.style.top=Math.round(y/z)+'px';
}
const PC={d:null,slot:{g:0}};
function buildPlayerCard(){
  const c=$('div','jul-pcard');
  /* ic = classe Phosphor VERIFIEE par mesure de rendu (ph-gun n'existe pas
     dans cette version : Weapon prend ph-bomb, membre du set prouve).
     Les cles absentes du paquet Lua (Character/Radio/Job/Group) restent '-'
     via set() : inconnu affiche, jamais invente. */
  const row=(k,ic,fr)=>`<div class="pc-row"><i class="ph ${ic} pc-ic"></i><span class="pc-k">${fr}</span><span class="pc-v" data-k="${k}">-</span></div>`;

  c.innerHTML=`
    <div class="pc-head"><span class="pc-name" data-k="Name">-</span><span class="pc-id" data-k="Sid">-</span></div>
    <div class="pc-sec">${row('Character','ph-user','Character')}${row('Phone','ph-phone','Phone')}${row('Radio','ph-radio','Radio')}${row('Job','ph-briefcase','Job')}${row('Group','ph-users','Group')}</div>

    <div class="pc-sec">${row('Distance','ph-crosshair','Distance')}${row('Vehicle','ph-car','Vehicle')}${row('Weapon','ph-bomb','Weapon')}${row('Speed','ph-lightning','Speed')}</div>`;
  app.append(c);positionPlayerCard(c);uiApplyScale();return [c];
}
/* Entree : simple glisse depuis la droite. Pas de base translateY : la fiche
   est ancree par son haut (positionPlayerCard), un recentrage la ferait
   "sauter" a la fin de l'animation. Sortie : immediate (voir plus bas). */
const planPlayerCard=(e,out)=>out?[]:[tr(e[0],{kind:'fly',x:26,dur:260},out)];
function renderPlayerCard(){
  const e=PC.slot.els,d=PC.d;if(!e)return;
  /* recale a chaque rafraichissement : le menu bouge (setMenuPos, Menu Size,
     ouverture d'un sous-menu qui change sa hauteur) */
  positionPlayerCard(e[0]);
  if(!d)return;
  const q=s=>e[0].querySelector(s);
  const set=(sel,val)=>{const n=q(sel);if(n)n.textContent=(val==null||val==='')?'-':String(val)};
  set('[data-k="Name"]',d.name);
  /* la photo montre l'ID seul ("379"), sans diese */
  set('[data-k="Sid"]',(d.sid==null||d.sid==='')?null:d.sid);
  /* d.num peut etre nil : set() ecrit "-" dans ce cas, jamais undefined.
     C'est le cas nominal tant que le serveur ne publie pas le numero. */
  set('[data-k="Phone"]',d.num);
  /* vie : le natif rend 100..200 (100 = mort), la photo lit 0..100 */
  set('[data-k="Health"]',(typeof d.hpN==='number')?Math.max(0,Math.round(d.hpN-100)):null);
  set('[data-k="Armor"]',(typeof d.apN==='number')?Math.max(0,Math.min(100,Math.round(d.apN))):null);
  set('[data-k="Distance"]',d.dist);
  set('[data-k="Vehicle"]',d.veh);
  set('[data-k="Weapon"]',d.wep);
  set('[data-k="Speed"]',d.spd);
}
function playerCardShow(d){
  /* Le Lua envoie les donnees IMBRIQUEES : { action, visible, data:{...} }.
     Sans cette extraction, PC.d pointe sur le conteneur et renderPlayerCard
     lit d.name / d.sid / d.hpN qui n'existent pas a ce niveau : tous les
     champs restent "-". On garde "visible" du message externe. */
  const v=d&&d.visible;
  const p=(d&&d.data)?d.data:d;
  PC.d=v?p:null;
  present(PC.slot,!!PC.d,buildPlayerCard,planPlayerCard);
  renderPlayerCard();
  if(!PC.d)return;
  /* La largeur mesuree au moment du build ne vaut que si les polices sont
     deja chargees : sinon la fiche est callee ~11px trop a droite, puis
     "saute" au premier rafraichissement. On recalle une fois le rendu final
     connu. requestAnimationFrame seuls ne suffit pas : c'est document.fonts
     qui decide. */
  requestAnimationFrame(()=>positionPlayerCard());
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>positionPlayerCard()).catch(()=>{});
}

/* ================= NOTIFICATIONS (maquette notifications.html) ================= */
/* Couleurs derivees du menu : ntApplyColor(r,g,b) recalcule --nt-panel et
   --nt-on a chaque setMenuColor. Defaut gris 150,150,150 comme le reste. */
const ntStack=$('div','notify-stack');app.append(ntStack);
const NT_LEVELS=['info','success','warning','error'];
const NT_ICONS={
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  success:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  warning:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  error:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'};
const ntToasts={};let ntNext=1;
const NT_MAX=5,NT_DEFAULT=5000;
function ntHsl(c){
  const r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));
    if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return [h,s,l];
}
function ntHslRgb(h,s,l){
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function ntApplyColor(r,g,b){
  const main=[r,g,b],black=[0,0,0],white=[255,255,255],panel=kbMix(main,black,0.35);
  const hsl=ntHsl(main);
  /* Gris (saturation ~0) : forcer une saturation 0.9 donnerait du rose.
     On prend un gris clair neutre, comme l'icone du panneau de touche. */
  const on=hsl[1]<0.15?kbMix(main,white,0.75):ntHslRgb(hsl[0],Math.min(1,Math.max(0.9,hsl[1])),0.78);
  const a=panel.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
  const L=0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
  const text=(1.05/(L+0.05))>=((L+0.05)/0.057)?[255,255,255]:[16,21,16];
  const s=document.documentElement.style;
  s.setProperty('--nt-panel',kbRgba(panel,0.88));
  s.setProperty('--nt-border',kbRgba(kbMix(main,white,0.55),0.35));
  s.setProperty('--nt-text',kbRgba(text));
  s.setProperty('--nt-text-off',kbRgba(text,0.72));
  s.setProperty('--nt-on',kbRgba(on));
}
/* Palette du MENU PRINCIPAL et de la fiche joueur : panneau noir + UNE couleur,
   celle du menu. Memes bases que kbApplyColor / ntApplyColor, donc tout reste
   assorti. Chaque variable est un triplet "r,g,b" ; l'opacite est reglee dans le CSS. */
function mnApplyColor(r,g,b){
  const main=[r,g,b],black=[0,0,0],white=[255,255,255];
  const lum=c=>{const a=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
                return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]};
  /* ---- COULEURS VIVES ----
     L'ancienne version melangeait la couleur au NOIR pour l'assombrir. Sur un
     bleu (95,190,255) cela donnait un bleu acier terne (46,92,123) : tout le
     menu avait un aspect gris. On assombrit desormais en HAUTEUR DE LUEUR
     (HSL) en gardant la SATURATION a fond : le bleu reste bleu, le rouge reste
     rouge, seule la luminosite baisse. Resultat : couleurs franches sur fond
     noir. */
  const grey=ntHsl(main)[1]<0.10;
  /* une couleur presque noire disparaitrait sur le fond noir : on l'eclaircit */
  let acc=main;
  if(!grey){
    const h0=ntHsl(main);
    /* saturation minimale 0.9, lueur cadrnee 0.55..0.72 : la teinte choisie
       reste toujours nette, jamais passe-partout */
    acc=ntHslRgb(h0[0],Math.min(1,Math.max(0.9,h0[1])),Math.min(0.72,Math.max(0.55,h0[2])));
  }
  if(lum(acc)<0.03)acc=kbMix(acc,white,0.35);
  /* le texte reste BLANC sur l'accent (comme sur les captures) : si la couleur est
     trop claire pour ca (jaune, blanc...), le remplissage est assombri jusqu'a ce
     que le blanc ait au moins 3,2:1 de contraste, meme sur le haut du degrade.
     On garde la saturation pleine a chaque etape (+0.08 compense l'ecartement
     HSL quand la lueur descend sous 0.5). */
  let fill=acc,k=0;
  if(grey){
    while(1.05/(lum(kbMix(fill,white,0.18))+0.05)<3.2&&k++<14)fill=kbMix(fill,black,0.07);
  }else{
    while(1.05/(lum(kbMix(fill,white,0.18))+0.05)<3.2&&k++<24){
      const fh=ntHsl(fill);
      fill=ntHslRgb(fh[0],Math.min(1,fh[1]+0.08),Math.max(0.22,fh[2]-0.03));
    }
  }
  /* haut et bas du degrade de la selection : meme teinte vive, lueur +-0.13 */
  const ph=ntHsl(fill);
  const hi=ntHslRgb(ph[0],ph[1],Math.min(0.88,ph[2]+0.13));
  const lo=ntHslRgb(ph[0],ph[1],Math.max(0.13,ph[2]-0.13));
  /* accent tres lumineux (texte, barres) : teinte du menu. Gris -> gris clair
     neutre (forcer la saturation donnerait du rose). */
  const hsl=ntHsl(acc);
  const on=hsl[1]<0.15?kbMix(acc,white,0.75):ntHslRgb(hsl[0],Math.min(1,Math.max(0.85,hsl[1])),0.72);
  const t=c=>c.join(','),s=document.documentElement.style;
  s.setProperty('--mn-bg-rgb',t(kbMix(acc,black,0.94)));
  /* fond du panneau : quasi-noir TEINTE a 10 % par la couleur, au lieu d'un
     anthracite gris plat (30,31,36). Ca reste un fond noir (demande), mais il
     n'est plus gris : il porte la couleur du menu. */
  s.setProperty('--mn-char-rgb',t(kbMix(acc,[8,9,12],0.90)));
  s.setProperty('--mn-acc-rgb',t(acc));
  s.setProperty('--mn-fill-rgb',t(fill));
  s.setProperty('--mn-hi-rgb',t(hi));
  s.setProperty('--mn-lo-rgb',t(lo));
  s.setProperty('--mn-on-rgb',t(on));
}
function ntSchedule(t){
  if(!(t.remaining>0))return;
  t.startedAt=Date.now();
  t.timeout=setTimeout(()=>dismissNt(t.id),t.remaining);
}
function dismissNt(id){
  const t=ntToasts[id];if(!t)return;
  delete ntToasts[id];clearTimeout(t.timeout);
  t.el.classList.add('leaving');
  setTimeout(()=>{if(t.el.parentNode)t.el.parentNode.removeChild(t.el)},240);
}
/* Signature inchangee (header,message,duration,type) : le Lua n'a rien a changer. */
function notify(header,message,duration,type){
  const level=NT_LEVELS.indexOf(type)>=0?type:'info';
  let dur=Number(duration);
  if(duration===undefined||duration===null||!isFinite(dur))dur=NT_DEFAULT;
  dur=dur<=0?0:Math.max(500,Math.min(60000,dur));
  const title=String(header==null?'':header),msg=String(message==null?'':message);
  if(!title&&!msg)return null;
  const id=ntNext++,el=document.createElement('div');
  el.className='nt-toast';el.setAttribute('data-level',level);
  el.setAttribute('role',level==='error'?'alert':'status');
  const icon=document.createElement('span');
  icon.className='nt-icon';icon.setAttribute('aria-hidden','true');
  icon.innerHTML=NT_ICONS[level];
  const body=document.createElement('div');body.className='nt-body';
  const tEl=document.createElement('p');tEl.className='nt-title';
  tEl.textContent=title||msg;body.appendChild(tEl);
  if(title&&msg){const mEl=document.createElement('p');mEl.className='nt-msg';mEl.textContent=msg;body.appendChild(mEl)}
  const close=document.createElement('button');
  close.type='button';close.className='nt-close';close.setAttribute('aria-label','Fermer');
  close.textContent='×';close.addEventListener('click',()=>dismissNt(id));
  el.append(icon,body,close);
  if(dur>0){
    const timer=document.createElement('span');
    timer.className='nt-timer';timer.setAttribute('aria-hidden','true');
    timer.style.animationDuration=dur+'ms';el.appendChild(timer);
  }
  const t={id,el,duration:dur,remaining:dur,startedAt:0,timeout:null};
  ntToasts[id]=t;
  el.addEventListener('mouseenter',()=>{
    if(!t.timeout)return;
    clearTimeout(t.timeout);t.timeout=null;t.remaining-=Date.now()-t.startedAt;
  });
  el.addEventListener('mouseleave',()=>{
    if(t.duration>0&&!t.timeout&&!el.classList.contains('leaving'))ntSchedule(t);
  });
  ntStack.insertBefore(el,ntStack.firstChild);
  ntSchedule(t);
  const ids=Object.keys(ntToasts).map(Number).sort((a,b)=>a-b);
  while(ids.length>NT_MAX)dismissNt(ids.shift());
  return id;
}
/* defaut = le vert de reference ; le Lua le remplace via setMenuColor */
ntApplyColor(84,150,96);mnApplyColor(84,150,96);

/* ================= MESSAGES DU JEU ================= */
addEventListener('message',e=>{
  const d=e.data||{};
  switch(d.action){
    case 'setCurrent':
      /* Lua encode un tableau Lua vide en {} (objet JS, pas tableau) : tel quel
         B.menu.forEach levait "n'est pas une fonction", le rendu s'arretait
         net et le compteur restait bloque sur 0/0. On normalise toujours. */
      B.cur=(parseInt(d.current,10)||1)-1;
      B.menu=(Array.isArray(d.menu)?d.menu:[]).filter(o=>o&&typeof o==='object');
      showMenu();break;
    case 'showMenu':d.visible?showMenu():hideMenuNow();break;
    case 'setTabs':B.tabs=d.tabs||[];B.tab=d.index;renderTabs();break;
    case 'setTabIndex':B.tab=d.index||0;renderTabs();break;
    case 'resetTabs':B.tabs=['Main Menu'];B.tab=0;renderTabs();break;
    case 'setMenuPos':
      if(d.x!==undefined)B.left=d.x+'vh';
      if(d.y!==undefined)B.top=d.y+'vh';
      if(live()){B.root.style.left=B.left;B.root.style.top=B.top;positionPlayerCard()}break;
    case 'setBanner':if(d.url){B.banner=d.url;if(live())B.img.src=d.url}break;
    case 'setMenuColor':{
      /* canal invalide ou absent -> 150 ; borne a 0..255 pour que toutes les nuances restent calculables */
      const ch=v=>{const n=Math.round(Number(v));return isFinite(n)?clamp(n,0,255):150};
      const r=ch(d.r),g=ch(d.g),b=ch(d.b),s=document.documentElement.style;
      const lt=v=>Math.round(v+(255-v)*0.55);
      s.setProperty('--accent-rgb',`${r},${g},${b}`);
      s.setProperty('--accent-light',`${lt(r)},${lt(g)},${lt(b)}`);s.setProperty('--line-rgb',`${lt(r)},${lt(g)},${lt(b)}`);
      kbApplyColor(r,g,b);ntApplyColor(r,g,b);mnApplyColor(r,g,b);kblApplyColor(r,g,b);break}
    case 'setBreadcrumb':B.crumb=Array.isArray(d.parts)?d.parts:(d.path?String(d.path).split('>').map(s=>s.trim()):[]);renderCrumb();break;
    case 'setTabStyle':document.documentElement.dataset.tabs=d.style||'';break;
    case 'setSelectStyle':document.documentElement.dataset.select=d.style||'';break;
    case 'setEdgeStyle':document.documentElement.dataset.edge=d.style||'';break;
    case 'setTitleStyle':document.documentElement.dataset.title=d.style||'';renderCrumb();break;
    case 'setBgStyle':document.documentElement.dataset.bg=d.style||'';break;
    case 'showInputPrompt':{
      I.title=d.title;I.value=d.showInput?d.value:'';
      /* TOUTES les prompts passent par le panneau "Choose Menu Key" :
         keybinds ET saisie texte (Spawn Vehicle, URL, plaque...). Aucun
         <input> n'est nécessaire : c'est le Lua qui pousse le buffer et le
         curseur via updateInputPrompt. */
      const mode=d.mode||'typeable';
      K.title=I.title;K.value=I.value;K.mode=mode;
      K.cursor=d.cursor==null?String(I.value||'').length:d.cursor;
      K.hint=mode==='itemkeybind'?'Touche pour lier  ·  Échap pour annuler'
                                   :'Entrée pour valider  ·  Échap pour annuler';
      keyUI(!!d.showInput);inputUI(false);
      if(d.showInput)I.blocking=true;else unblock();break}
    case 'hideInputPrompt':inputUI(false);keyUI(false);unblock();break;
    case 'setKeybinds':kblRender(d.rows||[]);break;
    case 'setUiScale':{const s=Number(d.scale);UI.scale=(isFinite(s)&&s>0)?s:1;uiApplyScale();break}
    case 'updateInputPrompt':{
      I.title=d.title;I.value=d.value;
      K.title=I.title;K.value=I.value;
      K.cursor=d.cursor==null?String(I.value||'').length:d.cursor;
      if(K.slot.els&&!K.slot.out)keyUI(true);
      else inputUI(!!I.slot.els&&!I.slot.out);
      break}
    case 'displayFreecam':
      /* d.options repart de zero quand une liste fraiche arrive : le Lua
         reinitialise son index en parallele, sinon les deux se desynchronisent
         des la deuxieme ouverture. */
      F.opts=d.options||[];
      if(d.options)F.h=0;
      F.wl=d.weaponOptions||F.wl;F.vl=d.vehicleOptions||F.vl;
      if(d.weaponIndex!==undefined)F.w=d.weaponIndex-1;
      if(d.vehicleIndex!==undefined)F.v=d.vehicleIndex-1;
      present(F.slot,!!d.visible,buildFreecam,planFreecam);renderFreecam();break;
    case 'updateWeapon':F.w=d.index-1;renderFreecam();break;
    case 'updateVehicle':F.v=d.index-1;renderFreecam();break;
    case 'scroll':
      if(F.opts.length){F.h=(F.h+(d.direction==='up'?-1:1)+F.opts.length)%F.opts.length;renderFreecam()}break;
    case 'displayCrosshair':crossUI(!!d.visible);break;
    case 'displayPlayerCard':playerCardShow(d);break;
    case 'setFooterUser':
      /* Le nom n'est plus affiche en bas a gauche : on ne fait que le
         conserver, l'emplacement reste vide par defaut. */
      B.userName=String(d.name).slice(0,32);break;
    case 'setFooterLogo':{
      if(!d.url)break;
      B.logoUrl=String(d.url);
      applyFooterLogo(B.logoEl,B.logoUrl);break}
    case 'notify':notify(d.header||'Info',d.message,d.duration??4000,d.type||'info');break;
  }
});
